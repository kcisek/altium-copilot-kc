      kinds.length > 1 ? Shell.segmented({ label: "Layout", items: kinds, current: view.layout, onChange: (id) => {
        view.layout = id;
        view.autoFit = true;
        if (id === "pads") askDetail("get_component_placement", placementArgs);
        renderTab();
      } }).el : null,
      geo && ["quad", "dual"].includes(view.layout) ? Shell.segmented({ label: "Labels", items: [
        { id: "number", label: "Number" }, { id: "name", label: "Name" }, { id: "net", label: "Net" }],
      current: view.labels, onChange: (id) => { view.labels = id; view.autoFit = true; renderTab(); } }).el : null,
      pads ? Shell.segmented({ label: "In each pad", items: [{ id: "code", label: "Function code" }, { id: "number", label: "Pin number" }],
        current: view.padLabels, onChange: (id) => { view.padLabels = id; renderTab(); } }).el : null,
      el("span", { class: "grow" }),
      geo ? el("button", { type: "button", class: "btn", text: "−", "aria-label": "Zoom out", on: { click: () => zoom(1 / 1.25) } }) : null,
      geo ? el("button", { type: "button", class: "btn", text: "+", "aria-label": "Zoom in", on: { click: () => zoom(1.25) } }) : null,
      geo ? el("button", { type: "button", class: "btn", text: "Fit", title: "Fit the diagram in its pane", on: { click: () => { view.autoFit = true; fitWidth(); } } }) : null);
    ui.canvas = el("div", { class: "canvas" });
    ui.readout = el("p", { class: "readout", "aria-hidden": "true" });
    const noteEl = el("p", { class: "layoutnote" }, note, retry ? " " : null, retry);
    // Pins the Pins tab's filters hide are faded here: said so, with a way back.
    const faded = pins.filter((row) => !shownPin(row)).length;
    const fadedEl = faded ? el("p", { class: "layoutnote" }, `${plural(faded, "pin")} ${faded === 1 ? "is" : "are"} faded: the Pins tab's filters hide ${faded === 1 ? "it" : "them"}. `,
      el("button", { type: "button", class: "btn-link", text: "Show every pin", on: { click: clearFilters } })) : null;
    const about = [legend(pins), unplacedList(unplaced, unplacedWhy, items),
      strays.length ? el("p", { class: "help", text: `Pads on the board with no pin of the map: ${strays.slice(0, 20).join(", ")}${strays.length > 20 ? ` and ${strays.length - 20} more` : ""}.` }) : null,
      geo ? el("p", { class: "foot", text: "Keys: Tab to the diagram, arrows move between pins, Home and End go to the first and last, Enter or Space selects (the table and the details follow), Esc closes the details." }) : null];
    if (short() && geo) {
      // A short host: the diagram keeps the height; what it shows and the pins it leaves out
      // wait behind one disclosure (its summary counts them). A Retry stays in sight.
      const box = el("details", { class: "more", open: view.aboutOpen },
        el("summary", { text: `What the diagram shows: legend${unplaced.length ? `, ${plural(unplaced.length, "pin")} not on it` : ""}` }),
        retry ? null : noteEl, about);
      box.addEventListener("toggle", () => { view.aboutOpen = box.open; });
      Shell.append(ui.panel, [tools, retry ? noteEl : null, fadedEl, ui.canvas, ui.readout, box]);
    } else {
      Shell.append(ui.panel, [tools, noteEl, fadedEl, geo ? ui.canvas : null, geo ? ui.readout : null, about]);
    }
    if (geo) drawDiagram(geo, pins);
  }

  /** Clear the Pins tab's filters (function chips, text) from the Package tab; focus goes
   *  to the diagram's pin in the tab order. */
  function clearFilters() {
    view.chipsOn = null;
    view.query = "";
    renderTab();
    const mark = (ui.marks || []).find((item) => item.el.getAttribute("tabindex") === "0");
    if (mark) mark.el.focus({ preventScroll: true });
  }

  function layoutNote(plan) {
    if (plan.kind === "grid") {
      return `Ball grid by pin name: rows ${plan.rows.slice(0, 3).join(", ")}${plan.rows.length > 3 ? " … " + plan.rows[plan.rows.length - 1] : ""} as the names give them (letters no ball uses are left out) and columns 1 to ${plan.cols}, A1 at the top left. A layout by name, not the footprint.`;
    }
    const prefix = plan.prefix ? ` (named ${plan.prefix}1 to ${plan.prefix}${plan.slots})` : "";
    if (plan.kind === "quad") {
      return `Pins 1 to ${plan.slots}${prefix} by number, counter-clockwise from pin 1 at the top left, ${plan.slots / 4} a side (the usual QFP and QFN order, seen from the top). A layout by pin number, not the footprint: check the package drawing.`;
    }
    return `Pins 1 to ${plan.slots}${prefix} by number, down the left side and up the right, ${plan.slots / 2} a side (the usual dual-row order, seen from the top). A layout by pin number, not the footprint: check the package drawing.`;
  }

  function markLabel(mark) {
    const item = mark.item;
    if (!item) return mark.pad ? `Pad ${mark.pad.pin}: no pin of the map` : `No pin ${mark.slot} in the result`;
    const info = fnInfo(item.function);
    const findings = view.data.findingsByPin.get(item._key) || [];
    return [`Pin ${item.pin}`, item.name && item.name !== item.pin ? item.name : null,
            item.net ? `net ${item.net}` : item.function === "unconnected" ? null : "not connected",
            `${info.label}${item.role ? ` ${item.role}` : ""}`, findingWords(findings) || null,
            shownPin(item) ? null : "faded: the Pins tab's filters hide it"].filter(Boolean).join(", ");
  }

  function drawDiagram(geo, pins) {
    const root = svg("svg", { width: geo.width, height: geo.height, viewBox: `0 0 ${geo.width} ${geo.height}`, role: "group",
                              "aria-label": `Package diagram of ${view.part}: ${plural(pins.length, "pin")}` });
    if (geo.body) {
      root.appendChild(svg("rect", { class: "pkg", x: geo.body.x, y: geo.body.y, width: geo.body.w, height: geo.body.h, rx: 4 }));
      root.appendChild(svg("circle", { class: "pin1", cx: geo.body.x + 12, cy: geo.body.y + 12, r: 4 }));
      root.appendChild(svg("text", { class: "pkgtext", x: geo.body.x + geo.body.w / 2, y: geo.body.y + geo.body.h / 2, "text-anchor": "middle", text: view.part }));
      root.appendChild(svg("text", { class: "pkgsub", x: geo.body.x + geo.body.w / 2, y: geo.body.y + geo.body.h / 2 + 15, "text-anchor": "middle", text: "layout by pin number" }));
    }
    for (const label of geo.extra) root.appendChild(svg("text", { class: "axis", x: label.x, y: label.y, "text-anchor": label.anchor, text: label.text }));
    if (geo.pin1) {
      root.appendChild(svg("circle", { class: "pin1", cx: geo.pin1.x, cy: geo.pin1.y, r: 2.5 }, svg("title", { text: `Pin ${geo.pin1.pin}` })));
    }
    ui.marks = [];
    ui.markEls = new Map();
    const selectedKey = view.selected && view.selected.kind === "pin" ? view.selected.key : null;
    let roving = null;
    for (const mark of geo.marks) {
      if (mark.label) {
        root.appendChild(svg("text", { class: "plabel", x: mark.label.x, y: mark.label.y, "text-anchor": mark.label.anchor,
                                       transform: mark.label.rotate ? `rotate(${mark.label.rotate} ${mark.label.x} ${mark.label.y})` : null,
                                       text: mark.label.text }));
      }
      if (!mark.item && !mark.pad) {
        root.appendChild(svg("rect", { class: "slot-empty", x: mark.x - mark.w / 2, y: mark.y - mark.h / 2, width: mark.w, height: mark.h },
          svg("title", { text: markLabel(mark) })));
        continue;
      }
      const item = mark.item;
      const fam = item ? famOf(item.function) : "pad";
      const group = svg("g", { class: `pinmark fam-${fam}`, tabindex: "-1", role: "button", "aria-label": markLabel(mark),
                               data: item ? { key: item._key } : null, transform: `translate(${mark.x} ${mark.y})` });
      group.appendChild(svg("title", { text: markLabel(mark) }));
      group.appendChild(mark.round
        ? svg("circle", { class: "body", r: mark.w / 2 })
        : svg("rect", { class: "body", x: -mark.w / 2, y: -mark.h / 2, width: mark.w, height: mark.h, rx: 2 }));
      const room = Math.min(mark.w, mark.h);
      // In each pin its function's code; on the board's pads, the pin number when asked.
      const inside = mark.pad && view.padLabels === "number" ? String(mark.pad.pin) : item ? fnInfo(item.function).code : "";
      if (inside && room >= 11) {
        const text = svg("text", { class: "code", "text-anchor": "middle", y: 3, transform: mark.vertical ? "rotate(-90)" : null, text: inside });
        // A longer number is squeezed into the pad rather than drawn over its neighbours.
        if (inside.length > 2) {
          text.setAttribute("textLength", String(room - 2));
          text.setAttribute("lengthAdjust", "spacingAndGlyphs");
        }
        group.appendChild(text);
      }
      const findings = item ? view.data.findingsByPin.get(item._key) || [] : [];
      if (findings.length) {
        const worst = findings.some((finding) => finding.severity === "warning") ? "warning" : "info";
        group.appendChild(svg("circle", { class: `fmark ${worst}`, cx: mark.w / 2 - 1, cy: -mark.h / 2 + 1, r: 3 }));
      }
      if (item) {
        group.addEventListener("click", () => {
          rove(mark, false);
          selectPin(item._key, { from: "diagram" });
        });
        group.addEventListener("mouseenter", () => showReadout(mark));
        group.addEventListener("focus", () => showReadout(mark));
        ui.markEls.set(item._key, group);
        if (item._key === selectedKey) roving = group;
      }
      group.addEventListener("keydown", (event) => onMarkKey(event, mark));
      mark.el = group;
      ui.marks.push(mark);
      root.appendChild(group);
    }
    const first = roving || (ui.marks[0] && ui.marks[0].el);
    if (first) first.setAttribute("tabindex", "0");
    clear(ui.canvas).appendChild(root);
    ui.size = { width: geo.width, height: geo.height };
    applyMarks();
    if (view.autoFit) requestAnimationFrame(fitWidth);
    else setScale(view.scale);
  }

  /** Dim the pins the filters hide and mark the selected one (no redraw: focus stays). */
  function applyMarks() {
    const selectedKey = view.selected && view.selected.kind === "pin" ? view.selected.key : null;
    for (const mark of ui.marks || []) {
      if (!mark.item) continue;
      const selected = mark.item._key === selectedKey;
      mark.el.classList.toggle("dim", !shownPin(mark.item));
      mark.el.classList.toggle("sel", selected);
      // The selection and the fading said to assistive technology too, not by colour alone.
      mark.el.setAttribute("aria-pressed", selected ? "true" : "false");
      const label = markLabel(mark);
      if (mark.el.getAttribute("aria-label") !== label) {
        mark.el.setAttribute("aria-label", label);
        const title = mark.el.querySelector("title");
        if (title) title.textContent = label;
      }
    }
    for (const chip of ui.panel ? ui.panel.querySelectorAll(".pinchip[data-key]") : []) {
      const item = view.data.byKey.get(chip.dataset.key);
      chip.setAttribute("aria-pressed", chip.dataset.key === selectedKey ? "true" : "false");
      chip.classList.toggle("dim", Boolean(item) && !shownPin(item));
    }
  }

  function showReadout(mark) {
    if (ui.readout) ui.readout.textContent = markLabel(mark);
  }

  function rove(target, scroll = true) {
    for (const mark of ui.marks || []) mark.el.setAttribute("tabindex", mark === target ? "0" : "-1");
    target.el.focus({ preventScroll: !scroll });
    // Keep the pin in view inside the scrolled diagram.
    if (scroll && typeof target.el.scrollIntoView === "function") target.el.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  /** Arrow keys move to the nearest pin that way; Home, End; Enter or Space select. */
  function onMarkKey(event, mark) {
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    const marks = ui.marks || [];
    let target = null;
    if (dirs[event.key]) {
      const [ux, uy] = dirs[event.key];
      let best = Infinity;
      for (const other of marks) {
        if (other === mark) continue;
        const dx = other.x - mark.x;
        const dy = other.y - mark.y;
        const along = dx * ux + dy * uy;
        if (along <= 0.5) continue;
        const score = along + Math.abs(dx * uy - dy * ux) * 3;
        if (score < best) { best = score; target = other; }
      }
    } else if (event.key === "Home") target = marks[0];
    else if (event.key === "End") target = marks[marks.length - 1];
    else if ((event.key === "Enter" || event.key === " ") && mark.item) {
      event.preventDefault();
      selectPin(mark.item._key, { from: "diagram" });
      return;
    } else return;
    event.preventDefault();
    if (target) rove(target);
  }

  function setScale(scale) {
    view.scale = Math.max(0.2, Math.min(4, scale));
    const root = ui.canvas && ui.canvas.querySelector("svg");
    if (root && ui.size) {
      root.setAttribute("width", Math.ceil(ui.size.width * view.scale));
      root.setAttribute("height", Math.ceil(ui.size.height * view.scale));
    }
  }

  /** Fit the diagram in the canvas: its width, and its height when the canvas has a
   *  height limit (the panes' height) unless that leaves it under 70 %, at most 1.6 times. */
  function fitWidth() {
    if (!ui.canvas || !ui.size || !ui.canvas.clientWidth) return;
    const limit = parseFloat(getComputedStyle(ui.canvas).maxHeight);
    const byHeight = Number.isFinite(limit) && limit > 80 ? (limit - 4) / ui.size.height : Infinity;
    setScale(Math.min(1.6, (ui.canvas.clientWidth - 4) / ui.size.width, Math.max(byHeight, 0.7)));
  }

  function zoom(factor) {
    view.autoFit = false;
    setScale(view.scale * factor);
  }

  function legend(pins) {
    const counts = new Map();
    for (const row of pins) {
      const fam = famOf(row.function);
      if (!counts.has(fam)) counts.set(fam, new Map());
      const fns = counts.get(fam);
      fns.set(row.function, (fns.get(row.function) || 0) + 1);
    }
    const items = FAMILY_ORDER.filter((fam) => counts.has(fam)).map((fam) => {
      const fns = [...counts.get(fam).entries()].sort((a, b) => fnRank(a[0]) - fnRank(b[0]));
      const total = fns.reduce((sum, [, count]) => sum + count, 0);
      return el("li", {}, swatch(fns[0][0]), el("span", { text: `${FAMILIES[fam]} (${total})` }),
        el("span", { class: "codes", text: fns.map(([fn, count]) => `${fnInfo(fn).code} ${fnInfo(fn).label} ${count}`).join(", ") }));
    });
    items.push(el("li", {}, el("span", { class: "badge warning", text: "•" }), el("span", { text: "a dot on a pin: it has a finding (warning or info)" })));
    return el("ul", { class: "legend", "aria-label": "Legend: the colours, codes and borders by function" }, items);
  }

  function unplacedList(pins, why, items) {
    if (!pins.length) return null;
    return el("div", { class: "section-gap" },
      el("p", { class: "help", text: `${why}: ${plural(pins.length, "pin")}${why === "Not on the layout" ? " (a name or number outside the layout's scheme, or a second pin for one place)" : ""}.` }),
      el("ul", { class: "pinlist" }, [...pins].sort(Shell.naturally).map((pin) => {
        const item = items.get(pin);
        const key = item ? item._key : null;
        const selected = view.selected && view.selected.kind === "pin" && view.selected.key === key;
        return el("li", {}, el("button", { type: "button", class: `pinchip${item && !shownPin(item) ? " dim" : ""}`,
                                           "aria-pressed": selected ? "true" : "false", disabled: !item, data: key ? { key } : null,
                                           title: item ? markLabel({ item }) : String(pin),
                                           on: { click: () => { if (key) selectPin(key, { from: "list" }); } } },
          item ? swatch(item.function) : null, String(pin), item ? el("span", { class: "code", text: fnInfo(item.function).code }) : null));
      })));
  }

  // ---------- findings ----------

  function findingsTab() {
    const data = view.data;
    const switcher = Shell.segmented({ label: "Group by", items: [
      { id: "check", label: "Check" }, { id: "severity", label: "Severity" }, { id: "none", label: "None" }],
    current: view.findGroup, onChange: (id) => {
      view.findGroup = id;
      if (ui.findTable) ui.findTable.setGroup(findGroupSpec());
    } });
    const notRun = Object.entries(data.notChecked);
    const spec = tableSpec("findings", [
      // data-fid: the row's finding, so keyboard focus finds its row again after a redraw.
      { key: "severity", label: "Severity", value: (finding) => sevRank(finding.severity), text: (finding) => finding.severity,
        render: (finding) => el("span", { data: { fid: String(finding._id) } }, sevBadge(finding.severity)) },
      { key: "check", label: "Check", cls: "c-name", value: (finding) => checkTitle(finding.check) },
      { key: "mcu", label: "Part", hidden: data.mapped.length < 2 },
      { key: "pins", label: "Pins", cls: "c-name", value: (finding) => finding._pins.join(" "),
        render: (finding) => el("span", { class: "findpins" }, finding._pins.slice(0, 6).map((pin) => pinButton(finding.mcu, pin)),
          finding._pins.length > 6 ? el("span", { class: "muted", text: `+${finding._pins.length - 6} more` }) : null) },
      { key: "issue", label: "Finding", cls: "c-msg" },
    ], null);
    ui.findTable = quiet(Shell.table({
      label: "Findings", rows: data.findings, group: findGroupSpec(), rowKey: (finding) => finding._id,
      onActivate: (finding) => selectFinding(finding._id), sort: spec.sort,
      empty: `No finding from ${plural(data.checksRun.length, "check")} run.`,
      columns: spec.columns,
    }));
    if (view.selected && view.selected.kind === "finding") ui.findTable.select((finding) => finding._id === view.selected.id);
    Shell.append(ui.panel, [
      el("div", { class: "filters" }, switcher.el),
      ui.findTable.el,
      notRun.length ? el("p", { class: "help", text: `Not checked: ${notRun.map(([check, why]) => `${checkTitle(check)} (${why})`).join("; ")}.` }) : null,
      data.findings.length < data.findingsTotal ? el("p", { class: "help", text: `${data.findings.length} of ${plural(data.findingsTotal, "finding")} read: ${data.stopReason || "the paging stopped"}.` }) : null,
      sectionsBlock(),
    ]);
  }

  function findGroupSpec() {
    if (view.findGroup === "none") return null;
    if (view.findGroup === "severity") {
      return { key: (finding) => finding.severity, label: (key) => sevBadge(key),
               order: (a, b) => sevRank(a) - sevRank(b) };
    }
    return {
      key: (finding) => finding.check,
      label: (key) => checkTitle(key),
      count: (key, rows) => {
        const out = [];
        const warnings = rows.filter((finding) => finding.severity === "warning").length;
        if (warnings) out.push(el("span", { class: "badge warning", text: plural(warnings, "warning") }));
        if (rows.length - warnings) out.push(el("span", { class: "badge info", text: `${rows.length - warnings} info` }));
        return out;
      },
      // The checks in the tool's order; a check it may add later after them.
      order: (a, b) => (CHECKS.includes(a) ? CHECKS.indexOf(a) : CHECKS.length) - (CHECKS.includes(b) ? CHECKS.indexOf(b) : CHECKS.length) ||
        Shell.naturally(a, b),
    };
  }

  /** What the checks found beside their findings: the debug interfaces, the boot and strap
   *  pins with their level, and the external memories. */
  function sectionsBlock() {
    const blocks = sectionItems();
    if (!blocks.length) return null;
    if (!short()) return el("div", { class: "sections" }, blocks);
    return el("details", { class: "more sections section-gap" }, el("summary", { text: "Debug access, boot pins and memories" }), blocks);
  }

  function sectionItems() {
    const sections = view.data.sections;
    const blocks = [];
    const debug = sections.debug_access || {};
    const debugItems = [];
    for (const [mcu, interfaces] of Object.entries(debug)) {
      for (const entry of interfaces || []) {
        const reached = `${entry.reached} of ${plural(entry.required, "required pin")} reach a header or test point`;
        debugItems.push(el("li", {}, el("strong", { text: `${mcu} ${String(entry.interface).toUpperCase()}` }),
          `: ${entry.complete ? "complete" : "incomplete"}, ${reached}${(entry.missing_roles || []).length ? `; no pin for ${entry.missing_roles.join(", ")}` : ""}. `,
          el("span", { class: "findpins" }, (entry.pins || []).map((pin) => pinButton(mcu, pin.pin, `${pin.role} ${pin.pin}`)))));
      }
    }
    if (debugItems.length) blocks.push(el("h3", { text: "Debug access" }), el("ul", {}, debugItems));
    const straps = sections.boot_straps || {};
    const strapItems = [];
    for (const [mcu, entries] of Object.entries(straps)) {
      for (const entry of entries || []) {
        strapItems.push(el("li", {}, pinButton(mcu, entry.pin, `${mcu} pin ${entry.pin}`),
          ` ${entry.name || ""} (${entry.kind}): ${String(entry.level || "").replace(/_/g, " ")}${entry.level_basis ? `, ${entry.level_basis}` : ""}.`));
      }
    }
    if (strapItems.length) blocks.push(el("h3", { text: "Boot and strap pins" }), el("ul", {}, strapItems));
    const memories = sections.external_memory || [];
    if (memories.length) {
      blocks.push(el("h3", { text: "External memory" }), el("ul", {}, memories.map((entry) => el("li", {},
        el("strong", { text: entry.designator }), ` ${entry.part ? `(${entry.part}) ` : ""}on a ${entry.bus} bus${entry.use ? `, ${entry.use}` : ""}: `,
        (entry.external_access || []).length ? `reachable from ${entry.external_access.join(", ")}.` : "no header or test point reaches its bus."))));
    }
    return blocks;
  }

  // ---------- outputs ----------

  async function textPage(args, format, offset, expect) {
    const page = Shell.resultJson(await call("get_firmware_pin_map", { ...args, format, offset }));
    if (page && page.error) throw new Error(page.message || page.error);
    if (!page || typeof page[format] !== "string") throw new Error(`it holds no ${OUTPUTS[format]} text`);
    if (expect && stamp(page) !== stamp(expect)) throw changedError(page, expect);
    if (expect && (page.variant !== expect.variant || page.rows_total !== expect.rows_total)) {
      throw new Error(`it is not a page of this ${OUTPUTS[format]} (${page.variant}, ${plural(page.rows_total, "pin")})`);
    }
    return page;
  }

  /** Ask the tool for one format with the map's mcu and checks, every page of it. again:
   *  from offset 0 whatever is kept (Retry, Ask again); more: the pages after those kept
   *  (the call's own first page, or a read that stopped). */
  async function askOutput(format, { again = false, more = false } = {}) {
    if (!view.data) return;
    const args = { ...view.data.args };
    const entry = view.outputs.get(format);
    const usable = Boolean(entry && !entry.loading && !entry.error && sameArgs(entry.args, args));
    const kept = !again && !more && entry && (entry.loading || usable);
    const onFrom = more && usable && entry.next !== null && entry.next !== undefined && !entry.again;
    if (!kept && (view.busy || view.closed || !canCall() || (more && !onFrom))) {
      if (entry) view.outputFormat = format;
      renderTab();
      return;
    }
    view.outputFormat = format;
    if (kept) {
      renderTab();
      return;
    }
    const pages = onFrom ? [...entry.pages] : [];
    const fromResult = Boolean(onFrom && entry.fromResult);
    view.outputs.set(format, { loading: true, args, pages });
    view.busy = onFrom ? `Asking ${TOOL} for the rest of the ${OUTPUTS[format]}, from offset ${entry.next}…` : `Asking ${TOOL} for the ${OUTPUTS[format]}…`;
    renderTab();
    renderHeadBlocks();
    Shell.announce(view.busy);
    let failed = null;
    try {
      if (!pages.length) pages.push(await textPage(args, format, 0, null));
      const before = pages.length;
      const read = await Shell.readPages({
        first: pages[pages.length - 1], tool: TOOL, budget: Shell.pageBudget(MAX_PAGES, onFrom ? 0 : 1), closed: () => view.closed,
        pageOffset: textNext,
        getPage: async (offset) => {
          try {
            return await textPage(args, format, offset, pages[0]);
          } catch (error) {
            failed = error;
            throw error;
          }
        },
        onPage: (page) => pages.push(page),
      });
      // Pages are numbered from offset 0 (readPages counts from the page it starts at).
      const stopped = !read.stopped ? "" : view.closed ? "the view was closed"
        : read.stopped.replace(/^page \d+ of/, `page ${pages.length + 1} of`);
      view.outputs.set(format, { pages, args, stopped, fromResult, again: Boolean(failed && failed.changed),
                                 next: stopped ? textNext(pages[pages.length - 1]) : null });
      Shell.announce(`${OUTPUTS[format]}: ${plural(pages.length - before + (onFrom ? 0 : 1), "page")} read`);
    } catch (error) {
      view.outputs.set(format, { error: view.closed ? "the view was closed" : error.message, args, pages: [], next: null });
      if (!view.closed) Shell.announce(`${OUTPUTS[format]} failed`);
    }
    view.busy = "";
    renderHeadBlocks();
    if (view.tab === "outputs") renderTab();
  }

  function outputsTab() {
    const data = view.data;
    const canAsk = canCall() && !view.closed;
    // A format neither kept nor askable (no tool calls, the view closed) is a button that
    // says so rather than one that does nothing.
    const buttons = OUTPUT_KEYS.map((format) => el("button", {
      type: "button", class: "btn", text: OUTPUTS[format], "aria-pressed": view.outputFormat === format ? "true" : "false",
      "aria-disabled": (view.busy || !canAsk) && !view.outputs.has(format) ? "true" : null,
      title: `${argText({ ...data.args, format })}: the tool's own ${OUTPUTS[format]} text${canAsk || view.outputs.has(format) ? "" : " (ask Claude for it: the view cannot ask)"}`,
      on: { click: () => askOutput(format) },
    }));
    Shell.append(ui.panel, [
      // A short host: the buttons' titles say it, the text keeps the height.
      short() ? null : el("p", { class: "help", text: `The tool's own text for the firmware repository, asked with the map's arguments and shown as ${TOOL} wrote it, page by page: select it and copy it. A heuristic starting point: check every line against the schematic and the datasheet.` }),
      el("div", { class: "outs", role: "group", "aria-label": "Outputs" }, buttons),
      !canAsk ? el("p", { class: "help", text: view.closed ? "The view was closed: it asks the server nothing more." : `This host does not let the view ask for them: ask Claude for ${TOOL} with format csv, c_header or devicetree.` }) : null,
      view.outputFormat ? outputBlock(view.outputFormat) : null,
    ]);
  }

  function pageRange(page) {
    const total = page.rows_total || 0;
    const start = (page.offset || 0) + 1;
    const end = Math.min(page.has_more && page.next_offset !== undefined ? page.next_offset : total, total);
    return total ? `pins ${start} to ${end} of ${total}` : "no pins";
  }

  function outputBlock(format) {
    const entry = view.outputs.get(format);
    const canAsk = canCall() && !view.closed;
    if (!entry) {
      return el("p", { class: "muted", text: canAsk ? `Ask for the ${OUTPUTS[format]}: press its button.` : `The ${OUTPUTS[format]} was not asked for.` });
    }
    const label = argText({ ...entry.args, format });
    const head = el("h3", { text: `${OUTPUTS[format]}: ${label}${entry.fromResult ? ", from the call's own result" : ""}` });
    if (entry.loading) return el("div", {}, head, el("p", { class: "muted", text: `Asking ${label}…` }));
    const blocks = [head];
    if (entry.error) {
      blocks.push(el("div", { class: "notice error" }, el("span", { class: "grow", text: `${label} failed: ${entry.error}` }),
        canAsk ? el("button", { type: "button", class: "btn-link", text: "Retry", on: { click: () => askOutput(format, { again: true }) } }) : null));
    }
    const more = entry.next !== null && entry.next !== undefined;
    entry.pages.forEach((page, index) => {
      const area = el("textarea", { class: "out", readonly: true, rows: "16", wrap: "off", spellcheck: "false",
                                    "aria-label": `${OUTPUTS[format]} text, page ${index + 1} of ${entry.pages.length}${more ? " read" : ""}` });
      area.value = page[format];
      blocks.push(el("div", { class: "outpage" },
        el("div", { class: "row" },
          el("span", { text: `Page ${index + 1} of ${entry.pages.length}${more ? " read" : ""}: ${pageRange(page)}, variant ${page.variant}${entry.fromResult && index === 0 ? ", the call's own page" : ""}` }),
          el("button", { type: "button", class: "btn-link", text: "Select all", on: { click: () => { area.focus(); area.select(); } } })),
        area));
    });
    // Not every page read: why, and a button that reads on (or, when the netlist changed,
    // asks again from offset 0).
    if (entry.stopped || more) {
      const why = entry.stopped ? `Not every page was read: ${entry.stopped}.`
        : `Only the call's own first page is here: the ${OUTPUTS[format]} goes on from offset ${entry.next}.`;
      const action = !canAsk ? null : entry.again || !more
        ? el("button", { type: "button", class: "btn-link", text: "Ask again", title: `${label}: every page again, from offset 0`, "aria-disabled": view.busy ? "true" : null,
                         on: { click: () => { if (!view.busy) askOutput(format, { again: true }); } } })
        : el("button", { type: "button", class: "btn-link", text: "Read the other pages", title: `${label}: the pages from offset ${entry.next}`, "aria-disabled": view.busy ? "true" : null,
                         on: { click: () => { if (!view.busy) askOutput(format, { more: true }); } } });
      blocks.push(el("div", { class: `notice ${entry.stopped ? "warning" : "info"}` }, el("span", { class: "grow", text: why }), action));
    }
    if (entry.pages.length > 1) blocks.push(el("p", { class: "help", text: "Each page is the tool's text for its pins (with its own heading); the tool names the identifiers over all pages, so pages joined define each name once." }));
    return el("div", {}, blocks);
  }

  // ---------- selection and the details pane ----------

  function selectPin(key, { from = "" } = {}) {
    if (!view.data || !view.data.byKey.has(key)) return;
    const fromTable = Boolean(ui.table && ui.table.el.contains(document.activeElement));
    view.selected = { kind: "pin", key };
    if (ui.table) ui.table.select((row) => row._key === key);
    if (ui.findTable) ui.findTable.select(() => false);
    applyMarks();
    renderPane();
    const row = view.data.byKey.get(key);
    // The details took the main pane's place (a short, narrow host): focus goes to them.
    if ((fromTable || from) && ui.split && ui.split.classList.contains("solo") && ui.closeButton) ui.closeButton.focus();
    Shell.announce(`Details: pin ${row.pin}${row.net ? `, net ${row.net}` : ""}`);
  }

  function selectFinding(id) {
    const fromTable = Boolean(ui.findTable && ui.findTable.el.contains(document.activeElement));
    view.selected = { kind: "finding", id };
    if (ui.findTable) ui.findTable.select((finding) => finding._id === id);
    if (ui.table) ui.table.select(() => false);
    applyMarks();
    renderPane();
    if (fromTable && ui.split && ui.split.classList.contains("solo") && ui.closeButton) ui.closeButton.focus();
    const finding = view.data.findings.find((item) => item._id === id);
    if (finding) Shell.announce(`Details: ${checkTitle(finding.check)}`);
  }

  /** Close the details (Close, or Esc): focus goes back to the row or pin selected. */
  function closeDetails() {
    const selected = view.selected;
    const inPane = ui.pane && ui.pane.contains(document.activeElement);
    view.selected = null;
    if (ui.table) ui.table.select(() => false);
    if (ui.findTable) ui.findTable.select(() => false);
    applyMarks();
    renderPane();
    if (!inPane && document.activeElement && document.activeElement !== document.body) return;
    if (selected && selected.kind === "pin") {
      if (ui.table && ui.table.focus((row) => row._key === selected.key)) return;
      const mark = ui.markEls && ui.markEls.get(selected.key);
      if (mark && view.tab === "package") {
        mark.focus();
        return;
      }
      const chip = ui.panel && [...ui.panel.querySelectorAll(".pinchip[data-key]")].find((node) => node.dataset.key === selected.key);
      if (chip && chip.getClientRects().length) {
        chip.focus();
        return;
      }
    }
    if (selected && selected.kind === "finding" && ui.findTable && ui.findTable.focus((finding) => finding._id === selected.id)) return;
    if (ui.tabBar) ui.tabBar.focus();
  }

  /** The pin in the Pins tab: the filters that would hide it are cleared, its row focused. */
  function showInTable(key) {
    const row = view.data.byKey.get(key);
    if (!row || row._power) return;
    view.tab = "pins";
    if (view.chipsOn && !view.chipsOn.has(row.function)) view.chipsOn = null;
    if (view.query && !Shell.matches(rowText(row), view.query)) view.query = "";
    if (ui.tabBar) ui.tabBar.set("pins");
    renderTab();
    if (ui.table && !ui.table.focus((item) => item._key === key) && view.groupBy !== "none") {
      ui.table.setGroup(groupSpec());  // its group was collapsed: the groups open again
      ui.table.select((item) => item._key === key);
      ui.table.focus((item) => item._key === key);
    }
  }

  function showOnPackage(key) {
    const row = view.data.byKey.get(key);
    if (!row) return;
    view.tab = "package";
    if (view.part !== row.mcu) {
      view.part = row.mcu;
      view.layout = null;
    }
    if (ui.tabBar) ui.tabBar.set("package");
    renderTab();
    const mark = (ui.marks || []).find((item) => item.item && item.item._key === key);
    if (mark) rove(mark);
    else {
      const chip = ui.panel && [...ui.panel.querySelectorAll(".pinchip")].find((node) => node.getAttribute("aria-pressed") === "true");
      if (chip) chip.focus();
    }
  }

  /** Focus for a pane button that is gone (Ask becoming "Asking…"): the pane's heading. */
  const paneHeading = () => (ui.pane ? ui.pane.querySelector("h2") : null);

  function renderPane() {
    if (!ui.pane) return;
    const top = ui.pane.scrollTop;
    const before = ui.paneShows;
    Shell.keepFocus(ui.pane, drawPane, paneHeading);
    if (before && before === ui.paneShows) ui.pane.scrollTop = top;
  }

  function drawPane() {
    clear(ui.pane);
    ui.closeButton = null;
    const selected = view.selected;
    const row = selected && selected.kind === "pin" ? view.data.byKey.get(selected.key) : null;
    const finding = selected && selected.kind === "finding" ? view.data.findings.find((item) => item._id === selected.id) : null;
    const shown = Boolean(row || finding);
    ui.paneShows = row ? `pin ${row._key}` : finding ? `finding ${finding._id}` : "";
    ui.pane.classList.toggle("idle", !shown);
    if (ui.split) ui.split.classList.toggle("solo", shown && compactHost());
    if (row) {
      Shell.append(ui.pane, pinPane(row));
      return;
    }
    if (finding) {
      Shell.append(ui.pane, findingPane(finding));
      return;
    }
    Shell.append(ui.pane, [
      el("h2", { text: "Select a pin", tabindex: "-1" }),
      el("p", { class: "help", text: "Click a pin in the table or on the package (or move to it and press Enter) for its name, net, function and basis, pull, the parts it reaches, its findings and the net and parts from the server." }),
      el("p", { class: "help", text: "Keys: Up and Down move between rows and group headers, Enter selects or opens and closes a group, Left and Right close and open a group, Esc closes the details." }),
    ]);
  }

  function closeRow(title) {
    ui.closeButton = el("button", { type: "button", class: "btn", text: "Close", on: { click: closeDetails } });
    return el("div", { class: "row" }, el("h2", { text: title, tabindex: "-1" }), ui.closeButton);
  }

  /** The pin's place in the checks' sections: its boot or strap entry, its debug role. */
  function sectionFacts(row) {
    const out = [];
    const straps = listOf(own(view.data.sections.boot_straps, row.mcu)).filter((entry) => String(entry.pin) === row.pin);
    for (const entry of straps) {
      out.push(["Boot or strap", `${entry.kind}: ${String(entry.level || "").replace(/_/g, " ")}${entry.level_basis ? ` (${entry.level_basis})` : ""}`]);
    }
    for (const entry of listOf(own(view.data.sections.debug_access, row.mcu))) {
      for (const pin of entry.pins || []) {
        if (String(pin.pin) !== row.pin) continue;
        const access = (pin.access || []).length ? `reaches ${pin.access.join(", ")}` : pin.via_processor ? `only through ${pin.via_processor.join(", ")}` : "reaches no header or test point";
        out.push(["Debug", `${String(entry.interface).toUpperCase()} ${pin.role}: ${access}`]);
      }
    }
    return out;
  }

  function pinPane(row) {
    const data = view.data;
    const info = fnInfo(row.function);
    const findings = data.findingsByPin.get(row._key) || [];
    const title = `${data.mapped.length > 1 ? `${row.mcu} ` : ""}pin ${row.pin}`;
    const out = [
      closeRow(title.charAt(0).toUpperCase() + title.slice(1)),
      el("div", { class: "summary" }, el("span", { class: "badge" }, functionCell(row)),
        row.type ? el("span", { class: "badge muted", text: row.type }) : null,
        row.unused ? el("span", { class: "badge muted", text: "unused" }) : null,
        findings.length ? el("span", { class: `badge ${findings.some((finding) => finding.severity === "warning") ? "warning" : "info"}`, text: plural(findings.length, "finding") }) : null),
    ];
    if (row._power) {
      out.push(el("p", { class: "help", text: `A ${info.label} pin on ${row.net ? `net ${row.net}` : "no net"}: ${TOOL} summarises power and ground pins per net, with no name or type.` }));
    } else {
      out.push(Shell.facts([
        ["Name", row.name || null],
        ["Could be", (row.alternates || []).join(", ") || null],
        ["Port/bit", portText(row) || null],
        ["Type", row.type || null],
        ["Net", row.net || "not connected"],
        ["Function", `${info.label}${row.role ? ` ${row.role}` : ""} (${info.code})`],
        ["Basis", (row.basis || []).length ? el("ul", { class: "flat" }, row.basis.map((item) => el("li", { text: item }))) : null],
        ["Pull", pullText(row) || null],
        ["Reaches", (row.peers || []).length ? el("ul", { class: "flat" }, row.peers.map((peer) => el("li", { text: `${peerLabel(peer)}, ${peer.kind}` })),
          (row.peers_total || 0) > row.peers.length ? el("li", { class: "muted", text: `and ${row.peers_total - row.peers.length} more (the tool lists ${row.peers.length})` }) : null) : null],
        ["Not Fitted paths", (row.not_fitted_paths || []).join("; ") || null],
        ["Same part", (row.same_part_pins || []).length ? `shares its net with pins ${row.same_part_pins.join(", ")}` : null],
        ...sectionFacts(row),
      ]));
    }
    if (findings.length) {
      out.push(el("h3", { text: plural(findings.length, "finding") }), el("ul", { class: "flat" }, findings.map((finding) => el("li", {},
        sevBadge(finding.severity), " ",
        el("button", { type: "button", class: "btn-link", text: checkTitle(finding.check), title: "The finding's details", on: { click: () => selectFinding(finding._id) } }),
        `: ${finding.issue}`))));
    }
    out.push(el("div", { class: "btn-row" },
      row._power ? null : el("button", { type: "button", class: "btn", text: "Show in the table", on: { click: () => showInTable(row._key) } }),
      view.tab !== "package" ? el("button", { type: "button", class: "btn", text: "Show on the package", on: { click: () => showOnPackage(row._key) } }) : null));
    out.push(...serverSection(row));
    return out;
  }

  /** Buttons that ask query_net for the pin's net and get_component for the parts it
   *  reaches, and their answers, each labelled with the call. */
  function serverSection(row) {
    const head = el("h3", { text: "From the server" });
    if (view.closed) return [head, el("p", { class: "muted", text: "The view was closed: it asks the server nothing more." })];
    if (!canCall()) return [head, el("p", { class: "muted", text: "This host does not let the view call tools: ask Claude for query_net or get_component." })];
    const asks = [];
    if (row.net) asks.push(["query_net", { pattern: Shell.exactPattern(row.net) }, `query_net ${row.net}`]);
    const parts = [...new Set((row.peers || []).map((peer) => String(peer.designator)))].slice(0, 4);
    for (const part of parts) asks.push(["get_component", { refdes: part }, `get_component ${part}`]);
    if (!asks.length) return [head, el("p", { class: "muted", text: "Not connected: no net or part to ask about." })];
    const out = [head, el("div", { class: "btn-row" }, asks.map(([tool, args, text]) => {
      const entry = answers.get(answerKey(tool, args));
      const loading = Boolean(entry && entry.loading);
      return el("button", { type: "button", class: "btn", text: loading ? "Asking…" : text, "aria-disabled": loading ? "true" : null,
                            title: `${tool}(${Object.entries(args).map(([key, value]) => `${key}="${value}"`).join(", ")})`,
                            on: { click: () => askDetail(tool, args) } });
    }))];
    for (const [tool, args] of asks) {
      const entry = answers.get(answerKey(tool, args));
      if (entry) out.push(answerBlock(tool, args, entry));
    }
    return out;
  }

  function answerBlock(tool, args, entry) {
    const label = `${tool}(${Object.entries(args).map(([key, value]) => `${key}="${value}"`).join(", ")})`;
    const head = el("h4", { text: label });
    if (entry.loading) return el("div", { class: "answer" }, head, el("p", { class: "muted", text: "Asking…" }));
    if (entry.error) {
      return el("div", { class: "answer" }, head, el("div", { class: "notice error" }, el("span", { class: "grow", text: entry.error }),
        canCall() && !view.closed ? el("button", { type: "button", class: "btn-link", text: "Retry", on: { click: () => askDetail(tool, args) } }) : null));
    }
    const { json, text } = parsedAnswer(entry);
    const again = canCall() && !view.closed ? el("button", { type: "button", class: "btn-link", text: "Ask again",
      title: "The files may have changed: ask again", on: { click: () => askAgain(tool, args) } }) : null;
    if (!json) return el("div", { class: "answer" }, head, el("pre", { class: "text", text: String(text).slice(0, 4000) }), again);
    if (json.error) return el("div", { class: "answer" }, head, el("div", { class: "notice warning", text: json.message || json.error }), again);
    if (tool === "query_net") {
      const pins = json.pins || json.pins_sample || [];
      return el("div", { class: "answer" }, head,
        Shell.facts([["Net", json.net], ["Pins", String(json.pin_count)], ["Note", json.message || null]]),
        el("ul", { class: "flat" }, pins.slice(0, 40).map((pin) => el("li", { text: `${pin.refdes}.${pin.pin}` })),
          pins.length > 40 ? el("li", { class: "muted", text: `and ${pins.length - 40} more` }) : null), again);
    }
    const pins = Object.keys(json.pins || {}).length;
    return el("div", { class: "answer" }, head,
      el("p", { class: "help small", text: "As the active variant shows it when asked." }),
      Shell.facts([
        ["Fitted", json.dnp ? "no: Not Fitted in the active variant" : "yes"],
        ["Value", json.value], ["Description", json.description], ["MPN", json.mpn], ["Sheet", json.sheet],
        ["Pins", pins ? String(pins) : null],
      ]), again);
  }

  /** Any field of a finding as text: a list joined, an object's entries, else the value. */
  function fieldText(value) {
    if (value === null || value === undefined || value === "") return null;
    if (Array.isArray(value)) return value.map((item) => fieldText(item)).filter(Boolean).join(", ") || null;
    if (typeof value === "object") return Object.entries(value).map(([key, item]) => `${key} ${fieldText(item) || "–"}`).join(", ") || null;
    return String(value);
  }

  /** One line per part of an object field (the contract's objects), else the field as text. */
  function perPart(value, line) {
    if (!isObject(value)) return fieldText(value);
    const entries = Object.entries(value);
    return entries.length ? el("ul", { class: "flat" }, entries.map(([part, info]) => el("li", { text: `${part}: ${line(info)}` }))) : null;
  }

  // A variant finding's parts, {R3: {fitted_in: [...], not_fitted_in: [...]}}, and values,
  // {R2: {A: null, B: "1k"}} (null: the variant leaves the value as drawn, the tool's words).
  const fittedText = (info) => (isObject(info) && (Array.isArray(info.fitted_in) || Array.isArray(info.not_fitted_in))
    ? `fitted in ${listOf(info.fitted_in).join(", ") || "no variant"}; Not Fitted in ${listOf(info.not_fitted_in).join(", ") || "no variant"}`
    : fieldText(info) || "–");
  const valuesText = (info) => (isObject(info)
    ? Object.entries(info).map(([variant, value]) => `${variant} ${value === null || value === undefined || value === "" ? "as drawn" : fieldText(value)}`).join(", ") || "–"
    : fieldText(info) || "–");

  function findingPane(finding) {
    const fields = [
      ["Part", finding.mcu],
      ["Pins", finding._pins.length ? el("span", { class: "findpins" }, finding._pins.map((pin) => pinButton(finding.mcu, pin))) : null],
      ["Net", fieldText(finding.net)],
      ["Level", finding.level ? String(finding.level).replace(/_/g, " ") : null],
      ["Interface", fieldText(finding.interface) || fieldText(finding.interfaces)],
      ["Memory", finding.memory ? `${fieldText(finding.memory)}${finding.bus ? ` on a ${fieldText(finding.bus)} bus` : ""}` : null],
      ["Peer", finding.peer ? `${fieldText(finding.peer)}${finding.peer_class ? ` (${fieldText(finding.peer_class)})` : ""}${finding.certain ? ", certain" : ""}` : null],
      ["Parts", perPart(finding.parts, fittedText)],
      ["Values", perPart(finding.values, valuesText)],
      ["Designators", fieldText(finding.designators)],
    ];
    return [
      closeRow(checkTitle(finding.check)),
      el("div", { class: "summary" }, sevBadge(finding.severity), el("span", { class: "badge mono", text: finding.check })),
      el("p", { class: "help", text: finding.issue }),
      Shell.facts(fields),
      el("p", { class: "foot", text: "A heuristic from pin and net names: the schematic, the datasheet and the firmware decide." }),
    ];
  }

  // ---------- host ----------

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && view.selected && !event.defaultPrevented) closeDetails();
  });
  Shell.on("toolInput", (args) => {
    view.args = args || {};
    view.argsKnown = true;
    if (!view.data) showState("loading", "Reading the pin map", `${argText(cleanArgs(view.args))} is mapping the processor's pins.`);
  });
  Shell.on("toolInputPartial", () => {
    if (!view.data) showState("loading", "Reading the pin map", "Waiting for the tool's arguments.");
  });
  Shell.on("toolResult", (result) => loadResult(result));
  Shell.on("toolCancelled", (reason) => {
    if (!view.data) showState("info", `The ${TOOL} call was cancelled`, reason || "No result to show.");
  });
  Shell.on("teardown", () => {
    view.closed = true;
    closeCalls();
    view.busy = "";
    for (const [format, entry] of view.outputs) {
      if (entry.loading) view.outputs.set(format, { error: "the view was closed", args: entry.args, pages: [], next: null });
    }
    Shell.announce("The view was closed: it asks the server nothing more");
    if (view.data && ui.header) {
      renderHeadBlocks();
      if (ui.panel) renderTab();
      renderPane();
    } else if (view.textOnly) {
      app.prepend(Shell.notice("info", "The view was closed: it asks the server nothing more."));
    } else if (!view.data) {
      showState("info", "The view was closed", "It asks the server nothing more, and no pin map was read before it closed.");
    }
  });
  // The host's size or display mode changed: the narrow and short layouts may too; the
  // disclosures the user has not set open or fold again, and the diagram fits again.
  const layoutSig = () => `${narrowHost()}|${Shell.context().displayMode}|${short()}|${compactHost()}`;
  let wasLayout = layoutSig();
  function onLayoutChange() {
    if (!view.data || !ui.header) return;
    if (view.autoFit && ui.canvas) fitWidth();
    if (layoutSig() === wasLayout) return;
    wasLayout = layoutSig();
    if (view.auto.filters) view.filtersOpen = null;
    if (view.auto.cands) view.candsOpen = null;
    // Focus goes back to the control, the row or the pin it was on.
    const mark = Shell.focusMark(app);
    const spot = app.contains(document.activeElement) ? focusSpot() : null;
    renderAll();
    if (!restoreSpot(spot) && mark) Shell.refocus(app, mark, () => ui.headline || null);
  }
  Shell.on("context", () => {
    onLayoutChange();
    queueOwnFit();
  });
  window.addEventListener("resize", () => {
    onLayoutChange();
    queueOwnFit();
  });

  // Full screen with no height from the host: the shell then fits no pane (it has no
  // limit), so the page fits its panes to the window's own height, on #app (the shell sets
  // the root's --pane-height only from a height the host gives).
  let ownFit = "";
  let ownQueued = false;
  function fitOwnHeight() {
    ownQueued = false;
    const dims = Shell.context().containerDimensions || {};
    const mine = Shell.context().displayMode === "fullscreen" && !(Number(dims.height || dims.maxHeight) > 0);
    const limit = window.innerHeight;
    if (!mine || !limit) {
      if (ownFit) app.style.removeProperty("--pane-height");
      ownFit = "";
      return;
    }
    const html = document.documentElement;
    // The page's height with its scrollbar shown, as the shell measures it.
    const height = () => {
      const saved = [html.style.height, html.style.overflowY];
      html.style.height = "max-content";
      html.style.overflowY = "scroll";
      const value = Math.ceil(html.getBoundingClientRect().height);
      [html.style.height, html.style.overflowY] = saved;
      return value;
    };
    const set = (px) => app.style.setProperty("--pane-height", `${px}px`);
    const state = () => `${limit}|${window.innerWidth}|${app.style.getPropertyValue("--pane-height")}|${height()}`;
    let current = parseInt(app.style.getPropertyValue("--pane-height"), 10);
    if (!Number.isFinite(current)) {
      current = limit;
      set(current);
    }
    if (state() === ownFit) return;
    // Up from the current height only, unless the page is too tall (pane scroll positions stay).
    let low = current;
    let high = limit;
    if (current > limit || height() > limit) {
      low = 64;
      high = Math.min(current, limit);
    }
    while (high - low > 4) {
      const middle = Math.floor((low + high) / 2);
      set(middle);
      if (height() <= limit) low = middle;
      else high = middle;
    }
    set(high);
    if (height() > limit) set(low);
    ownFit = state();
  }
  function queueOwnFit() {
    if (ownQueued) return;
    ownQueued = true;
    setTimeout(fitOwnHeight, 30);
  }
  if (typeof ResizeObserver === "function") new ResizeObserver(queueOwnFit).observe(document.body);

  showState("loading", "Connecting to the host", "");
  Shell.connect({ name: "altium-copilot-kc Firmware pin map", version: "1.0.0" })
    .then(() => {
      if (!view.data) showState("loading", `Waiting for ${TOOL}`, "The pin map appears when the tool's result arrives.");
    })
    .catch((error) => showState("error", "This view needs a host that shows MCP Apps", error.message));
})();
</script>
</body>
</html>
