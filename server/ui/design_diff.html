            !list.some((commit) => commit.hash === side.hash) && !extra.some((commit) => commit.hash === side.hash)) extra.push(side);
      }
      const current = (side) => (isObject(side) ? (side.source === "working" ? "working" : side.source === "git" ? String(side.hash || "") : "") : "");
      if (!view.pickA) view.pickA = (data && current(data.a)) || (list[0] ? String(list[0].hash) : "");
      if (!view.pickB) view.pickB = (data && current(data.b)) || "working";
      const select = (which) => {
        const box = el("select", {},
          el("option", { value: "working", text: "working: the files on disk" }),
          list.map((commit) => commitOption(commit)), extra.map((side) => commitOption(side, "compared now: ")));
        box.value = which === "a" ? view.pickA : view.pickB;
        box.addEventListener("change", () => {
          if (which === "a") view.pickA = box.value;
          else view.pickB = box.value;
          redrawPicker();
        });
        return box;
      };
      const picked = { rev_a: view.pickA, rev_b: view.pickB, units: args.units };
      const same = view.pickA === view.pickB;
      const isCurrent = data && current(data.a) === view.pickA && current(data.b) === view.pickB && !data.section;
      const parentArgs = { rev_b: view.pickB, units: args.units };
      body.push(el("div", { class: "picker" },
        el("label", {}, "a (before)", select("a")),
        el("label", {}, "b (after)", select("b")),
        canAsk ? el("div", { class: "btn-row" },
          el("button", { type: "button", class: "btn", text: "Compare a with b", "aria-disabled": view.busy || same || isCurrent ? "true" : null,
                         title: same ? "a and b are the same revision" : isCurrent ? "This is the comparison shown" : `${argText(picked)}: every section`,
                         on: { click: () => { if (!view.busy && !same && !isCurrent) reask(picked, "the revisions picked"); } } }),
          view.pickB !== "working" ? el("button", { type: "button", class: "btn", text: "What b changed", "aria-disabled": view.busy ? "true" : null,
                         title: `${argText(parentArgs)}: b against its parent commit`,
                         on: { click: () => { if (!view.busy) reask(parentArgs, "what the commit changed"); } } }) : null) : null));
      body.push(el("p", { class: "help", text: `The ${plural(list.length, "commit")} that changed the design files, newest first, from ${view.commits.asked}${list.length >= CONTRACT.recent_commits ? ` (the tool lists the ${CONTRACT.recent_commits} most recent)` : ""}. Comparing asks ${TOOL} again; it reads revisions with read-only git commands and writes nothing.` }));
    } else if (canAsk) {
      body.push(el("div", { class: "btn-row" }, el("button", { type: "button", class: "btn", text: "List recent commits",
        "aria-disabled": view.busy ? "true" : null,
        title: `${argText({ units: args.units, section: "ict_hazards" })}: without revisions the tool lists the commits that changed the design files`,
        on: { click: () => { if (!view.busy) listCommits(args); } } })));
      body.push(el("p", { class: "help", text: `${TOOL} lists the recent commits when asked without revisions; the view asks it so (its comparison of the last design commit with the files on disk is not drawn).` }));
    } else {
      body.push(el("p", { class: "help", text: view.closed ? "The view was closed: it asks the server nothing more." : "This host does not let the view ask for other revisions: ask Claude for diff_design with rev_a and rev_b." }));
    }
    if (view.busy && !(data && ui.header)) body.push(el("p", { class: "muted small", text: view.busy }));
    if (view.pickerOpen === null) view.pickerOpen = Boolean(needed) || !short();
    const disclosure = el("details", { class: "block", open: view.pickerOpen },
      el("summary", {}, el("h2", { text: list.length ? `Revisions (${plural(list.length, "recent commit")})` : "Revisions" })), body);
    disclosure.addEventListener("toggle", () => {
      if (disclosure.open === view.pickerOpen) return;
      view.pickerOpen = disclosure.open;
      view.auto.picker = false;
    });
    return disclosure;
  }

  function renderSummary() {
    const data = view.data;
    const box = ui.sumline;
    clear(box);
    if (data.noChanges) {
      const why = Object.entries(data.unchanged).map(([part, reason]) => `${part}: ${reason}`).join("; ");
      box.appendChild(Shell.state("info", "No design change between a and b",
        [data.noChangesHint, why ? `Not compared or unchanged: ${why}.` : ""].filter(Boolean).join(" ") || "The two sides hold the same design data."));
      if (notesList().length) box.appendChild(notesBlock(notesList()));
      return;
    }
    const sections = SECTION_ORDER.filter((section) => sectionCount(data.summary, section))
      .concat(Object.keys(data.summary).filter((section) => !SECTION_ORDER.includes(section) && sectionCount(data.summary, section)));
    const total = data.totalChanges ?? data.total;
    const parts = sections.map((section) => `${sectionTitle(section)} ${sectionCount(data.summary, section)}`);
    // Without the tool's summary (its first page was not read) the counts are of the changes
    // read, said apart from the total.
    const counts = data.summaryFromTool ? `${plural(total, "change")}`
      : data.rows.length === total ? `${plural(total, "change")} (counted from the changes read)`
        : `${plural(total, "change")}; of the ${data.rows.length} read`;
    const full = `${counts}: ${parts.join(", ") || "none"}.` +
      (data.section ? ` The list holds ${sectionTitle(data.section)} only (${plural(data.total, "change")}).` : "");
    // A short host: the count heads the notes' disclosure, which holds the whole summary.
    if (!short()) box.appendChild(el("p", { class: "sumline", text: full }));
    if (!data.rows.length && !data.stopReason) {
      // A call narrowed to a section with no change in it.
      const others = Math.max(0, total - data.total);
      box.appendChild(Shell.state("info", data.section ? `No change in ${sectionTitle(data.section)}` : "No change listed",
        data.section ? `The other sections hold ${plural(others, "change")}.` : "The result lists no change."));
      if (data.section && others && canCall() && !view.closed) {
        box.appendChild(el("div", { class: "btn-row" }, el("button", { type: "button", class: "btn", text: "Show every section",
          "aria-disabled": view.busy ? "true" : null, title: `${argText({ ...data.args, section: undefined })}: every section`,
          on: { click: () => { if (!view.busy) reask({ ...data.args, section: undefined }, "every section"); } } })));
      }
    }
    const notes = [...(short() ? [full] : []), ...notesList()];
    const revs = messageRevs(data);
    // A short host: the release notes question waits here; a cramped one, the hazards' too.
    const asks = [];
    if (short() && data.rows.length && revs) asks.push(["release notes", messageControl("notes", "Ask Claude for release notes", sentence("notes", [], revs))]);
    if (cramped() && revs && (data.hazards.length || sectionCount(data.summary, "ict_hazards"))) asks.push(["the hazards", hazardsQuestion(revs)]);
    const heading = !short() ? ""
      : data.summaryFromTool ? `${plural(total, "change")} in ${plural(sections.length, "section")}: summary, notes`
        : `${data.rows.length} of ${plural(total, "change")} read: summary, notes`;
    if (notes.length || asks.length) box.appendChild(notesBlock(notes, asks.filter(([, control]) => control), heading));
  }

  /** The tool's notes and what it did not compare, with the view's own notes. */
  function notesList() {
    const data = view.data;
    const out = [...data.notes];
    for (const [part, reason] of Object.entries(data.unchanged)) out.push(`Not compared or unchanged, ${part}: ${reason}.`);
    if (data.sameAsBase.length) out.push(`BOM variants whose line changes equal the base BOM's (listed under it): ${data.sameAsBase.join(", ")}.`);
    if (data.routing) {
      const delta = own(data.routing, `length_delta_${data.units}`);
      out.push(`Routing totals over the nets listed: length ${typeof delta === "number" ? `${delta > 0 ? "+" : ""}${delta} ${data.units}` : "?"}, vias ${data.routing.via_delta > 0 ? "+" : ""}${data.routing.via_delta ?? "?"}.`);
    }
    const matching = Object.entries(data.netMatching);
    if (matching.length) out.push(`Net matching options from the project: ${matching.map(([key, value]) => `${key.replace(/_/g, " ")} ${fmt(value)}`).join(", ")}.`);
    if (data.recentNote) out.push(data.recentNote);
    out.push(...data.notesFromTool);
    return out;
  }

  /** The notes' disclosure; asks: [[word, control]], the questions for Claude it holds (one
   *  named by its word, two as "ask Claude", so the heading keeps to one line). */
  function notesBlock(notes, asks = [], heading = "") {
    const more = asks.length === 1 ? `, ${asks[0][0]}` : asks.length ? ", ask Claude" : "";
    const box = el("details", { class: "more", open: view.notesOpen },
      el("summary", { text: heading ? `${heading}${more}` : `Notes (${notes.length}) and what is not compared${more}` }),
      asks.length ? el("div", { class: "btn-row" }, asks.map(([, control]) => control)) : null,
      el("ul", { class: "notes small" }, notes.map((note) => el("li", { text: note }))));
    box.addEventListener("toggle", () => { view.notesOpen = box.open; });
    return box;
  }

  // ---------- the change list ----------

  function kindBadge(kind, text = null) {
    const info = kindInfo(kind);
    return el("span", { class: `badge k-${own(KINDS, kind) ? kind : "changed"}` },
      el("span", { class: "kglyph", "aria-hidden": "true", text: info.glyph }), text || info.label);
  }

  function renderFilters() {
    const box = ui.filters;
    if (!box) return;
    const mark = Shell.focusMark(box);
    clear(box);
    const filter = Shell.filterBox({
      placeholder: "Filter changes", label: "Filter the changes", value: view.query,
      onInput: (text) => {
        view.query = text;
        if (ui.table) ui.table.setQuery(text);
      },
    });
    const switcher = Shell.segmented({ label: "Group by", items: [
      { id: "section", label: "Section" }, { id: "kind", label: "Kind" }, { id: "subject", label: "Part or net" }, { id: "none", label: "None" }],
    current: view.groupBy, onChange: (id) => {
      view.groupBy = id;
      // Drawn again, not only regrouped: the Section column shows exactly when the list is
      // not grouped by section (the column chooser's own choices are kept).
      renderList();
    } });
    const sectionCounts = counts((row) => row.section, sectionRank);
    const kindCounts = counts((row) => row.kind, kindRank);
    const sectionChips = sectionCounts.length > 1 ? Shell.chips({
      label: "Sections", items: sectionCounts.map(([section, count]) => ({ id: section, label: sectionTitle(section), count })),
      selected: view.sectionsOn || sectionCounts.map(([section]) => section),
      onChange: (on) => {
        view.sectionsOn = on.size === sectionCounts.length ? null : on;
        applyFilter();
      } }).el : null;
    const kindChips = kindCounts.length > 1 ? Shell.chips({
      label: "Kinds", items: kindCounts.map(([kind, count]) => ({ id: kind, label: `${kindInfo(kind).glyph} ${kindInfo(kind).label}`, count })),
      selected: view.kindsOn || kindCounts.map(([kind]) => kind),
      onChange: (on) => {
        view.kindsOn = on.size === kindCounts.length ? null : on;
        applyFilter();
      } }).el : null;
    if (view.filtersOpen === null) view.filtersOpen = !short();
    ui.filteredBadge = el("span", { class: "badge info", text: "filtered", hidden: !view.sectionsOn && !view.kindsOn });
    const details = el("details", { class: "filters-box", open: view.filtersOpen },
      el("summary", { text: "Filter, group, sections and kinds" }, ui.filteredBadge),
      el("div", { class: "filters" }, filter, switcher.el),
      sectionChips ? el("div", { class: "chiprow" }, sectionChips) : null,
      kindChips ? el("div", { class: "chiprow" }, kindChips) : null);
    details.addEventListener("toggle", () => {
      if (details.open === view.filtersOpen) return;
      view.filtersOpen = details.open;
      view.auto.filters = false;
    });
    box.appendChild(details);
    if (mark) Shell.refocus(box, mark, null);
  }

  function counts(key, rank) {
    const map = new Map();
    for (const row of view.data.rows) map.set(key(row), (map.get(key(row)) || 0) + 1);
    return [...map.entries()].sort((a, b) => rank(a[0]) - rank(b[0]) || Shell.naturally(a[0], b[0]));
  }

  function applyFilter() {
    if (ui.table) ui.table.setFilter(rowOk);
    if (ui.filteredBadge) ui.filteredBadge.hidden = !view.sectionsOn && !view.kindsOn;
  }

  /** Only one section in the list (the hazards banner's "show all"): its chip alone on. */
  function onlySection(section) {
    view.sectionsOn = new Set([section]);
    view.kindsOn = null;
    view.query = "";
    view.filtersOpen = true;
    renderFilters();
    renderList();
    if (ui.table) ui.table.focus(null);
  }

  /** A side's cell: its text, shortened past 160 characters (the details hold it all), or
   *  "none" in words for a side that has nothing. */
  function sideCell(row, side) {
    const text = row[side];
    if (!text) {
      const why = row.kind === "added" && side === "a" ? "not in a" : row.kind === "removed" && side === "b" ? "not in b" : "–";
      return el("span", { class: "none", text: why });
    }
    return text.length > 160 ? el("span", { title: text, text: `${text.slice(0, 159)}…` }) : text;
  }

  function columns() {
    const narrow = narrowHost();
    return [
      { key: "index", label: "#", numeric: true, hidden: true, value: (row) => row._index + 1 },
      { key: "section", label: "Section", hidden: narrow || view.groupBy === "section", value: (row) => `${String(sectionRank(row.section)).padStart(2, "0")} ${sectionTitle(row.section)}`,
        text: (row) => sectionTitle(row.section), render: (row) => sectionTitle(row.section) },
      // data-id: the row's change, so keyboard focus finds its row again after a redraw.
      { key: "change", label: "Change", cls: "c-change", value: (row) => `${String(kindRank(row.kind)).padStart(2, "0")} ${row.label}`,
        text: (row) => `${kindInfo(row.kind).label} ${row.label}`,
        render: (row) => el("span", { data: { id: row._id } }, kindBadge(row.kind, row.label)) },
      // The subject with its kind, and the variant a BOM line or a fitting belongs to (shown
      // on a narrow host too: two variants' rows would look the same without it).
      { key: "subject", label: "Part, net or item", cls: "c-subject", value: (row) => row.subject,
        text: (row) => (row.variant ? `${row.subject} variant ${row.variant}` : row.subject),
        render: (row) => el("span", {}, row.subject,
          narrow ? (row.variant ? el("span", { class: "subtype", text: `variant ${row.variant}` }) : null)
            : el("span", { class: "subtype", text: row.variant ? `${row.subjectType} · variant ${row.variant}` : row.subjectType })) },
      { key: "a", label: "Before (a)", cls: "c-side side-a", value: (row) => row.a, render: (row) => sideCell(row, "a") },
      { key: "b", label: "After (b)", cls: "c-side side-b", value: (row) => row.b, render: (row) => sideCell(row, "b") },
      { key: "eco", label: "ECO", hidden: true, cls: "c-name" },
      { key: "text", label: "The tool's text", hidden: true, cls: "c-msg" },
    ];
  }

  function groupSpec() {
    if (view.groupBy === "none") return null;
    const badge = (rows) => el("span", { class: "badge", text: plural(rows.length, "change") });
    if (view.groupBy === "kind") {
      return { key: (row) => row.kind, label: (key) => kindBadge(key), count: (key, rows) => badge(rows),
               order: (a, b) => kindRank(a) - kindRank(b) || Shell.naturally(a, b) };
    }
    if (view.groupBy === "subject") {
      return { key: (row) => `${row.subjectType}\u0001${row.subject}`,
               label: (key) => { const [type, name] = key.split("\u0001"); return el("span", {}, el("span", { class: "muted", text: `${type} ` }), name); },
               count: (key, rows) => badge(rows),
               order: (a, b) => Shell.naturally(a, b) };
    }
    return {
      key: (row) => row.section,
      label: (key) => sectionTitle(key),
      // Each section's count by kind, in words with the kind's glyph.
      count: (key, rows) => {
        const byKind = new Map();
        for (const row of rows) byKind.set(row.kind, (byKind.get(row.kind) || 0) + 1);
        return [...byKind.entries()].sort((a, b) => kindRank(a[0]) - kindRank(b[0]))
          .map(([kind, count]) => kindBadge(kind, kind === "hazard" ? plural(count, "ICT hazard") : `${count} ${kindInfo(kind).label.toLowerCase()}`));
      },
      order: (a, b) => sectionRank(a) - sectionRank(b) || Shell.naturally(a, b),
    };
  }

  /** The list's sort and shown columns as the user left them, read from its header and its
   *  column chooser, so a list drawn again (another layout, another answer) keeps them. */
  function keepTable() {
    const table = ui.table;
    const cols = ui.tableColumns;
    if (!table || !cols) return;
    const th = table.el.querySelector('thead th[aria-sort="ascending"], thead th[aria-sort="descending"]');
    const button = th ? th.querySelector("button[data-col]") : null;
    const boxes = [...table.el.querySelectorAll(".colchooser input[type=checkbox]")];
    const kept = view.tables.list || { added: new Set(), removed: new Set() };
    // What the user showed or hid against the defaults (which follow the host's width),
    // gathered over redraws: a column hidden on a wide host stays hidden after a narrow one.
    if (boxes.length === cols.length) {
      cols.forEach((column, index) => {
        const shown = boxes[index].checked;
        if (shown && column.hidden) kept.added.add(column.key);
        if (!shown && !column.hidden) kept.removed.add(column.key);
        if (shown) kept.removed.delete(column.key);
        else kept.added.delete(column.key);
      });
    }
    kept.sort = button ? { key: button.dataset.col, dir: th.getAttribute("aria-sort") === "descending" ? -1 : 1 } : null;
    view.tables.list = kept;
  }

  /** Today's default columns (they follow the host's width) with those the user showed or hid. */
  function tableSpec(cols) {
    ui.tableColumns = cols;
    const kept = view.tables.list;
    if (!kept) return { columns: cols, sort: null };
    const visible = cols.filter((column) => (!column.hidden || kept.added.has(column.key)) && !kept.removed.has(column.key));
    return {
      // At least one column stays, as the column chooser keeps one.
      columns: visible.length ? cols.map((column) => ({ ...column, hidden: !visible.includes(column) })) : cols,
      sort: kept.sort && cols.some((column) => column.key === kept.sort.key) ? kept.sort : null,
    };
  }

  /** The tables announce nothing themselves (the page has one live region). */
  function quiet(table) {
    for (const node of table.el.querySelectorAll("[aria-live]")) node.setAttribute("aria-live", "off");
    return table;
  }

  function renderList() {
    if (!ui.panel) return;
    const mark = Shell.focusMark(ui.panel);
    const spot = focusSpot();
    keepTable();
    clear(ui.panel);
    const data = view.data;
    const spec = tableSpec(columns());
    ui.table = quiet(Shell.table({
      label: "Changes", ownFilter: false, rows: data.rows, columns: spec.columns, group: groupSpec(), filter: rowOk,
      rowKey: (row) => row._id, onActivate: (row) => selectRow(row._id), sort: spec.sort,
      empty: data.stopReason ? `No change read: ${data.stopReason}.` : "No change in this comparison.",
    }));
    ui.table.setQuery(view.query);
    if (view.selected) ui.table.select((row) => row._id === view.selected);
    ui.panel.appendChild(ui.table.el);
    if (spot && ui.table.focus((row) => row._id === spot)) return;
    if (mark) Shell.refocus(ui.panel, mark, null);
  }

  /** The change whose row has keyboard focus, to find it again after a redraw. */
  function focusSpot() {
    const active = document.activeElement;
    if (!active || active.tagName !== "TR" || !ui.panel || !ui.panel.contains(active)) return null;
    const ref = active.querySelector("[data-id]");
    return ref ? ref.dataset.id : null;
  }

  // ---------- selection and the details pane ----------

  function selectRow(id, { from = "" } = {}) {
    if (!view.data || !view.data.byId.has(id)) return;
    const fromTable = Boolean(ui.table && ui.table.el.contains(document.activeElement));
    view.selected = id;
    if (ui.table) ui.table.select((row) => row._id === id);
    renderPane();
    // The details took the list's place (a short, narrow host): focus goes to them.
    if ((fromTable || from) && ui.split && ui.split.classList.contains("solo") && ui.closeButton) ui.closeButton.focus();
    else if (from && ui.pane) {
      const heading = ui.pane.querySelector("h2");
      if (heading) heading.focus();
    }
    const row = view.data.byId.get(id);
    Shell.announce(`Details: ${row.label}, ${row.subject}`);
  }

  /** Close the details (Close, or Esc): focus goes back to the change's row. */
  function closeDetails() {
    const selected = view.selected;
    const inPane = ui.pane && ui.pane.contains(document.activeElement);
    view.selected = null;
    if (ui.table) ui.table.select(() => false);
    renderPane();
    if (!inPane && document.activeElement && document.activeElement !== document.body) return;
    if (selected && ui.table && ui.table.focus((row) => row._id === selected)) return;
    if (ui.headline) ui.headline.focus();
  }

  /** The change in the list: the filters that would hide it are cleared, its row focused. */
  function showInList(id) {
    const row = view.data.byId.get(id);
    if (!row) return;
    let redraw = false;
    if (view.sectionsOn && !view.sectionsOn.has(row.section)) { view.sectionsOn = null; redraw = true; }
    if (view.kindsOn && !view.kindsOn.has(row.kind)) { view.kindsOn = null; redraw = true; }
    if (view.query && !Shell.matches(rowText(row), view.query)) { view.query = ""; redraw = true; }
    if (redraw) {
      renderFilters();
      renderList();
    }
    if (ui.table && !ui.table.focus((item) => item._id === id) && view.groupBy !== "none") {
      ui.table.setGroup(groupSpec());  // its group was collapsed: the groups open again
      ui.table.select((item) => item._id === id);
      ui.table.focus((item) => item._id === id);
    }
  }

  /** Focus for a pane button that is gone (Ask becoming "Asking…"): the pane's heading. */
  const paneHeading = () => (ui.pane ? ui.pane.querySelector("h2") : null);

  function renderPane() {
    if (!ui.pane) return;
    const top = ui.pane.scrollTop;
    const before = ui.paneShows;
    Shell.keepFocus(ui.pane, drawPane, paneHeading);
    if (before && before === ui.paneShows) ui.pane.scrollTop = top;
  }

  function drawPane() {
    clear(ui.pane);
    ui.closeButton = null;
    const row = view.selected && view.data ? view.data.byId.get(view.selected) : null;
    ui.paneShows = row ? row._id : "";
    ui.pane.classList.toggle("idle", !row);
    if (ui.split) ui.split.classList.toggle("solo", Boolean(row) && compactHost());
    if (row) {
      Shell.append(ui.pane, changePane(row));
      return;
    }
    Shell.append(ui.pane, [
      el("h2", { text: "Select a change", tabindex: "-1" }),
      el("p", { class: "help", text: "Click a change in the list (or move to it and press Enter) for every field before and after, and links to the board view and the schematic." }),
      el("p", { class: "help", text: "Keys: Up and Down move between rows and group headers, Enter selects or opens and closes a group, Left and Right close and open a group, Esc closes the details." }),
    ]);
  }

  function closeRow(title) {
    ui.closeButton = el("button", { type: "button", class: "btn", text: "Close", on: { click: closeDetails } });
    return el("div", { class: "row" }, el("h2", { text: title, tabindex: "-1" }), ui.closeButton);
  }

  function changePane(row) {
    const data = view.data;
    const out = [
      closeRow(`${row.label}: ${row.subject}`),
      el("div", { class: "summary" }, el("span", { class: "badge", text: sectionTitle(row.section) }), kindBadge(row.kind),
        row.eco ? el("span", { class: "badge muted", text: `ECO: ${row.eco}` }) : null,
        row.unknown ? el("span", { class: "badge muted", text: `change ${row.change}` }) : null),
      el("p", { class: "help", text: row.text }),
      Shell.facts([["About", `${row.subject} (${row.subjectType})`], ...row.facts.filter(([, value]) => value !== "")]),
    ];
    if (row.diff.length) {
      out.push(el("table", { class: "ba", "aria-label": "Every field before and after" },
        el("thead", {}, el("tr", {}, el("th", { class: "f", scope: "col", text: "Field" }),
          el("th", { scope: "col", text: "Before (a)" }), el("th", { scope: "col", text: "After (b)" }))),
        el("tbody", {}, row.diff.map((item) => el("tr", {},
          el("th", { class: "f", scope: "row", text: item.label }),
          el("td", {}, item.a || el("span", { class: "none", text: "–" })),
          el("td", {}, item.b || el("span", { class: "none", text: "–" })))))));
    }
    out.push(el("p", { class: "foot", text: `Sides: a is ${sideText(data.a)}, b is ${sideText(data.b)}. Lengths in ${data.units}.` }));
    out.push(el("div", { class: "btn-row" }, el("button", { type: "button", class: "btn", text: "Show in the list", on: { click: () => showInList(row._id) } })));
    out.push(...linkSection(row));
    return out;
  }

  /**
   * Links for the change's parts and nets on the side the server has loaded: to the board
   * view and the schematic, as messages to Claude (fixed words, names under the rule), and
   * get_component and query_net asked in place for any name (a call from the view puts
   * nothing in the conversation; its answer is drawn as text). Names on the other side
   * only, or outside the rule, are said so and never sent in a message.
   */
  function linkSection(row) {
    const data = view.data;
    const loaded = loadedSide(data);
    const side = loaded || "b";
    const names = row.names[side];
    const other = row.names[side === "a" ? "b" : "a"].filter((item) => !names.some((name) => name.type === item.type && name.name === item.name));
    const valid = names.filter((item) => validName(item.type, item.name));
    const refused = names.filter((item) => !validName(item.type, item.name));
    const out = [el("h3", { text: "On the board and the schematic" })];
    if (!names.length && !other.length) {
      out.push(el("p", { class: "muted", text: "This change names no part or net to show." }));
      return out;
    }
    const where = loaded ? `The board view and the server's answers show the loaded project: the files on disk, side ${loaded} here.`
      : `Side b is ${sideText(data.b)}: the board view and the server's answers show the loaded project (the files on disk), which may differ from it.`;
    out.push(el("p", { class: "help", text: where }));
    if (valid.length) {
      const board = valid.slice(0, MAX_NAMES);
      const text = sentence("board", board);
      const what = board.length === 1 ? NAME_WORDS[board[0].type] : "them";
      out.push(el("div", { class: "linkrow" }, messageControl(`board:${row._id}`, `Show ${what} on the board view`, text, null,
        `Ask Claude: show ${board.length === 1 ? `${what} ${board[0].name}` : what} on the board view`),
        valid.length > board.length ? el("span", { class: "muted", text: `the first ${board.length} of ${plural(valid.length, "name")}` }) : null));
    }
    // Each part and net: the schematic link (a message, for a name under the rule) and the
    // details asked in place (for any name).
    const each = names.filter((item) => item.type !== "pad");
    const listed = each.slice(0, MAX_LISTED);
    for (const item of listed) {
      const ok = validName(item.type, item.name);
      const kind = item.type === "part" ? "schematic_part" : "schematic_net";
      const tool = item.type === "part" ? "get_component" : "query_net";
      const args = item.type === "part" ? { refdes: item.name } : { pattern: Shell.exactPattern(item.name) };
      const entry = answers.get(answerKey(tool, args));
      const loading = Boolean(entry && entry.loading);
      out.push(el("div", { class: "linkrow" },
        el("span", { class: "name", text: `${NAME_WORDS[item.type]} ${item.name}` }),
        ok ? messageControl(`${kind}:${row._id}:${item.name}`, "On the schematic", sentence(kind, [item]),
          `Sends to the conversation: ${sentence(kind, [item])} (there is no schematic view yet: Claude answers in text)`,
          `Ask Claude: ${NAME_WORDS[item.type]} ${item.name} on the schematic`)
          : el("span", { class: "muted", text: "not sent in a message" }),
        canCall() && !view.closed ? el("button", { type: "button", class: "btn", text: loading ? "Asking…" : `${tool} here`,
          "aria-disabled": loading ? "true" : null, title: `${tool}(${callArgs(args)}): the loaded project now, in this pane`,
          on: { click: () => askDetail(tool, args) } }) : null));
      if (entry) out.push(answerBlock(tool, args, entry));
    }
    if (each.length > listed.length) {
      // More than MAX_LISTED, so never one.
      out.push(el("p", { class: "muted", text: `Links for the first ${listed.length} of ${each.length} parts and nets; the fields above name the others.` }));
    }
    if (refused.length) {
      const rules = [...new Set(refused.map((item) => item.type))].map((type) => own(RULE_WORDS, type)).filter(Boolean);
      out.push(el("p", { class: "help", text: `Not sent in a message (${refused.map((item) => `${NAME_WORDS[item.type]} ${item.name}`).join(", ")}): a message carries a name only in its plain form: ${rules.join("; ")}. Copy the name from here to ask Claude yourself.` }));
    }
    if (other.length) {
      out.push(el("p", { class: "help", text: `In ${side === "a" ? "b" : "a"} only: ${other.map((item) => `${NAME_WORDS[item.type]} ${item.name}`).join(", ")}. The loaded project may not have ${other.length === 1 ? "it" : "them"}, so no link is offered.` }));
    }
    if (!canCall() && !view.closed) out.push(el("p", { class: "muted", text: "This host does not let the view call tools: ask Claude for get_component or query_net." }));
    return out;
  }

  const callArgs = (args) => Object.entries(args).map(([key, value]) => `${key}="${value}"`).join(", ");

  function answerBlock(tool, args, entry) {
    const head = el("h4", { text: `${tool}(${callArgs(args)}) · the loaded project now` });
    if (entry.loading) return el("div", { class: "answer" }, head, el("p", { class: "muted", text: "Asking…" }));
    if (entry.error) {
      return el("div", { class: "answer" }, head, el("div", { class: "notice error" }, el("span", { class: "grow", text: entry.error }),
        canCall() && !view.closed ? el("button", { type: "button", class: "btn-link", text: "Retry", on: { click: () => askDetail(tool, args) } }) : null));
    }
    const { json, text } = parsedAnswer(entry);
    const again = canCall() && !view.closed ? el("button", { type: "button", class: "btn-link", text: "Ask again",
      title: "The files may have changed: ask again", on: { click: () => askAgain(tool, args) } }) : null;
    if (!json) return el("div", { class: "answer" }, head, el("pre", { class: "text", text: String(text).slice(0, 4000) }), again);
    if (json.error) return el("div", { class: "answer" }, head, el("div", { class: "notice warning", text: json.message || json.error }), again);
    if (tool === "query_net") {
      // Several nets when names differ only in case (query_net ignores case): the one named
      // exactly, else each.
      const all = Array.isArray(json.nets) ? json.nets.filter(isObject) : [json];
      const exact = all.filter((net) => typeof net.net === "string" && Shell.exactPattern(net.net) === args.pattern);
      return el("div", { class: "answer" }, head, (exact.length ? exact : all).map((net) => {
        const pins = listOf(net.pins).length ? net.pins : listOf(net.pins_sample);
        return el("div", {},
          Shell.facts([["Net", net.net], ["Pins", net.pin_count === undefined ? null : String(net.pin_count)], ["Note", net.message || null]]),
          el("ul", { class: "flat" }, pins.slice(0, 40).map((pin) => el("li", { text: `${isObject(pin) ? pin.refdes : "?"}.${isObject(pin) ? pin.pin : "?"}` })),
            pins.length > 40 ? el("li", { class: "muted", text: `and ${pins.length - 40} more` }) : null));
      }), again);
    }
    const pins = Object.keys(isObject(json.pins) ? json.pins : {}).length;
    return el("div", { class: "answer" }, head,
      el("p", { class: "help small", text: "As the active variant shows it when asked." }),
      Shell.facts([
        ["Fitted", json.dnp ? "no: Not Fitted in the active variant" : "yes"],
        ["Value", json.value], ["Description", json.description], ["MPN", json.mpn], ["Sheet", json.sheet],
        ["Pins", pins ? String(pins) : null],
      ]), again);
  }

  // ---------- host ----------

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && view.selected && !event.defaultPrevented) closeDetails();
  });
  Shell.on("toolInput", (args) => {
    view.args = args || {};
    view.argsKnown = true;
    if (!view.data) showState("loading", "Reading the design diff", `${argText(cleanArgs(view.args))} is comparing the two sides.`);
  });
  Shell.on("toolInputPartial", () => {
    if (!view.data) showState("loading", "Reading the design diff", "Waiting for the tool's arguments.");
  });
  Shell.on("toolResult", (result) => loadResult(result));
  Shell.on("toolCancelled", (reason) => {
    if (!view.data) showState("info", `The ${TOOL} call was cancelled`, reason || "No result to show.");
  });
  Shell.on("teardown", () => {
    view.closed = true;
    closeCalls();
    view.busy = "";
    Shell.announce("The view was closed: it asks the server nothing more");
    if (view.data && ui.header) {
      renderHeadBlocks();
      renderPane();
    } else if (view.errorShown) {
      showError(view.errorShown.payload, view.errorShown.asked);
    } else {
      showState("info", "The view was closed", "It asks the server nothing more, and no design diff was read before it closed.");
    }
  });
  // The host's size or display mode changed: the narrow and short layouts may too; the
  // disclosures the user has not set open or fold again.
  const layoutSig = () => `${narrowHost()}|${Shell.context().displayMode}|${short()}|${cramped()}|${compactHost()}`;
  let wasLayout = layoutSig();
  function onLayoutChange() {
    if (!view.data || !ui.header) return;
    if (layoutSig() === wasLayout) return;
    wasLayout = layoutSig();
    if (view.auto.filters) view.filtersOpen = null;
    if (view.auto.picker) view.pickerOpen = null;
    // Focus goes back to the control or the row it was on.
    const mark = Shell.focusMark(app);
    const spot = focusSpot();
    renderAll();
    if (spot && ui.table && ui.table.focus((row) => row._id === spot)) return;
    if (mark) Shell.refocus(app, mark, () => ui.headline || null);
  }
  Shell.on("context", () => {
    onLayoutChange();
    queueOwnFit();
  });
  window.addEventListener("resize", () => {
    onLayoutChange();
    queueOwnFit();
  });

  // Full screen with no height from the host: the shell then fits no pane (it has no
  // limit), so the page fits its panes to the window's own height, on #app (the shell sets
  // the root's --pane-height only from a height the host gives).
  let ownFit = "";
  let ownQueued = false;
  function fitOwnHeight() {
    ownQueued = false;
    const dims = Shell.context().containerDimensions || {};
    const mine = Shell.context().displayMode === "fullscreen" && !(Number(dims.height || dims.maxHeight) > 0);
    const limit = window.innerHeight;
    if (!mine || !limit) {
      if (ownFit) app.style.removeProperty("--pane-height");
      ownFit = "";
      return;
    }
    const html = document.documentElement;
    // The page's height with its scrollbar shown, as the shell measures it.
    const height = () => {
      const saved = [html.style.height, html.style.overflowY];
      html.style.height = "max-content";
      html.style.overflowY = "scroll";
      const value = Math.ceil(html.getBoundingClientRect().height);
      [html.style.height, html.style.overflowY] = saved;
      return value;
    };
    const set = (px) => app.style.setProperty("--pane-height", `${px}px`);
    const state = () => `${limit}|${window.innerWidth}|${app.style.getPropertyValue("--pane-height")}|${height()}`;
    let current = parseInt(app.style.getPropertyValue("--pane-height"), 10);
    if (!Number.isFinite(current)) {
      current = limit;
      set(current);
    }
    if (state() === ownFit) return;
    // Up from the current height only, unless the page is too tall (pane scroll positions stay).
    let low = current;
    let high = limit;
    if (current > limit || height() > limit) {
      low = 64;
      high = Math.min(current, limit);
    }
    while (high - low > 4) {
      const middle = Math.floor((low + high) / 2);
      set(middle);
      if (height() <= limit) low = middle;
      else high = middle;
    }
    set(high);
    if (height() > limit) set(low);
    ownFit = state();
  }
  function queueOwnFit() {
    if (ownQueued) return;
    ownQueued = true;
    setTimeout(fitOwnHeight, 30);
  }
  if (typeof ResizeObserver === "function") new ResizeObserver(queueOwnFit).observe(document.body);

  showState("loading", "Connecting to the host", "");
  Shell.connect({ name: "altium-copilot-kc Design diff", version: "1.0.0" })
    .then(() => {
      if (!view.data && !view.errorShown) showState("loading", `Waiting for ${TOOL}`, "The changes appear when the tool's result arrives.");
    })
    .catch((error) => showState("error", "This view needs a host that shows MCP Apps", error.message));
})();
</script>
