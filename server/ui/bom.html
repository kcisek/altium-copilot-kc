<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--@csp-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOM</title>
<style>/*@shell.css*/</style>
<style>
/* BOM view (roadmap #62): get_bom's lines per variant as a grouped, filterable table with
   check_bom's findings per line, the Not Fitted parts, MPN gaps, alternate parts, a local
   quantity for a number of boards and, with an ActiveBOM document, a line's ranked
   solutions from get_active_bom (cached supply data, always shown with its cache date). */
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 0 0 6px; }
.head h1 { font-size: var(--fs-lg); margin: 0; font-weight: var(--fw-bold); }
.head .grow { flex: 1 1 auto; }
.summary { display: flex; flex-wrap: wrap; gap: 4px; }
.vs { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; min-width: 0; }
.vs .name { font-weight: var(--fw-medium); overflow-wrap: anywhere; }
.approx { font-size: var(--fs-xs); color: var(--c-text3); margin: 0 0 8px; overflow-wrap: anywhere; }
.picker { border: 1px solid var(--c-line); border-radius: var(--radius); padding: 8px 10px; margin: 0 0 8px;
          font-size: var(--fs-sm); }
.picker-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 6px; }
.picker label { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; }
.picker .side { font-weight: var(--fw-bold); }
select.pick { border: 1px solid var(--c-border); border-radius: var(--radius-sm); background: var(--c-bg);
              padding: 2px 6px; font-size: var(--fs-sm); min-width: 8em; max-width: min(100%, 22em); }
input.boards { border: 1px solid var(--c-border); border-radius: var(--radius-sm); background: var(--c-bg);
               padding: 2px 6px; font-size: var(--fs-sm); width: 7em; }
.picker .help { margin: 6px 0 0; color: var(--c-text2); font-size: var(--fs-xs); overflow-wrap: anywhere; }
.filters { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 0 0 8px; }
.tbl td.c-val { min-width: 6em; overflow-wrap: anywhere; }
/* Part numbers and footprints keep a readable width; the table scrolls inside its frame. */
.tbl td.c-part { min-width: 8.5em; overflow-wrap: anywhere; }
.val { overflow-wrap: anywhere; }
.val.unset { color: var(--c-text3); font-style: italic; }
.mark { margin-left: 4px; }
.marks { display: inline-flex; flex-wrap: wrap; gap: 3px; }
.desig { overflow-wrap: anywhere; }
.desig .btn-link { margin-left: 4px; font-size: var(--fs-xs); }
.sub { display: block; font-size: var(--fs-xs); color: var(--c-text2); overflow-wrap: anywhere; }
.findings { margin: 4px 0 8px; padding-left: 0; list-style: none; }
.findings li { margin: 3px 0; overflow-wrap: anywhere; }
.findings .badge { margin-right: 6px; }
.status { font-size: var(--fs-xs); color: var(--c-text3); }
.section-gap { margin-top: 14px; }
/* The Variants and Notes tabs scroll as one pane (fitted to the host's height); their
   tables inside it are not capped again, nor are the details pane's. */
.content > .pane .tbl-wrap, aside.pane .tbl-wrap { max-height: none; }
.pane dl.facts { grid-template-columns: fit-content(45%) minmax(0, 1fr); }
.pane dl.facts dt { min-width: 0; overflow-wrap: anywhere; }
.pane h3 { overflow-wrap: anywhere; }
.pane .summary .badge { white-space: normal; overflow-wrap: anywhere; }
.pane .btn-row .btn { white-space: normal; overflow-wrap: anywhere; text-align: left; max-width: 100%; }
.pane .btn-row select.pick { max-width: 100%; }
/* A short host 980 px wide or less: a selected line's details take the table's place
   (Close or Esc brings the table back), rather than both shrinking to a row or two. */
@media (max-width: 980px) {
  .split.solo > .content { display: none; }
}
.bomdoc-line { border: 1px solid var(--c-line); border-radius: var(--radius-sm); padding: 6px 8px; margin: 6px 0; }
.bomdoc-line h4 { font-size: var(--fs-sm); margin: 0 0 4px; overflow-wrap: anywhere; }
.solution { border-top: 1px solid var(--c-line); padding: 6px 0 2px; }
.solution h5 { font-size: var(--fs-sm); margin: 0 0 4px; font-weight: var(--fw-medium); overflow-wrap: anywhere; }
.cached { font-size: var(--fs-xs); color: var(--c-text2); }
.local { font-size: var(--fs-xs); color: var(--c-text2); overflow-wrap: anywhere; }
.local.invalid { color: var(--c-danger); }
input.boards[aria-invalid="true"] { border-color: var(--c-danger); }
/* A solution's part choices have fixed columns: the cache date is never hidden from the
   stock, price and lifecycle cached with it. */
.solution .tbl-block > .toolbar { display: none; }
/* Headings that take keyboard focus while their section's buttons are gone. */
.pane h3[tabindex="-1"]:focus { outline: none; }
.pane h3[tabindex="-1"]:focus-visible { outline: 2px solid var(--c-ring); outline-offset: 2px; }
</style>
</head>
<body>
<main id="app"></main>
<script type="application/json" id="data-contract">
{
  "tool": "get_bom",
  "checks_tool": "check_bom",
  "solutions_tool": "get_active_bom",
  "picker": "list_variants",
  "paged": "lines",
  "base": "[No Variations]",
  "base_names": ["[no variations]", "no variations", "none", "base"],
  "mpn_undecided": ["tbd", "tba", "?"],
  "designators_listed": {"not_compiled": 30, "bom_doc": 50},
  "checks": {
    "duplicate_designator": "Duplicate designator",
    "unresolved_special_string": "Unresolved special string",
    "dnp_marker_on_fitted": "DNP mark on a fitted part",
    "no_footprint": "No footprint",
    "mpn_inconsistent": "MPN inconsistent",
    "mpn_without_manufacturer": "MPN without manufacturer",
    "missing_mpn": "Missing MPN",
    "placeholder_description": "Placeholder description",
    "stale_variant_entry": "Stale variant entry",
    "consolidation": "Consolidation candidate",
    "not_compiled": "Not compiled",
    "lifecycle_risk": "Lifecycle risk (cached)",
    "single_source": "Single source",
    "no_solution": "No solution",
    "out_of_stock_at_qty": "Out of stock at the need (cached)",
    "stale_cache": "Stale supply cache",
    "bomdoc_out_of_sync": "BomDoc out of sync"
  },
  "bom_doc_checks": ["lifecycle_risk", "single_source", "no_solution", "out_of_stock_at_qty", "stale_cache",
                     "bomdoc_out_of_sync"],
  "shapes": {
    "result": {
      "required": ["variant", "netlist_updated_utc", "compiled_part_list", "parts", "mpn_coverage_percent",
                   "lines_total", "offset", "has_more"],
      "optional": ["next_offset", "lines", "csv", "not_fitted", "not_fitted_designators", "variants",
                   "lines_limited_to", "stale_variant_entries", "alternate_parts_note", "bom_doc", "bom_doc_error"]
    },
    "parts": {"required": ["in_bom", "not_fitted", "excluded_by_kind"], "optional": []},
    "lines[]": {
      "required": ["quantity", "designators"],
      "optional": ["comment", "description", "value", "footprint", "manufacturer", "mpn", "mpn_placeholder",
                   "mpn_source", "varies", "varies_count", "logical_designators", "alternate_parts",
                   "varied_parameters", "bom_doc_lines", "bom_doc_chosen"]
    },
    "lines[].bom_doc_chosen[]": {"required": [], "optional": ["manufacturer", "mpn", "source", "lifecycle", "cache_date"]},
    "not_fitted[]": {
      "required": ["quantity", "designators"],
      "optional": ["comment", "description", "value", "footprint", "manufacturer", "mpn", "mpn_placeholder",
                   "mpn_source", "varies", "varies_count", "logical_designators", "alternate_parts",
                   "varied_parameters"]
    },
    "variants[]": {"required": ["variant", "not_fitted", "changed"], "optional": []},
    "variants[].changed[]": {
      "required": ["designator"],
      "optional": ["comment", "description", "value", "footprint", "manufacturer", "mpn", "alternate_part"]
    },
    "bom_doc": {
      "required": ["file", "chosen_by", "in_project", "cache", "lines"],
      "optional": ["other_bom_docs", "not_in_project", "missing_on_disk"]
    },
    "bom_doc_error": {"required": ["error", "message"], "optional": ["hint"]}
  },
  "check_bom": {
    "result": {
      "required": ["variant", "parts", "mpn_coverage_percent", "checks_run", "summary", "severity_counts",
                   "findings", "total", "offset", "has_more"],
      "optional": ["next_offset", "checks_not_run", "findings_limited_to", "bom_doc", "bom_doc_error"]
    },
    "severity_counts": {"required": ["error", "warning", "info"], "optional": []},
    "findings[]": {
      "required": ["check", "severity", "issue"],
      "optional": ["designators", "line", "design_item_id", "lines", "unnumbered_lines", "mpn", "mpns",
                   "manufacturer", "lifecycle", "cache_date", "other_lifecycles", "need", "stock", "field",
                   "comment", "count", "reason", "why", "coverage_percent", "oldest", "newest", "part_mpn",
                   "design_item_ids", "source", "bom_doc_lines", "bom_doc_unnumbered_lines"]
    }
  },
  "get_active_bom": {
    "result": {
      "required": ["variant", "bom_doc", "summary", "production_quantity_used", "production_quantity_from", "cache"],
      "optional": ["line", "lines_omitted"]
    },
    "cache": {"required": ["part_choices", "dated", "note"], "optional": ["oldest", "newest"]},
    "line": {
      "required": ["line", "designators", "quantity", "solutions"],
      "optional": ["design_item_id", "source", "item_type", "description", "comment", "note", "status",
                   "line_unnumbered", "ref", "quantity_at_production", "not_fitted", "join", "why_no_parts",
                   "ambiguous_designators", "custom_parameters", "ranked_solutions", "cache_dates"]
    },
    "line.ranked_solutions[]": {
      "required": ["source"],
      "optional": ["rank", "manufacturer", "mpn", "lifecycle", "lifecycle_risk", "ranked_by_designer", "cache_date",
                   "stock_total", "best_unit_price", "best_price_supplier", "currency",
                   "best_price_below_minimum_order", "minimum_order_quantity", "suppliers", "part_choices"]
    },
    "line.ranked_solutions[].part_choices[]": {
      "required": [],
      "optional": ["supplier", "sku", "stock", "enough_stock", "unit_price", "currency", "lifecycle",
                   "cache_date", "cache_date_text", "price_break_quantity", "below_minimum_order", "no_supplier",
                   "pinned"]
    }
  },
  "list_variants": {
    "result": {"required": ["active_variant", "variants"], "optional": []},
    "variants[]": {"required": ["name", "is_active"], "optional": []}
  }
}
</script>
<script>/*@shell.js*/</script>
<script>
(() => {
  "use strict";
  const { el, clear } = Shell;
  const CONTRACT = JSON.parse(document.getElementById("data-contract").textContent);
  const app = document.getElementById("app");

  const MAX_PAGES = 60;
  // The only tools this page calls. None of them changes the server's state: the variant
  // switch shows another variant's BOM, it never switches the active variant.
  const READ_ONLY_TOOLS = new Set(["get_bom", "check_bom", "get_active_bom", "list_variants", "get_component"]);
  const BASE = CONTRACT.base;
  // The names get_bom also takes for the base design (when no variant has one).
  const BASE_NAMES = CONTRACT.base_names;
  // MPN texts that say a part number is not chosen yet (it is still needed); any other
  // placeholder ('N/A', '-') says the part has none on purpose (services/bom.needs_mpn).
  const UNDECIDED = new Set(CONTRACT.mpn_undecided);
  const CHECK_LABEL = CONTRACT.checks;
  const BOM_DOC_CHECKS = new Set(CONTRACT.bom_doc_checks);
  // check_bom lists at most this many designators of a not_compiled finding and of a
  // BomDoc finding about many lines (with a count): the lines marked are "at least" these.
  const LISTED = CONTRACT.designators_listed;
  // get_bom's arguments the view keeps (offset and format are its own).
  const ARG_KEYS = ["variant", "group_by", "include_not_fitted", "compare_variants", "active_bom"];
  const FIELDS = [["comment", "Comment"], ["value", "Value"], ["description", "Description"],
                  ["footprint", "Footprint"], ["manufacturer", "Manufacturer"], ["mpn", "MPN"]];
  const FIELD_LABEL = Object.fromEntries(FIELDS);
  const SEVERITY_RANK = { error: 0, warning: 1, info: 2 };
  const SEVERITY_NOUN = { error: "error", warning: "warning", info: "info" };
  const NONE = "\u0001none";
  const NO_FINDING = "\u0001clean";
  const NOT_KNOWN = "\u0001unknown";
  const GROUPINGS = [
    { id: "none", label: "None", title: "No groups: get_bom's lines in its order" },
    { id: "manufacturer", label: "Manufacturer", title: "The lines of each manufacturer together" },
    { id: "footprint", label: "Footprint", title: "The lines of each footprint together" },
    { id: "finding", label: "Finding", title: "The lines of each check_bom finding together" },
  ];
  const SHOW = [
    { id: "all", label: "All lines" },
    { id: "missing", label: "Missing MPN", title: "Lines with a part that needs a manufacturer part number and has none (mpn_coverage_percent's rule)" },
    { id: "findings", label: "With findings", title: "Lines check_bom names in a finding" },
  ];
  const READ_ONLY_NOTE = "Showing another variant does not switch the active variant: the view only asks get_bom and check_bom with variant=, never set_active_variant.";
  const CACHE_NOTE = "Stock, prices and lifecycle are what ActiveBOM cached on the dates shown, not current data: no supplier is asked.";
  const LOCAL_NOTE = "Quantity per board × boards, worked out in the view: a local calculation, not stock and not price.";
  const MPN_RULE = "A line misses an MPN when a part on it needs a manufacturer part number and has none: the rule of get_bom's mpn_coverage_percent (no MPN parameter, and no placeholder that says none is needed, such as 'N/A' or '-'; 'TBD' still needs one; Not Fitted and mechanical parts are not counted). Once check_bom has answered for a project without a BomDoc, its missing_mpn findings name those parts. Until then, or with a BomDoc (whose part choices check_bom counts as MPNs, so it names only some of the parts), a part it names counts and the lines' own data decide the rest: they do not say which parts are mechanical, and they list a line's distinct placeholders and at most five of its MPNs, not each part's. A line they cannot decide is marked \"MPN may be missing\" and kept in the Missing MPN filter.";

  const view = {
    args: {}, argsKnown: false, data: null, errorPayload: null, busy: false, closed: false, warnings: [],
    checks: null, notFitted: null, compare: null,
    variants: null, active: null, variantsError: "", variantsLoading: null, listWarnings: [], pick: null, wanted: null,
    query: "", groupBy: "none", kinds: new Set(["fitted"]), show: "all", tab: "lines",
    selected: null, asked: [], expanded: new Set(), boards: 1, componentPick: null, solutions: new Map(),
    filtersOpen: null, controlsOpen: null,
  };
  const ui = {};
  const details = Shell.toolCache((tool, args, entry) => {
    renderPane();
    if (entry && !entry.loading) Shell.announce(`${tool} ${entry.error ? "failed" : "answered"}`);
  });
  // The active variant list_variants named just before each get_component call (null when
  // it could not say): an answer is labelled with it, never with a later one, and asked
  // again when list_variants names another active variant.
  const askedUnder = new Map();

  // ---------- helpers ----------

  const canCall = () => Shell.canCallTools();
  const plural = Shell.plural;
  // The server's natural_key order (R9 before R10, case-insensitive, digits as numbers).
  const naturalKey = (text) => String(text).split(/(\d+)/).map((part, index) => (index % 2 ? Number(part) : part.toLowerCase()));
  function naturalOrder(x, y) {
    const a = naturalKey(x);
    const b = naturalKey(y);
    for (let index = 0; index < Math.min(a.length, b.length); index += 1) {
      if (a[index] === b[index]) continue;
      if (typeof a[index] === "number") return a[index] - b[index];
      return a[index] < b[index] ? -1 : 1;
    }
    return a.length - b.length;
  }
  const trimmed = (value) => String(value === null || value === undefined ? "" : value).trim();
  // The server's variant names: case-insensitive, an empty name or [All Variants] is the base.
  const normName = (name) => {
    const text = trimmed(name).toLowerCase();
    return text === "" || text === BASE.toLowerCase() || text === "[all variants]" ? BASE.toLowerCase() : text;
  };
  const sameVariant = (x, y) => normName(x) === normName(y);
  const isBase = (name) => normName(name) === BASE.toLowerCase();
  const baseAlias = (name) => BASE_NAMES.includes(trimmed(name).toLowerCase());
  const checkLabel = (check) => CHECK_LABEL[check] || String(check || "").replace(/_/g, " ");
  const stale = (count) => `${count} stale variant ${count === 1 ? "entry" : "entries"}`;
  const severityText = (severity, count) => (severity === "info" ? `${count} info` : plural(count, SEVERITY_NOUN[severity] || severity));

  /** get_bom's arguments the view keeps: the known keys, false and empty left out. */
  function cleanArgs(args) {
    const out = {};
    for (const key of ARG_KEYS) {
      const value = args ? args[key] : undefined;
      if (value === undefined || value === null || value === false || value === "") continue;
      out[key] = value;
    }
    return out;
  }

  // Heights for about five rows of the lines table (BOM rows wrap to 60-95 px where the
  // table is under 800 px wide), the page around it with both disclosures folded (head,
  // caption, filter, tabs, the table's own toolbar and foot) and what opening the two
  // disclosures adds: measured on Mini PC with the BomDoc columns at 780 and 1100 px.
  const ROWS_HEIGHT = 420;
  const CHROME_HEIGHT = 260;
  const OPEN_HEIGHT = 210;

  function heightLimit() {
    const dims = Shell.context().containerDimensions || {};
    return Number(dims.height || dims.maxHeight) || 0;
  }

  /** Room for the open switch and filters while the table keeps about five rows, and so
   *  does the details pane stacked under it on a host 980 px wide or less (unless the
   *  details take the table's place there): 890 px side by side, 1320 px stacked. With
   *  less, both start folded behind their one-line disclosures. */
  function roomyHere() {
    if (!Shell.roomy()) return false;
    const limit = heightLimit();
    if (!limit) return true;
    const panes = window.innerWidth <= 980 && !compactHost() ? 2 : 1;
    return limit >= CHROME_HEIGHT + OPEN_HEIGHT + panes * ROWS_HEIGHT + (panes - 1) * 10;
  }

  /** A host 980 px wide or less, where the details pane is stacked under the table, too
   *  short for both to keep about five rows (under 1110 px): there a selected line's
   *  details take the table's place. */
  function compactHost() {
    const limit = heightLimit();
    return window.innerWidth <= 980 && limit > 0 && limit < CHROME_HEIGHT + 2 * ROWS_HEIGHT + 10;
  }

  // Teardown rejects every call still waiting: the closed view waits for no answer (a
  // call the host never answers would otherwise hold its "Asking…" for two minutes).
  let closeCalls = () => {};
  const whenClosed = new Promise((resolve, reject) => {
    closeCalls = () => reject(new Error("the view was closed"));
  });
  whenClosed.catch(() => {});

  /** Call one of the page's read-only tools (through the shell, which checks serverTools). */
  function call(tool, args) {
    if (!READ_ONLY_TOOLS.has(tool)) return Promise.reject(new Error(`The view does not call ${tool}.`));
    if (view.closed) return Promise.reject(new Error("the view was closed"));
    return Promise.race([Shell.callTool(tool, args), whenClosed]);
  }

  /** Designators as short tokens in the order given: three or more consecutive numbers of
   *  one prefix as a range (R1–R4), the others one by one. */
  function ranges(list) {
    const tokens = [];
    let run = [];
    const parse = (text) => {
      const match = /^(.*?)(\d+)$/.exec(text);
      if (!match || /\d$/.test(match[1]) || (match[2].length > 1 && match[2].startsWith("0"))) return null;
      return { prefix: match[1], number: Number(match[2]) };
    };
    const close = () => {
      if (run.length >= 3) tokens.push({ text: `${run[0].text}–${run[run.length - 1].text}`, count: run.length });
      else for (const item of run) tokens.push({ text: item.text, count: 1 });
      run = [];
    };
    for (const designator of list || []) {
      const text = String(designator);
      const parsed = parse(text);
      const last = run[run.length - 1];
      if (parsed && last && last.parsed.prefix === parsed.prefix && parsed.number === last.parsed.number + 1) {
        run.push({ text, parsed });
        continue;
      }
      close();
      if (parsed) run.push({ text, parsed });
      else tokens.push({ text, count: 1 });
    }
    close();
    return tokens;
  }

  // ---------- data contract ----------

  /** The rows a contract path names: "x.y[]" a list's items, "x.y{}" an object's values. */
  function rowsAt(data, path) {
    if (path === "result") return [data];
    let rows = [data];
    for (const part of path.split(".")) {
      const key = part.replace(/(\[\]|\{\})$/, "");
      rows = rows.flatMap((row) => {
        const value = row && typeof row === "object" ? row[key] : undefined;
        if (part.endsWith("[]")) return Array.isArray(value) ? value : [];
        if (part.endsWith("{}")) return value && typeof value === "object" && !Array.isArray(value) ? Object.values(value) : [];
        return value === undefined || value === null ? [] : [value];
      });
    }
    return rows;
  }

  function checkContract(shapes, data) {
    const problems = [];
    for (const [path, shape] of Object.entries(shapes)) {
      for (const key of shape.required) {
        const missing = rowsAt(data, path).filter((row) => !row || typeof row !== "object" || !(key in row)).length;
        if (missing) problems.push(`${path}: ${key} missing in ${missing} row(s)`);
      }
    }
    return problems;
  }

  // ---------- lines ----------

  function makeRows(lines, fitted, start) {
    return (lines || []).map((line, index) => ({
      ...line, _key: `${fitted ? "l" : "n"}${start + index}`, _rank: (fitted ? 0 : 1e7) + start + index,
      _fitted: fitted, _findings: [], _severity: null, _missing: false,
    }));
  }

  function fittedRows() {
    return (view.data && view.data.rows) || [];
  }

  function notFittedRows() {
    return (view.notFitted && view.notFitted.rows) || [];
  }

  function allRows() {
    return [...fittedRows(), ...notFittedRows()];
  }

  /** The parts check_bom's missing_mpn names (upper case). listed: each needs an MPN and
   *  has no MPN parameter (true whatever else holds). exact: those are all such parts
   *  (every page read, no BomDoc, whose part choices count as MPNs there and leave their
   *  parts out, and per-part findings, at half the parts or more with an MPN), else null
   *  and the lines' own data decide for the parts not listed. */
  function missingFromChecks() {
    const checks = view.checks;
    if (!checks || !checks.findings || !checks.header) return { exact: null, listed: new Set() };
    const header = checks.header;
    const findings = checks.findings.filter((finding) => finding.check === "missing_mpn");
    const listed = new Set(findings.flatMap((finding) => (finding.designators || []).map((designator) => String(designator).toUpperCase())));
    const exact = !checks.stopped && (header.checks_run || []).includes("missing_mpn") && !header.bom_doc &&
      !header.bom_doc_error && findings.every((finding) => (finding.designators || []).length > 0);
    return { exact: exact ? listed : null, listed };
  }

  const placeholderMarks = (row) => String(row.mpn_placeholder || "").split(" / ").map((text) => text.trim().toLowerCase());

  /** Whether a fitted line has a part that needs an MPN and has none, by
   *  mpn_coverage_percent's rule (services/bom.needs_mpn): {state: "yes", "may" (the
   *  line's data cannot tell) or "", why}. No part needs one when the coverage is null;
   *  check_bom's missing_mpn decides when it names the parts exactly (mechanical parts
   *  left out), and a part it lists always counts. Else the line tells what it can: a
   *  placeholder other than 'TBD', 'TBA' or '?' says none is needed, but get_bom lists a
   *  line's distinct placeholders and up to five MPNs, not each part's. */
  function missingMpn(row, checks) {
    const no = { state: "", why: "" };
    if (!row._fitted || !view.data) return no;
    const coverage = view.data.mpn_coverage_percent;
    if (coverage === null || coverage === undefined) return no;
    const names = (row.designators || []).map((designator) => String(designator).toUpperCase());
    if (checks.exact) return names.some((name) => checks.exact.has(name)) ? { state: "yes", why: "check_bom's missing_mpn names a part of this line." } : no;
    if (names.some((name) => checks.listed.has(name))) return { state: "yes", why: "check_bom's missing_mpn names a part of this line." };
    const varies = row.varies && Array.isArray(row.varies.mpn) ? row.varies.mpn : null;
    if (row.mpn) {
      if (varies && varies.some((value) => value === null)) {
        return { state: "may", why: "A part of this line has no MPN parameter: get_bom does not say whether it has a placeholder that says none is needed (such as 'N/A') or is a mechanical part." };
      }
      const counted = row.varies_count && row.varies_count.mpn;
      if (varies && counted && counted > varies.length) {
        return { state: "may", why: `get_bom lists ${varies.length} of the ${counted} MPNs of this line's parts: a part without one may be among the others.` };
      }
      return no;
    }
    if (!row.mpn_placeholder) return { state: "yes", why: "No part of this line has an MPN parameter or a placeholder (a mechanical part would not count, and get_bom does not say which parts are mechanical)." };
    const marks = placeholderMarks(row);
    if (marks.some((text) => UNDECIDED.has(text))) return { state: "yes", why: `A part of this line has the placeholder ${row.mpn_placeholder}: it still needs an MPN.` };
    if ((Number(row.quantity) || 0) > marks.length) {
      return { state: "may", why: `get_bom lists the line's placeholders (${row.mpn_placeholder}), not which parts have one: a part without any may be among its ${row.quantity}.` };
    }
    return no;
  }

  function worst(findings) {
    let best = null;
    for (const finding of findings) {
      if (best === null || (SEVERITY_RANK[finding.severity] ?? 9) < (SEVERITY_RANK[best] ?? 9)) best = finding.severity;
    }
    return best;
  }

  /** check_bom's findings mapped to the lines by designator: each line its findings, each
   *  finding its lines and the designators on no line drawn. A duplicate_designator
   *  finding names a sheet designator (as on its sheet): the lines of the parts with that
   *  sheet designator, or the part of that name that has no other one; when both exist
   *  (get_bom's lines give no sheet), no line is marked and the finding lists both. */
  function mapFindings() {
    const rows = allRows();
    const missing = missingFromChecks();
    for (const row of rows) {
      const result = missingMpn(row, missing);
      row._findings = [];
      row._severity = null;
      row._missing = result.state;
      row._missingWhy = result.why;
    }
    const checks = view.checks;
    if (!checks || !checks.findings) return;
    const byName = new Map();
    const upper = new Map();
    const bySheet = new Map();
    for (const row of rows) {
      for (const designator of row.designators || []) {
        byName.set(String(designator), row);
        if (!upper.has(String(designator).toUpperCase())) upper.set(String(designator).toUpperCase(), row);
      }
      for (const logical of Object.values(row.logical_designators || {})) {
        const key = String(logical).toUpperCase();
        if (!bySheet.has(key)) bySheet.set(key, []);
        if (!bySheet.get(key).includes(row)) bySheet.get(key).push(row);
      }
    }
    const physical = (designator) => {
      const row = byName.get(String(designator)) || upper.get(String(designator).toUpperCase());
      if (!row) return null;
      // A part whose sheet designator is another name is not called this on its sheet.
      const own = Object.entries(row.logical_designators || {}).find(([name]) => name.toUpperCase() === String(designator).toUpperCase());
      return own && String(own[1]).toUpperCase() !== String(designator).toUpperCase() ? null : row;
    };
    for (const finding of checks.findings) {
      const lines = [];
      const unmapped = [];
      const maybe = [];
      for (const designator of finding.designators || []) {
        let found = [];
        if (finding.check === "duplicate_designator") {
          const sheet = bySheet.get(String(designator).toUpperCase()) || [];
          const named = physical(designator);
          if (sheet.length && named && !sheet.includes(named)) {
            for (const row of [named, ...sheet]) if (!maybe.includes(row)) maybe.push(row);
            continue;
          }
          found = sheet.length ? sheet : named ? [named] : [];
        } else {
          const row = byName.get(String(designator)) || upper.get(String(designator).toUpperCase());
          found = row ? [row] : [];
        }
        if (!found.length) {
          unmapped.push(designator);
          continue;
        }
        for (const row of found) {
          if (!lines.includes(row)) lines.push(row);
          if (!row._findings.includes(finding)) row._findings.push(finding);
        }
      }
      finding._rows = lines;
      finding._unmapped = unmapped;
      finding._maybe = maybe;
    }
    for (const row of rows) row._severity = worst(row._findings);
  }

  /** The designators a finding lists may stop at check_bom's listing cap. */
  function listedCap(finding) {
    if (finding.check === "not_compiled") return LISTED.not_compiled;
    if (BOM_DOC_CHECKS.has(finding.check) || finding.source === "bom_doc") return LISTED.bom_doc;
    return null;
  }

  function capped(finding) {
    const cap = listedCap(finding);
    return Boolean(cap) && (finding.designators || []).length >= cap;
  }

  // ---------- loading ----------

  function showState(kind, title, detail) {
    clear(app).appendChild(Shell.state(kind, title, detail));
  }

  const ERROR_TITLES = {
    no_project: "No project is loaded",
    netlist_required: "The netlist is not loaded",
    no_components_loaded: "No components were loaded",
    variant_not_found: "get_bom does not know that variant",
  };

  function showError(payload) {
    clear(app).appendChild(Shell.state("error", ERROR_TITLES[payload.error] || "get_bom answered with an error",
      payload.message || payload.error));
    if ((payload.sheet_errors || []).length) {
      app.appendChild(el("details", { class: "more section-gap" }, el("summary", { text: "Sheet errors" }),
        el("ul", { class: "small" }, payload.sheet_errors.map((item) => el("li", { text: typeof item === "object" ? JSON.stringify(item) : String(item) })))));
    }
    if (payload.error === "variant_not_found" && canCall()) {
      // The switch lists the variants get_bom knows.
      ui.controls = el("section", { class: "picker section-gap", "aria-label": "Variant" });
      app.appendChild(ui.controls);
      renderControls();
      if (!view.variants) loadVariants();
    }
  }

  /** What a result says of the call that made it: all of get_bom's arguments but group_by. */
  function inferredArgs(first) {
    return cleanArgs({
      variant: first.variant,
      include_not_fitted: Array.isArray(first.not_fitted),
      compare_variants: Array.isArray(first.variants),
      active_bom: Boolean(first.bom_doc || first.bom_doc_error),
    });
  }

  async function bomPage(args, offset, expect) {
    const page = Shell.resultJson(await call("get_bom", { ...args, offset }));
    if (page && page.error) throw new Error(page.message || page.error);
    if (!page || !Array.isArray(page.lines)) throw new Error("it holds no lines");
    // A page of another BOM (another variant, or the project changed) is not merged.
    if (expect && (page.variant !== expect.variant || page.lines_total !== expect.lines_total)) {
      throw new Error(`it is not a page of this BOM (${page.variant}, ${plural(page.lines_total, "line")})`);
    }
    return page;
  }

  async function loadResult(result) {
    let first;
    try {
      first = Shell.resultJson(result);
    } catch (error) {
      view.busy = false;
      showState("error", "The BOM could not be read", error.message);
      return;
    }
    await loadFrom(first, view.argsKnown ? cleanArgs(view.args) : null);
  }

  /** Read a get_bom result: every page after it with the same arguments (from offset 0
   *  when it is a later page), as JSON when it is CSV. asked: the call's arguments, or null
   *  when the host did not send them (the result names all of them but group_by). */
  async function loadFrom(first, asked) {
    view.busy = true;
    const notes = [];
    try {
      if (!first || typeof first !== "object") throw new Error("The result is not a BOM.");
      if (first.error) {
        view.data = null;
        view.errorPayload = first;
        view.wanted = asked ? asked.variant : null;
        showError(first);
        return;
      }
      view.errorPayload = null;
      let groupKnown = Boolean(asked);
      if (!asked) asked = inferredArgs(first);
      const reasons = [];
      let pageOn = true;  // false: the pages after this one are not read (their grouping is not known)
      if (!Array.isArray(first.lines) && typeof first.csv === "string") {
        if (!canCall() || view.closed) {
          drawCsv(first, asked);
          return;
        }
        // Without the call's arguments the grouping of the CSV is not known: the JSON is
        // asked with get_bom's default grouping, and labelled so.
        const json = groupKnown ? asked : { ...asked, group_by: "mpn" };
        showState("loading", "Reading the BOM", "The result is CSV text: asking get_bom again for JSON.");
        try {
          first = await bomPage(json, 0, null);
        } catch (error) {
          drawCsv(first, asked, `get_bom could not be asked again for JSON: ${error.message}`);
          return;
        }
        notes.push(groupKnown
          ? "The call asked for CSV (format csv): the view asked get_bom again with the same arguments for JSON."
          : "The call asked for CSV (format csv) and the host did not send its arguments: the view asked get_bom again for JSON with group_by mpn (the tool's default; the CSV may have been grouped by Comment) and the arguments the result names.");
        asked = json;
        groupKnown = true;
      }
      if (!groupKnown && (first.offset > 0 || first.has_more) && canCall() && !view.closed) {
        // get_bom's lines do not say how they were grouped: pages asked with another
        // group_by would not fit together, so all of them are read with the tool's default.
        const json = { ...asked, group_by: "mpn" };
        showState("loading", "Reading the BOM", "The host did not send the call's arguments: asking get_bom from offset 0 with group_by mpn.");
        try {
          first = await bomPage(json, 0, null);
          asked = json;
          groupKnown = true;
          notes.push("The host did not send the call's arguments: the view read get_bom again from offset 0 with group_by mpn (the tool's default) and the arguments the result names.");
        } catch (error) {
          // The other pages could be grouped otherwise than this one: only it is shown.
          reasons.push(`get_bom could not be read again from offset 0 with a known grouping (the host did not send the call's arguments), so only this page is shown: ${error.message}`);
          pageOn = false;
        }
      } else if (first.offset > 0 && canCall() && !view.closed) {
        // A later page: the earlier lines come with the first page, which the view asks for
        // when it can (get_bom repeats its header on every page).
        showState("loading", "Reading the BOM", "Asking get_bom for its first page.");
        try {
          const later = first.offset;
          first = await bomPage(asked, 0, first);
          notes.push(`The result was a later page of get_bom (offset ${later}): the view read it again from offset 0.`);
        } catch (error) {
          reasons.push(`its first page could not be read: ${error.message}`);
        }
      }
      if (first.offset > 0) reasons.unshift(`this result starts at offset ${first.offset}, so its first ${plural(first.offset, "line")} are not in it`);
      const lines = [...first.lines];
      const { pages, stopped } = await Shell.readPages({
        // The first page counts: a stop says "at most 60 pages" after 60 pages read.
        first, tool: "get_bom", budget: Shell.pageBudget(MAX_PAGES, 1), closed: () => view.closed,
        pageOffset: (page) => (pageOn && page.has_more && page.next_offset !== undefined ? page.next_offset : null),
        getPage: (offset) => bomPage(asked, offset, first),
        onPage: (page) => { lines.push(...page.lines); },
        progress: (page, offset) => showState("loading", "Reading the BOM", `get_bom pages its lines: page ${page} (offset ${offset}).`),
      });
      // A page the closed view stopped waiting for: the reason is the closing.
      if (stopped) reasons.push(view.closed ? "the view was closed" : stopped);
      const previous = view.data;
      const rows = makeRows(lines, true, first.offset || 0);
      view.data = {
        ...first, lines: undefined, csv: undefined, asked, groupKnown, notes, pages, rows,
        incomplete: reasons.length > 0, stopReason: reasons.join("; ").replace(/[.\s]+$/, ""),
      };
      view.warnings = checkContract(CONTRACT.shapes, { ...first, lines });
      // The same lines as before (asked again for the BomDoc columns, say): the selected
      // line, its details and the designators shown stay.
      const before = previous ? new Map(previous.rows.map((row) => [row._key, (row.designators || []).join("\u0001")])) : null;
      const sameLines = Boolean(before) && previous.variant === first.variant && before.size === rows.length &&
        rows.every((row) => before.get(row._key) === (row.designators || []).join("\u0001"));
      // Answers kept for another variant are dropped: check_bom's findings, the Not Fitted
      // lines (also grouped as asked) and a line's BomDoc solutions.
      if (view.checks && view.checks.variant !== first.variant) view.checks = null;
      if (Array.isArray(first.not_fitted)) {
        view.notFitted = { rows: makeRows(first.not_fitted, false, 0), from: "result" };
      } else if (!previous || previous.variant !== first.variant || previous.asked.group_by !== asked.group_by ||
                 !view.notFitted || !view.notFitted.rows) {
        view.notFitted = null;
      }
      if (Array.isArray(first.variants)) view.compare = { variants: first.variants, from: "result" };
      // A call that asked for the Not Fitted parts shows them from the start.
      if (!previous && asked.include_not_fitted) view.kinds.add("not_fitted");
      const kept = sameLines && view.selected && (view.selected.kind === "finding" ||
        allRows().some((row) => row._key === view.selected.id)) ? view.selected : null;
      if (!kept) {
        view.selected = null;
        view.asked = [];
        view.componentPick = null;
      }
      if (!sameLines) {
        view.expanded = new Set();
        view.solutions = new Map();
      }
      view.pick = first.variant;
      mapFindings();
      renderAll();
      if (canCall() && !view.closed) {
        loadChecks();
        if (view.kinds.has("not_fitted")) loadNotFitted();
        if (!view.variants) loadVariants();
      }
    } catch (error) {
      showState("error", "The BOM could not be read", error.message);
    } finally {
      view.busy = false;
    }
  }

  /** Ask get_bom again with other arguments (the variant switch, group_by, the BomDoc
   *  columns); the table already drawn stays when the call fails. Never switches the
   *  active variant. */
  async function reask(change, what) {
    if (view.closed) renderControls();  // says the view was closed, without its buttons
    if (view.busy || !canCall() || view.closed) return;
    const base = view.data ? { ...view.data.asked, variant: view.data.variant } : cleanArgs(view.args);
    const args = cleanArgs({ ...base, ...change });
    const mark = Shell.focusMark(app);
    view.busy = true;
    showState("loading", "Reading the BOM", `Asking get_bom for ${what}.`);
    try {
      const first = Shell.resultJson(await call("get_bom", { ...args, offset: 0 }));
      if (first && first.error && !view.data) {
        view.busy = false;
        view.errorPayload = first;
        view.wanted = args.variant || null;
        showError(first);
        app.prepend(Shell.notice("error", `Asking get_bom for ${what} failed: ${first.message || first.error}`));
      } else {
        if (first && first.error) throw new Error(first.message || first.error);
        await loadFrom(first, args);
      }
    } catch (error) {
      view.busy = false;
      if (view.data) {
        renderAll();
      } else if (view.errorPayload) {
        showError(view.errorPayload);
      } else {
        showState("error", "The BOM could not be read", error.message);
      }
      app.prepend(view.closed ? Shell.notice("info", `The view was closed before get_bom answered for ${what}.`)
        : Shell.notice("error", `Asking get_bom for ${what} failed: ${error.message}`));
    }
    // The button used may be gone (Add BomDoc columns): focus goes to the selected line,
    // else to Show.
    if (mark) Shell.refocus(app, mark, focusAfterAsk);
  }

  function focusAfterAsk() {
    const row = selectedRow();
    if (row && ui.table && view.tab === "lines" && ui.table.focus((other) => other._key === row._key)) return document.activeElement;
    return ui.showButton && !ui.showButton.disabled ? ui.showButton : ui.tabBar && ui.tabBar.selected();
  }

  // ---------- check_bom ----------

  async function checkPage(variant, offset, first) {
    const page = Shell.resultJson(await call("check_bom", { variant, offset }));
    if (page && page.error) throw new Error(page.message || page.error);
    if (!page || !Array.isArray(page.findings)) throw new Error("it holds no findings");
    if (page.variant !== first.variant || page.total !== first.total) {
      throw new Error(`it is not a page of these findings (${page.variant}, ${plural(page.total, "finding")})`);
    }
    return page;
  }

  /** check_bom for the variant shown, every page: its findings mapped to the lines. A
   *  failure is shown with Retry, never kept as the answer; findings asked for another
   *  variant than the one shown now are dropped. */
  async function loadChecks(force = false) {
    if (!view.data || view.closed || !canCall()) return;
    const variant = view.data.variant;
    if (!force && view.checks && view.checks.variant === variant && !view.checks.error) return;
    const state = { variant, loading: true, findings: null, error: "", stopped: "", pages: 0, header: null, warnings: [] };
    view.checks = state;
    refreshChecks();
    try {
      const first = Shell.resultJson(await call("check_bom", { variant, offset: 0 }));
      if (first && first.error) throw new Error(first.message || first.error);
      if (!first || !Array.isArray(first.findings)) throw new Error("check_bom's answer holds no findings");
      const findings = [...first.findings];
      const { pages, stopped } = await Shell.readPages({
        first, tool: "check_bom", budget: Shell.pageBudget(MAX_PAGES, 1), closed: () => view.closed,
        pageOffset: (page) => (page.has_more && page.next_offset !== undefined ? page.next_offset : null),
        getPage: (offset) => checkPage(variant, offset, first),
        onPage: (page) => { findings.push(...page.findings); },
      });
      if (view.checks !== state) return;  // another variant was asked meanwhile
      findings.forEach((finding, index) => { finding._id = index; });
      Object.assign(state, { loading: false, findings, header: first, pages, stopped,
                             warnings: checkContract(CONTRACT.check_bom, { ...first, findings }) });
    } catch (error) {
      if (view.checks !== state) return;
      Object.assign(state, { loading: false, error: error.message, closed: view.closed });
    }
    mapFindings();
    refreshChecks();
  }

  /** Where check_bom's findings stand: "ready", "loading" (a call on its way), "failed"
   *  (Retry), "closed" (the view was closed before they came) or "none" (no tool calls). */
  function checksState() {
    const checks = view.checks;
    if (checks && checks.findings) return "ready";
    if (checks && checks.error && !checks.closed) return "failed";
    if (view.closed) return "closed";
    if (!canCall()) return "none";
    return "loading";
  }

  const CHECKS_UNKNOWN = {
    loading: "check_bom has not answered yet",
    failed: "check_bom's findings could not be read",
    closed: "Not known: the view was closed before check_bom answered",
    none: "Not known: this host does not let the view ask check_bom",
  };
  const CHECKS_MARK = { loading: "…", failed: "!", closed: "?", none: "?" };

  /** Redraw what check_bom's answer changes, keeping keyboard focus where it is. */
  function refreshChecks() {
    if (!view.data || !ui.content) return;
    updateTabs();
    updateHeadBadges();
    updateFilters();
    // Whether to offer the BomDoc columns (redrawn only then: a redraw closes an open list).
    if (hasBomDoc() !== ui.controlsBomDoc) renderControls();
    if (view.tab === "lines" && ui.table) {
      if (view.groupBy === "finding") ui.table.setGroup(groupSpec());
      else ui.table.setRows(rowsShown());
    } else if (view.tab === "findings" || view.tab === "notes") {
      Shell.keepFocus(ui.content, renderTab, () => ui.tabBar && ui.tabBar.selected());
    }
    renderPane();
  }

  /** Whether the project has an ActiveBOM document, as get_bom (asked with active_bom) or
   *  check_bom said: true, false, "unreadable" (its bom_doc_error), or null (not known). */
  function hasBomDoc() {
    for (const header of [view.data, view.checks && view.checks.header]) {
      if (!header) continue;
      if (header.bom_doc) return true;
      if (header.bom_doc_error) return header.bom_doc_error.error === "no_bom_doc" ? false : "unreadable";
    }
    // check_bom names the BomDoc whenever the project has one (and says when it cannot
    // read it): without either, there is none.
    return view.checks && view.checks.header ? false : null;
  }

  function bomDocError() {
    const error = (view.data && view.data.bom_doc_error) || (view.checks && view.checks.header && view.checks.header.bom_doc_error);
    return error ? error.message || error.error : "";
  }

  // ---------- Not Fitted lines and the variant comparison ----------

  /** get_bom lists the Not Fitted parts as lines on every page with include_not_fitted:
   *  one call (offset 0) with the shown BOM's arguments gives all of them. */
  async function loadNotFitted(force = false) {
    const data = view.data;
    if (!data || !data.parts || !data.parts.not_fitted) return;
    if (!force && view.notFitted && (view.notFitted.rows || view.notFitted.loading)) return;
    if (!canCall() || view.closed) {
      refreshNotFitted();
      return;
    }
    // Grouped as the fitted lines are; when the host did not say how, with get_bom's
    // default (MPN), and labelled so.
    const args = cleanArgs({ ...data.asked, variant: data.variant, include_not_fitted: true,
                             group_by: data.groupKnown ? data.asked.group_by : "mpn" });
    const state = { loading: true, rows: null, error: "", args };
    view.notFitted = state;
    refreshNotFitted();
    try {
      const page = Shell.resultJson(await call("get_bom", { ...args, offset: 0 }));
      if (page && page.error) throw new Error(page.message || page.error);
      if (!page || page.variant !== data.variant || page.lines_total !== data.lines_total) {
        throw new Error("its answer is not this BOM's (another variant, or the project changed)");
      }
      if (!Array.isArray(page.not_fitted)) throw new Error("get_bom listed no Not Fitted line");
      if (view.notFitted !== state || view.data !== data) return;
      Object.assign(state, { loading: false, rows: makeRows(page.not_fitted, false, 0) });
    } catch (error) {
      if (view.notFitted !== state) return;
      Object.assign(state, { loading: false, error: error.message, closed: view.closed });
    }
    mapFindings();
    refreshNotFitted();
  }

  function refreshNotFitted() {
    if (!view.data || !ui.content) return;
    updateFilters();
    updateChips();
    if (view.tab === "lines" && ui.table) {
      if (view.groupBy === "none") ui.table.setRows(rowsShown());
      else ui.table.setGroup(groupSpec());
    }
    if (ui.nfStatus) ui.nfStatus.textContent = notFittedStatus();
  }

  function notFittedStatus() {
    const state = view.notFitted;
    if (!view.kinds.has("not_fitted")) return "";
    if (!state || state.loading || state.closed) {
      if (view.closed) return "The view was closed: the Not Fitted lines were not read.";
      if (!canCall()) return "This host does not let the view ask get_bom for the Not Fitted lines.";
      return state ? "Asking get_bom for the Not Fitted lines…" : "";
    }
    if (state.error) return `The Not Fitted lines could not be read: ${state.error}`;
    if (state.from !== "result" && !view.data.groupKnown) return "The Not Fitted lines are grouped by MPN (get_bom's default): the host did not say how the BOM's lines were grouped.";
    return "";
  }

  /** What each variant changes in the BOM: get_bom with compare_variants, its first page
   *  (the list comes whole on every page and does not depend on the variant shown). */
  async function loadCompare() {
    if (!view.data || view.closed || !canCall()) return;
    if (view.compare && (view.compare.variants || view.compare.loading)) return;
    const args = cleanArgs({ ...view.data.asked, variant: view.data.variant, compare_variants: true });
    const state = { loading: true, variants: null, error: "" };
    view.compare = state;
    renderVariantsTab();
    try {
      const page = Shell.resultJson(await call("get_bom", { ...args, offset: 0 }));
      if (page && page.error) throw new Error(page.message || page.error);
      if (!page || !Array.isArray(page.variants)) throw new Error("get_bom's answer has no variant comparison");
      Object.assign(state, { loading: false, variants: page.variants });
      view.warnings = [...view.warnings, ...checkContract({ "variants[]": CONTRACT.shapes["variants[]"],
        "variants[].changed[]": CONTRACT.shapes["variants[].changed[]"] }, page)];
    } catch (error) {
      if (view.compare !== state) return;
      Object.assign(state, { loading: false, error: error.message, closed: view.closed });
    }
    renderVariantsTab();
  }

  function renderVariantsTab() {
    updateTabs();
    if (view.tab === "variants" && ui.content) Shell.keepFocus(ui.content, renderTab, () => ui.tabBar && ui.tabBar.selected());
  }

  // ---------- list_variants ----------

  /** list_variants for the switch and the active variant's name (read-only). Resolves
   *  when it answered; a call already on its way is shared, not repeated. */
  function loadVariants() {
    if (!canCall() || view.closed) return Promise.resolve();
    if (view.variantsLoading) return view.variantsLoading;
    view.variantsLoading = fetchVariants(variantsSignature());
    if (!view.variants) renderControls();
    return view.variantsLoading;
  }

  async function fetchVariants(before) {
    try {
      const listing = Shell.resultJson(await call("list_variants", {}));
      if (listing && listing.error) throw new Error(listing.message || listing.error);
      view.variants = Array.isArray(listing.variants) ? listing.variants : [];
      view.active = listing.active_variant || (view.variants.find((variant) => variant.is_active) || {}).name || null;
      view.variantsError = "";
      view.listWarnings = checkContract(CONTRACT.list_variants, listing);
    } catch (error) {
      view.variantsError = error.message;
    } finally {
      view.variantsLoading = null;
    }
    if (variantsSignature() === before) return;
    renderControls();
    renderPane();
    updateHeadBadges();
  }

  function variantsSignature() {
    return JSON.stringify([view.variants, view.active, view.variantsError]);
  }

  // ---------- the variant switch, grouping, BomDoc columns and boards ----------

  /** The names the switch offers: the project's variants, then the base design. */
  function pickNames() {
    const names = (view.variants || []).map((variant) => variant.name);
    const shown = view.data ? view.data.variant : null;
    for (const name of [shown, view.pick]) {
      if (name && !isBase(name) && !names.some((other) => sameVariant(other, name))) names.push(name);
    }
    return [...names, BASE];
  }

  function optionLabel(name) {
    if (isBase(name)) return `${BASE} (base design)`;
    return sameVariant(name, view.active) ? `${name} (active)` : name;
  }

  function variantSelect() {
    const select = el("select", { class: "pick", id: "pick-variant", "aria-label": "Variant to show" });
    const names = pickNames();
    for (const name of names) select.appendChild(el("option", { value: name, text: optionLabel(name) }));
    const known = (wanted) => (wanted && trimmed(wanted) ? names.find((name) => sameVariant(name, wanted)) ||
      (baseAlias(wanted) ? BASE : null) : null);
    const current = known(view.pick) || known(view.wanted) || known(view.active) || names[0];
    select.value = current;
    view.pick = current;
    select.addEventListener("change", () => {
      view.pick = select.value;
      syncShowButton();
    });
    return select;
  }

  /** The Show button's state says whether the picked variant is the one shown (its text and
   *  title stay the same, so keyboard focus finds it again after the page is redrawn). */
  function syncShowButton() {
    if (!ui.showButton) return;
    const shown = view.data && sameVariant(view.pick, view.data.variant);
    ui.showButton.disabled = !canCall();
    ui.showButton.setAttribute("aria-describedby", "pick-state");
    if (ui.pickState) ui.pickState.textContent = shown ? "(shown)" : "";
  }

  function renderControls() {
    if (!ui.controls) return;
    Shell.keepFocus(ui.controls, drawControls, () => ui.showButton);
  }

  function drawControls() {
    clear(ui.controls);
    ui.showButton = null;
    ui.pickState = null;
    ui.controlsBomDoc = hasBomDoc();
    if (view.closed) {
      Shell.append(ui.controls, [el("p", { class: "help", text: "The view was closed: it asks the server nothing more." })]);
      return;
    }
    if (!canCall()) {
      Shell.append(ui.controls, [el("p", { class: "help", text: "This host does not let the view call tools: ask Claude for another variant's BOM (get_bom with variant), another grouping (group_by) or the Not Fitted parts (include_not_fitted)." })]);
      return;
    }
    const body = [];
    if (view.variantsLoading && !view.variants) body.push(el("p", { class: "muted", text: "Asking list_variants for the project's variants…" }));
    if (view.variantsError) {
      body.push(el("div", { class: "notice warning" }, el("span", { class: "grow", text: `list_variants failed: ${view.variantsError}` }),
        el("button", { type: "button", class: "btn-link", text: "Retry", on: { click: () => loadVariants() } })));
    }
    if (view.variants || view.pick || view.data) {
      ui.showButton = el("button", { type: "button", class: "btn", text: "Show",
                                     title: "Ask get_bom and check_bom for the variant picked",
                                     on: { click: () => reask({ variant: view.pick }, `variant ${view.pick}`) } });
      ui.pickState = el("span", { class: "muted small", id: "pick-state" });
      body.push(el("div", { class: "picker-row" },
        el("label", {}, el("span", { class: "side", text: "Variant" }), variantSelect()), ui.showButton, ui.pickState));
      syncShowButton();
    }
    if (view.data) {
      const asked = view.data.asked;
      const current = view.data.groupKnown ? asked.group_by || "mpn" : null;
      const groupSwitch = Shell.segmented({
        label: "Lines grouped by (get_bom)", current,
        items: [{ id: "mpn", label: "MPN", title: "get_bom group_by mpn: by manufacturer part number, else Comment and footprint" },
                { id: "comment", label: "Comment", title: "get_bom group_by comment: by Comment and footprint" }],
        onChange: (id) => reask({ group_by: id }, `lines grouped by ${id === "mpn" ? "MPN" : "Comment"}`),
      });
      const row = el("div", { class: "picker-row" }, groupSwitch.el);
      const bomDoc = hasBomDoc();
      if (asked.active_bom) {
        row.appendChild(el("span", { class: "muted small", text: "BomDoc columns: shown (asked with active_bom)" }));
      } else if (bomDoc === true) {
        row.appendChild(el("button", { type: "button", class: "btn", text: "Add BomDoc columns",
          title: "Ask get_bom with active_bom for each line's ActiveBOM line numbers and chosen part",
          on: { click: () => reask({ active_bom: true }, "the BomDoc columns") } }));
      }
      body.push(row);
    }
    body.push(el("p", { class: "help", text: `${READ_ONLY_NOTE} ${activeText()}` }));
    Shell.append(ui.controls, body);
  }

  /** What the server's active variant is, as list_variants last said. */
  function activeText() {
    if (!view.active) return "get_component shows the server's active variant.";
    const shown = view.data && !sameVariant(view.active, view.data.variant) ? ` (not ${view.data.variant}, the variant shown)` : "";
    return `get_component shows the active variant, ${view.active}${shown}.`;
  }

  const MAX_BOARDS = 1e9;

  /** The number of boards typed: a whole number from 1 to 10^9, else null. */
  function boardsValue(input) {
    const text = String(input.value).trim();
    if (!/^\d+$/.test(text) || (input.validity && input.validity.badInput)) return null;
    const number = Number(text);
    return number >= 1 && number <= MAX_BOARDS ? number : null;
  }

  /** The boards field: a value that is not a whole number of boards is marked invalid and
   *  said so (the quantities keep the last valid number), and is put back to that number
   *  when the field is left, so the field shows the number the view uses. */
  function boardsInput() {
    const input = el("input", { type: "number", class: "boards", min: "1", max: String(MAX_BOARDS), step: "1", inputmode: "numeric",
                                value: String(view.boards), "aria-label": "Number of boards (a local calculation)",
                                "aria-describedby": "boards-note boards-error" });
    ui.boardsError = el("span", { class: "local invalid", id: "boards-error", role: "status", hidden: true });
    const mark = (valid) => {
      input.setAttribute("aria-invalid", valid ? "false" : "true");
      ui.boardsError.hidden = valid;
      ui.boardsError.textContent = valid ? "" : `Not a whole number of boards from 1 to ${MAX_BOARDS}: the quantities use ${view.boards}.`;
    };
    const apply = (next) => {
      if (next === view.boards) return;
      const crossed = (next > 1) !== (view.boards > 1);
      view.boards = next;
      updateHeadBadges();
      if (view.tab === "lines" && ui.table) {
        if (crossed) Shell.keepFocus(ui.content, renderTab);
        else ui.table.setRows(rowsShown());
      }
      renderPane();
    };
    let timer = null;
    input.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        const next = boardsValue(input);
        if (next !== null) apply(next);
        mark(next !== null);
      }, 200);
    });
    input.addEventListener("change", () => {
      clearTimeout(timer);
      const next = boardsValue(input);
      if (next !== null) apply(next);
      else input.value = String(view.boards);
      mark(true);
    });
    return input;
  }

  // ---------- the lines table ----------

  function rowsShown() {
    return allRows();
  }

  function fieldValues(row, field) {
    const varies = row.varies && Array.isArray(row.varies[field]) ? row.varies[field] : null;
    if (varies) return varies.map((value) => (value === null || value === undefined || value === "" ? NONE : String(value)));
    return [row[field] ? String(row[field]) : NONE];
  }

  function groupSpec() {
    const by = view.groupBy;
    if (by === "none") return null;
    const total = rowsShown().length;
    if (by === "finding") {
      const checks = view.checks;
      const ready = Boolean(checks && checks.findings);
      // check_bom's order: errors first, then by check (the order of its findings).
      const first = new Map();
      if (ready) checks.findings.forEach((finding) => { if (!first.has(finding.check)) first.set(finding.check, first.size); });
      return {
        key: (row) => (!ready ? NOT_KNOWN : row._findings.length ? [...new Set(row._findings.map((finding) => finding.check))] : NO_FINDING),
        label: (key) => (key === NOT_KNOWN ? `Findings not known (${CHECKS_UNKNOWN[checksState()] || "check_bom has not answered"})`
          : key === NO_FINDING ? "No check_bom finding" : checkLabel(key)),
        count: (key, rows) => {
          const parts = rows.reduce((sum, row) => sum + (row.designators || []).length, 0);
          const severities = key.startsWith("\u0001") ? [] : [...new Set(checks.findings.filter((finding) => finding.check === key).map((finding) => finding.severity))];
          return [...severities.map((severity) => Shell.levelBadge(severity)), el("span", { class: "badge", text: plural(rows.length, "line") }),
            el("span", { class: "badge muted", text: plural(parts, "part") })];
        },
        order: (x, y) => (first.has(x) ? first.get(x) : 1e6 + Number(x === NO_FINDING)) - (first.has(y) ? first.get(y) : 1e6 + Number(y === NO_FINDING)),
        open: (key, rows, groups) => groups === 1 || total <= 200,
      };
    }
    const noun = FIELD_LABEL[by].toLowerCase();
    return {
      key: (row) => fieldValues(row, by),
      label: (key) => (key === NONE ? `(no ${noun})` : key),
      count: (key, rows) => {
        const parts = rows.reduce((sum, row) => sum + (row.designators || []).length, 0);
        return [el("span", { class: "badge", text: plural(rows.length, "line") }), el("span", { class: "badge muted", text: plural(parts, "part") })];
      },
      order: (x, y) => (Number(x === NONE) - Number(y === NONE)) || naturalOrder(x, y),
      open: (key, rows, groups) => groups === 1 || total <= 200,
    };
  }

  function rowFilter(row) {
    if (!view.kinds.has(row._fitted ? "fitted" : "not_fitted")) return false;
    if (view.show === "missing") return Boolean(row._missing);
    if (view.show === "findings") return row._findings.length > 0;
    return true;
  }

  function filtered() {
    return !view.kinds.has("fitted") || view.show !== "all";
  }

  function designatorCell(row) {
    const tokens = ranges(row.designators);
    const open = view.expanded.has(row._key);
    const shown = open ? tokens : tokens.slice(0, 6);
    const hidden = tokens.slice(shown.length).reduce((sum, token) => sum + token.count, 0);
    const box = el("span", { class: "desig" }, shown.map((token) => token.text).join(", "));
    if (hidden || open && tokens.length > 6) {
      box.appendChild(el("button", { type: "button", class: "btn-link",
        text: open ? "fewer" : `+${hidden} more`, "aria-expanded": open ? "true" : "false",
        title: open ? "Show the first designators only" : `Show all ${plural(row.designators.length, "designator")}`,
        on: { click: (event) => toggleDesignators(row, event.currentTarget) } }));
    }
    return box;
  }

  /** Show all of a line's designators or the first ones. The rows are drawn again in the
   *  same order (the designators do not change what is shown or how it is sorted), so
   *  keyboard focus goes to the same toggle in the row at the same place. */
  function toggleDesignators(row, button) {
    const tr = button && button.closest("tr");
    const at = tr && tr.parentElement ? [...tr.parentElement.children].indexOf(tr) : -1;
    if (view.expanded.has(row._key)) view.expanded.delete(row._key);
    else view.expanded.add(row._key);
    if (!ui.table) return;
    ui.table.setRows(rowsShown());
    const body = ui.table.el.querySelector("tbody");
    const again = at >= 0 && body ? body.children[at] : null;
    const toggle = again && again.querySelector(".desig button");
    if (toggle) toggle.focus();
    else ui.table.focus((other) => other._key === row._key);
  }

  function fieldText(field) {
    return (row) => (row[field] ? String(row[field]) : "");
  }

  function fieldCell(field) {
    return (row) => {
      const varies = row.varies && row.varies[field];
      const text = row[field] ? String(row[field]) : "";
      return [text ? el("span", { class: "val", text }) : el("span", { class: "val unset", text: "—" }),
        varies ? el("span", { class: "badge info mark", text: "varies", title: `The line's parts have ${plural(variesCount(row, field), "value")} here` }) : null];
    };
  }

  function variesCount(row, field) {
    const counted = row.varies_count && row.varies_count[field];
    return counted || (row.varies && row.varies[field] ? row.varies[field].length : 0);
  }

  function mpnText(row) {
    if (row.mpn) return String(row.mpn);
    return row.mpn_placeholder ? String(row.mpn_placeholder) : "";
  }

  function placeholderSaysNone(row) {
    return placeholderMarks(row).every((text) => !UNDECIDED.has(text));
  }

  /** What a line's placeholder says: none needed, still needs one, or (get_bom lists the
   *  distinct placeholders, not each part's) none needed for the parts that have it. */
  function placeholderText(row) {
    if (!placeholderSaysNone(row)) return "still needs one";
    return row._missing === "may" ? "none needed for the parts that have it" : "none needed";
  }

  function mpnCell(row) {
    if (row.mpn) {
      return [el("span", { class: "val", text: row.mpn }),
        row.varies && row.varies.mpn ? el("span", { class: "badge info mark", text: "varies" }) : null];
    }
    if (row.mpn_placeholder) {
      return [el("span", { class: "val unset", text: row.mpn_placeholder }),
        el("span", { class: "sub", text: `placeholder: ${placeholderText(row)}` })];
    }
    return el("span", { class: "val unset", text: "—" });
  }

  function bomDocText(row) {
    const numbers = (row.bom_doc_lines || []).map((number) => (number === null ? "unnumbered" : String(number)));
    const chosen = (row.bom_doc_chosen || []).map((entry) => entry.mpn).filter(Boolean);
    return `${numbers.join(", ")} ${chosen.join(" / ")}`.trim();
  }

  function bomDocCell(row) {
    if (!row._fitted) return el("span", { class: "muted", text: "" });
    const numbers = (row.bom_doc_lines || []).map((number) => (number === null ? "unnumbered" : String(number)));
    if (!numbers.length) return el("span", { class: "muted", text: row.bom_doc_lines ? "no line" : "" });
    const chosen = (row.bom_doc_chosen || []).map((entry) => entry.mpn).filter(Boolean);
    return [el("span", { text: `Line ${numbers.join(", ")}` }), chosen.length ? el("span", { class: "sub", text: chosen.join(" / ") }) : null];
  }

  function findingsValue(row) {
    if (!view.checks || !view.checks.findings) return null;
    return row._severity === null ? 3 : SEVERITY_RANK[row._severity] ?? 3;
  }

  function findingsCell(row) {
    const state = checksState();
    if (state !== "ready") return el("span", { class: "muted", text: CHECKS_MARK[state], title: CHECKS_UNKNOWN[state] });
    if (!row._findings.length) return el("span", { class: "muted", text: "" });
    const counts = {};
    for (const finding of row._findings) counts[finding.severity] = (counts[finding.severity] || 0) + 1;
    return el("span", { class: "marks" }, Object.keys(SEVERITY_RANK).filter((severity) => counts[severity])
      .map((severity) => Shell.levelBadge(severity, severityText(severity, counts[severity]))));
  }

  function marksOf(row) {
    const marks = [];
    if (!row._fitted) marks.push(["error", "Not Fitted"]);
    if (row._missing === "yes") marks.push(["warning", "no MPN"]);
    else if (row._missing === "may") marks.push(["muted", "MPN may be missing"]);
    if (row.varies) marks.push(["info", `varies: ${Object.keys(row.varies).map((key) => FIELD_LABEL[key] || key).join(", ")}`]);
    const alternates = Object.keys(row.alternate_parts || {}).length;
    if (alternates) marks.push(["info", plural(alternates, "alternate part")]);
    if ((row.varied_parameters || []).length) marks.push(["muted", `varied: ${row.varied_parameters.join(", ")}`]);
    return marks;
  }

  function marksCell(row) {
    return el("span", { class: "marks" }, marksOf(row).map(([kind, text]) => el("span", { class: `badge ${kind}`, text })));
  }

  function linesEmpty() {
    const data = view.data;
    if (view.data.incomplete && !fittedRows().length) return "No line read: the notice above says why.";
    if (!data.lines_total) return `${data.variant} has no BOM line.`;
    return "No line to show.";
  }

  function linesTable() {
    const rows = rowsShown();
    const withBomDoc = rows.some((row) => Array.isArray(row.bom_doc_lines));
    // Value is shown when half the lines or more have one (the column chooser has it).
    const withValue = rows.filter((row) => row.value).length * 2 >= rows.length && rows.length > 0;
    return Shell.table({
      label: "BOM lines", ownFilter: false, rows, group: groupSpec(), filter: rowFilter,
      rowKey: (row) => row._key, onActivate: selectLine, empty: linesEmpty(),
      columns: [
        { key: "quantity", label: "Qty", numeric: true, value: (row) => Number(row.quantity) || 0 },
        // The boards' quantity, a local calculation (the label stays: the head says how many).
        { key: "boards", label: "Qty × boards", numeric: true, hidden: view.boards <= 1,
          value: (row) => (row._fitted ? (Number(row.quantity) || 0) * view.boards : 0),
          render: (row) => (row._fitted ? String((Number(row.quantity) || 0) * view.boards) : el("span", { class: "muted", text: "0" })) },
        // Sorted in get_bom's order (natural by the first designator), filtered by all of them.
        { key: "designators", label: "Designators", cls: "c-name", value: (row) => row._rank,
          text: (row) => [...(row.designators || []), ...Object.values(row.logical_designators || {})].join(" "),
          render: designatorCell },
        { key: "comment", label: "Comment", cls: "c-part", value: fieldText("comment"), render: fieldCell("comment") },
        { key: "value", label: "Value", cls: "c-val", hidden: !withValue, value: fieldText("value"), render: fieldCell("value") },
        { key: "description", label: "Description", cls: "c-msg", hidden: true, value: fieldText("description"), render: fieldCell("description") },
        { key: "footprint", label: "Footprint", cls: "c-part", value: fieldText("footprint"), render: fieldCell("footprint") },
        { key: "manufacturer", label: "Manufacturer", cls: "c-name", value: fieldText("manufacturer"), render: fieldCell("manufacturer") },
        { key: "mpn", label: "MPN", cls: "c-part", value: mpnText, render: mpnCell },
        { key: "bom_doc", label: "BomDoc", cls: "c-name", hidden: !withBomDoc, value: bomDocText, render: bomDocCell },
        { key: "findings", label: "Findings", value: findingsValue,
          text: (row) => row._findings.map((finding) => checkLabel(finding.check)).join(" "), render: findingsCell },
        { key: "marks", label: "Marks", value: (row) => marksOf(row).map(([, text]) => text).join(" "), render: marksCell },
      ],
    });
  }

  function regroup(id) {
    view.groupBy = id;
    if (ui.table && view.tab === "lines") ui.table.setGroup(groupSpec());
  }

  // ---------- the findings table ----------

  function findingRows() {
    return (view.checks && view.checks.findings) || [];
  }

  function findingsBlock() {
    const checks = view.checks;
    const block = el("div", {});
    if (!canCall() && !checks) {
      block.appendChild(Shell.state("info", "Findings not known", "This host does not let the view call tools: ask Claude to check the BOM (check_bom)."));
      return block;
    }
    if (checksState() === "closed") {
      block.appendChild(Shell.state("info", "Findings not known", "The view was closed before check_bom answered: it asks the server nothing more."));
      return block;
    }
    if (!checks || checks.loading) {
      block.appendChild(Shell.state("loading", "Checking the BOM", `Asking check_bom for ${view.data.variant}.`));
      return block;
    }
    if (checks.error) {
      block.appendChild(el("div", { class: "notice error" }, el("span", { class: "grow", text: `check_bom failed: ${checks.error}` }),
        view.closed ? null : el("button", { type: "button", class: "btn-link", text: "Retry", on: { click: () => loadChecks(true) } })));
      return block;
    }
    const header = checks.header;
    const counts = header.severity_counts || {};
    block.appendChild(el("p", { class: "approx", text: `check_bom for ${checks.variant}: ${plural(header.total, "finding")} (${["error", "warning", "info"].map((severity) => severityText(severity, counts[severity] || 0)).join(", ")}), errors first. Each finding marks the lines that hold the parts it names.` }));
    if (checks.stopped) {
      block.appendChild(Shell.notice("warning", `Read ${plural(checks.pages, "page")} of check_bom, then stopped: ${checks.stopped}. The table holds ${checks.findings.length} of the ${header.total} findings.`));
    }
    if (header.bom_doc_error) block.appendChild(Shell.notice("warning", `check_bom could not read the BomDoc: ${header.bom_doc_error.message || header.bom_doc_error.error}`));
    const notRun = Object.entries(header.checks_not_run || {});
    if (notRun.length) block.appendChild(Shell.notice("info", `Not run: ${notRun.map(([check, why]) => `${checkLabel(check)} (${why})`).join("; ")}.`));
    if (checks.warnings.length) block.appendChild(Shell.notice("warning", `check_bom is not quite the shape this view reads: ${checks.warnings.slice(0, 3).join("; ")}.`));
    if (!checks.findings.length) {
      block.appendChild(Shell.state("empty", "No findings", `check_bom finds nothing to report in ${checks.variant} (${(header.checks_run || []).length} checks run).`));
      ui.table = null;
      return block;
    }
    const first = new Map();
    checks.findings.forEach((finding) => { if (!first.has(finding.check)) first.set(finding.check, first.size); });
    ui.table = Shell.table({
      label: "check_bom findings", ownFilter: false, rows: checks.findings, rowKey: (finding) => finding._id,
      onActivate: selectFinding,
      group: {
        key: (finding) => finding.check,
        label: (key) => checkLabel(key),
        // check_bom's summary counts each check's findings, read or not.
        count: (key, rows) => {
          const total = (header.summary || {})[key];
          return [...["error", "warning", "info"].filter((severity) => rows.some((finding) => finding.severity === severity))
            .map((severity) => Shell.levelBadge(severity)),
          el("span", { class: "badge", text: total && total > rows.length ? `${rows.length} of ${plural(total, "finding")}` : plural(rows.length, "finding") })];
        },
        order: (x, y) => first.get(x) - first.get(y),
        open: (key, rows, groups) => groups === 1 || checks.findings.length <= 120,
      },
      columns: [
        { key: "severity", label: "Severity", value: (finding) => SEVERITY_RANK[finding.severity] ?? 3, text: (finding) => finding.severity,
          render: (finding) => Shell.levelBadge(finding.severity) },
        { key: "issue", label: "Issue", cls: "c-msg" },
        { key: "designators", label: "Parts", cls: "c-name", value: (finding) => (finding.designators || []).length,
          text: (finding) => (finding.designators || []).join(" "),
          render: (finding) => {
            const tokens = ranges(finding.designators);
            const more = tokens.slice(6).reduce((sum, token) => sum + token.count, 0);
            return el("span", { class: "desig" }, tokens.slice(0, 6).map((token) => token.text).join(", ") || "—",
              more ? el("span", { class: "muted", text: ` +${more}` }) : null);
          } },
        { key: "lines", label: "BOM lines", numeric: true, value: (finding) => (finding._rows || []).length,
          render: (finding) => {
            const count = (finding._rows || []).length;
            const maybe = (finding._maybe || []).length;
            if (!(finding.designators || []).length) return el("span", { class: "muted", text: "whole BOM" });
            if (maybe && !count) return el("span", { class: "muted", text: `one of ${maybe}?`, title: "get_bom's lines give no sheet: the details list the lines it may be" });
            return el("span", { text: `${capped(finding) ? "at least " : ""}${count}${maybe ? ` (+ one of ${maybe}?)` : ""}` });
          } },
        { key: "bom_doc_line", label: "BomDoc line", cls: "c-name", hidden: !checks.findings.some((finding) => "line" in finding || finding.lines),
          value: (finding) => bomDocLines(finding) },
        { key: "check", label: "Check", hidden: true, value: (finding) => checkLabel(finding.check) },
      ],
    });
    ui.table.setQuery(view.query);
    if (view.selected && view.selected.kind === "finding") ui.table.select((finding) => finding._id === view.selected.id);
    block.appendChild(ui.table.el);
    return block;
  }

  function bomDocLines(finding) {
    if ("line" in finding) return finding.line === null ? `unnumbered ${finding.design_item_id || ""}`.trim() : String(finding.line);
    const numbers = [...(finding.lines || []), ...(finding.unnumbered_lines || [])];
    return numbers.join(", ");
  }

  // ---------- selection and details pane ----------

  function selectedRow() {
    if (!view.selected || view.selected.kind !== "line") return null;
    return allRows().find((row) => row._key === view.selected.id) || null;
  }

  function selectedFinding() {
    if (!view.selected || view.selected.kind !== "finding") return null;
    return findingRows().find((finding) => finding._id === view.selected.id) || null;
  }

  function selectLine(row) {
    const fromTable = Boolean(ui.table && ui.table.el.contains(document.activeElement));
    view.selected = row ? { kind: "line", id: row._key } : null;
    view.asked = [];
    view.componentPick = null;
    if (ui.table && view.tab === "lines") ui.table.select((other) => Boolean(row) && other._key === row._key);
    renderPane();
    // The details took the table's place (a short, narrow host): focus goes to them.
    if (row && fromTable && ui.split && ui.split.classList.contains("solo") && ui.closeButton) ui.closeButton.focus();
    if (row) Shell.announce(`Details: ${(row.designators || []).slice(0, 3).join(", ")}`);
  }

  function selectFinding(finding) {
    const fromTable = Boolean(ui.table && ui.table.el.contains(document.activeElement));
    view.selected = finding ? { kind: "finding", id: finding._id } : null;
