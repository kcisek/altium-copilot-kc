    if (ui.table && view.tab === "findings") ui.table.select((other) => Boolean(finding) && other._id === finding._id);
    renderPane();
    if (finding && fromTable && ui.split && ui.split.classList.contains("solo") && ui.closeButton) ui.closeButton.focus();
    if (finding) Shell.announce(`Details: ${checkLabel(finding.check)}`);
  }

  /** From a finding's details to one of its lines in the Lines tab: the filters that would
   *  hide it are cleared, the line selected and focused. */
  function showLine(row) {
    view.show = "all";
    view.query = "";
    view.kinds = new Set([...view.kinds, row._fitted ? "fitted" : "not_fitted"]);
    view.tab = "lines";
    view.selected = { kind: "line", id: row._key };
    view.asked = [];
    view.componentPick = null;
    renderAll();
    if (ui.table) ui.table.focus((other) => other._key === row._key);
    Shell.announce(`Details: ${(row.designators || []).slice(0, 3).join(", ")}`);
  }

  /** Close the details (Close, or Esc): focus goes back to the row that was selected. */
  function closeDetails() {
    const selected = view.selected;
    const inPane = ui.pane && ui.pane.contains(document.activeElement);
    if (view.tab === "findings") selectFinding(null);
    else selectLine(null);
    if (!inPane && document.activeElement && document.activeElement !== document.body) return;
    if (ui.table && selected && ui.table.focus((other) => (selected.kind === "line" ? other._key : other._id) === selected.id)) return;
    if (ui.tabBar) ui.tabBar.focus();
  }

  /** Ask get_component for a part: it answers for the ACTIVE variant. list_variants is
   *  asked first, so the answer is labelled with the active variant it was asked under; a
   *  kept answer asked under another active variant than list_variants names now is
   *  dropped and asked again. */
  async function ask(tool, args, label) {
    if (!READ_ONLY_TOOLS.has(tool)) return;
    if (view.closed || !canCall()) {
      renderPane();
      return;
    }
    const key = JSON.stringify([tool, args]);
    view.asked = [[tool, args, label], ...view.asked.filter(([other, otherArgs]) => JSON.stringify([other, otherArgs]) !== key)];
    renderPane();
    await loadVariants();
    if (view.closed) return;
    const under = view.variantsError ? null : view.active;
    const kept = details.get(tool, args);
    if (kept && kept.data && askedUnder.get(key) !== under) details.forget(tool, args);
    const entry = details.get(tool, args);
    if (!entry || entry.error) askedUnder.set(key, under);
    details.load(tool, args);
  }

  function askAgain(tool, args, label) {
    details.forget(tool, args);
    ask(tool, args, label);
  }

  /** The active variant an answer shows: the one get_component names when the variant
   *  changes the part, else the one list_variants named just before it was asked. */
  function answeredUnder(tool, args, json) {
    if (json && json.variant_changes && json.variant_changes.variant) return json.variant_changes.variant;
    return askedUnder.get(JSON.stringify([tool, args])) || null;
  }

  function parsed(entry) {
    const text = Shell.resultText(entry.data);
    try {
      return { json: JSON.parse(text), text };
    } catch (error) {
      return { json: null, text };
    }
  }

  /** What get_component answered: the part as the ACTIVE variant shows it. */
  function componentAnswer(tool, args, title) {
    const entry = details.get(tool, args);
    const head = el("h3", { text: title });
    if (view.closed && (!entry || entry.loading)) return [head, el("p", { class: "muted", text: "The view was closed: it asks the server nothing more." })];
    if (!entry || entry.loading) return [head, el("p", { class: "muted", text: `Asking ${tool}…` })];
    if (entry.error) {
      return [head, el("div", { class: "notice error" }, el("span", { class: "grow", text: entry.error }),
        el("button", { type: "button", class: "btn-link", text: "Retry", on: { click: () => ask(tool, args, title) } }))];
    }
    const { json, text } = parsed(entry);
    if (!json) return [head, el("pre", { class: "text", text: String(text).slice(0, 4000) })];
    if (json.error) return [head, el("div", { class: "notice warning", text: json.message || json.error })];
    const pins = Object.keys(json.pins || {}).length;
    const under = answeredUnder(tool, args, json);
    // list_variants has named another active variant since: this answer is not its.
    const moved = under && view.active && !view.variantsError && !sameVariant(under, view.active);
    const shown = view.data ? view.data.variant : null;
    return [head,
      el("p", { class: "help small", text: under
        ? `As the active variant when asked, ${under}, shows it${shown && !sameVariant(under, shown) ? ` (not ${shown}, the variant this BOM shows)` : ""}.`
        : "As the active variant when asked shows it (list_variants did not name it; not necessarily the variant this BOM shows)." }),
      moved ? el("div", { class: "notice warning", text: `The active variant is now ${view.active}: Ask again for its values.` }) : null,
      Shell.facts([
        ["Fitted", json.dnp ? "no: Not Fitted in the active variant" : "yes, in the active variant"],
        ["Value", json.value], ["Description", json.description], ["MPN", json.mpn], ["Sheet", json.sheet],
        ["Sheet designator", json.logical_refdes], ["Pins", pins ? String(pins) : null],
        ["Variant changes", json.variant_changes ? Object.keys(json.variant_changes.fields || {}).join(", ") || "parameters or alternate part" : null],
      ]),
      el("div", { class: "btn-row" }, el("button", { type: "button", class: "btn", text: "Ask again",
        title: "The active variant may have changed: ask get_component again",
        on: { click: () => askAgain(tool, args, title) } }))];
  }

  function componentSection(row) {
    ui.componentHead = el("h3", { text: "The part in the active variant", tabindex: "-1" });
    const head = ui.componentHead;
    if (!canCall()) return [head, el("p", { class: "muted", text: "This host does not let the view call tools: ask Claude for the part (get_component)." })];
    if (view.closed) return [head, el("p", { class: "muted", text: "The view was closed: it asks the server nothing more." })];
    const designators = row.designators || [];
    if (!designators.length) return [];
    const designator = designators.includes(view.componentPick) ? view.componentPick : designators[0];
    const shown = view.data.variant;
    const other = view.active && !sameVariant(view.active, shown);
    const label = `get_component ${designator}`;
    const args = { refdes: designator };
    ui.askButton = el("button", { type: "button", class: "btn",
      text: other ? `${label} (active variant: ${view.active}, not ${shown})` : `${label} (active variant)`,
      title: `Ask get_component for ${designator}: the active variant's values`,
      on: { click: () => ask("get_component", args, label) } });
    let picker = null;
    if (designators.length > 1) {
      picker = el("select", { class: "pick", "aria-label": "Designator for get_component" },
        designators.map((name) => el("option", { value: name, text: name })));
      picker.value = designator;
      picker.addEventListener("change", () => {
        view.componentPick = picker.value;
        renderPane();
      });
    }
    return [head,
      el("p", { class: "help", text: `get_component shows the part as the ACTIVE variant${view.active ? `, ${view.active},` : ""} has it${other ? `, not as ${shown} (the variant this BOM shows)` : ""}; the view never switches the active variant.` }),
      el("div", { class: "btn-row" }, picker, ui.askButton),
      ...view.asked.map(([tool, askedArgs, askedLabel]) => componentAnswer(tool, askedArgs, askedLabel))];
  }

  // ---------- a line's BomDoc solutions (get_active_bom) ----------

  function rowSolutions(row) {
    return view.solutions.get(row._key) || null;
  }

  // get_active_bom calls one click of a line's solutions makes at most (then a button
  // asks for the next ones): one per BomDoc line found, or per part on no BomDoc line.
  const WALK_ASKS = 10;
  const upperName = (designator) => String(designator).toUpperCase();

  /** The parts check_bom's bomdoc_out_of_sync names as having no BomDoc line (upper
   *  case; it lists at most 50 of them): get_active_bom would only answer line_not_found. */
  function partsWithoutLine() {
    const checks = view.checks;
    if (!checks || !checks.findings || !view.data || checks.variant !== view.data.variant) return new Set();
    return new Set(checks.findings.filter((finding) => finding.check === "bomdoc_out_of_sync" && finding.reason === "parts_without_line")
      .flatMap((finding) => (finding.designators || []).map(upperName)));
  }

  /** A line's BomDoc lines, asked of get_active_bom one designator at a time (line= with
   *  a designator names the BomDoc line that holds it, numbered or not): the first
   *  designator, then the first one no answer covers yet, until every designator of the
   *  line is covered (its parts may sit on several BomDoc lines, numbered or not), or
   *  WALK_ASKS calls were made ("more" goes on from there), or a call failed or left the
   *  line out (the parts not asked are named). "again" forgets the answers first. */
  async function askSolutions(row, mode = "start") {
    if (view.closed || !canCall()) {
      renderPane();
      return;
    }
    const variant = view.data.variant;
    let state = rowSolutions(row);
    if (mode === "again" && state) for (const args of state.asks) details.forget("get_active_bom", args);
    if (mode !== "more" || !state || state.variant !== variant) {
      state = { variant, asks: [], covered: new Set(), budget: 0, done: false, stopped: false, left: [] };
      view.solutions.set(row._key, state);
    }
    if (state.running) return;
    state.running = true;
    state.done = false;
    state.stopped = false;
    state.budget = state.asks.length + WALK_ASKS;
    const designators = row.designators || [];
    const skip = partsWithoutLine();
    const open = () => designators.filter((designator) => !state.covered.has(upperName(designator)) && !skip.has(upperName(designator)));
    while (state.asks.length < state.budget) {
      const next = open()[0];
      if (next === undefined) break;
      const args = { line: next, variant };
      state.asks.push(args);
      renderPane();
      const entry = await details.load("get_active_bom", args);
      if (view.closed || view.solutions.get(row._key) !== state) return;
      state.covered.add(upperName(next));
      const json = entry && entry.data ? parsed(entry).json : null;
      if (json && json.line) {
        for (const designator of [...(json.line.designators || []), ...(json.line.not_fitted || [])]) state.covered.add(upperName(designator));
      } else if (!json || json.error !== "line_not_found") {
        // A failed call (Retry), no BomDoc, or a line too large for one answer
        // (lines_omitted, which names no part): the walk stops and names the rest.
        state.stopped = true;
        break;
      }
    }
    state.left = open();
    state.running = false;
    state.done = true;
    renderPane();
  }

  function cachedText(date, text) {
    if (date) return `cached ${String(date).replace("T", " ")}, not current`;
    if (text) return `cached: ${text}, not current`;
    return "no cache date: not current";
  }

  /** A cached figure with its cache date, never alone. */
  function cachedValue(value, date, text) {
    if (value === null || value === undefined || value === "") return null;
    return [el("span", { text: String(value) }), " ", el("span", { class: "cached", text: `(${cachedText(date, text)})` })];
  }

  function priceText(value, currency) {
    if (value === null || value === undefined) return null;
    return `${value}${currency ? ` ${currency}` : ""}`;
  }

  function solutionBlock(solution, index) {
    const title = [`Rank ${solution.rank === null || solution.rank === undefined ? "?" : solution.rank}`,
      [solution.manufacturer, solution.mpn].filter(Boolean).join(" ") || "(no part number)"].join(": ");
    const best = solution.best_unit_price !== undefined
      ? `${priceText(solution.best_unit_price, solution.currency)}${solution.best_price_supplier ? ` at ${solution.best_price_supplier}` : ""}${solution.best_price_below_minimum_order ? ` (only from a minimum order of ${solution.minimum_order_quantity})` : ""}`
      : null;
    const choices = solution.part_choices || [];
    const block = el("div", { class: "solution" },
      el("h5", {}, index === 0 ? el("span", { class: "badge ok", text: "chosen" }) : el("span", { class: "badge muted", text: "alternate" }), " ", title),
      el("div", { class: "summary" },
        solution.lifecycle_risk ? Shell.levelBadge("warning", `${solution.lifecycle} (cached)`) : null,
        solution.ranked_by_designer ? el("span", { class: "badge muted", text: "ranked by the designer" }) : null,
        solution.source === "component_parameters" ? el("span", { class: "badge muted", text: "from the parts' MPN parameter" }) : null),
      Shell.facts([
        ["Lifecycle", cachedValue(solution.lifecycle, solution.cache_date)],
        ["Stock (all suppliers)", cachedValue(solution.stock_total, solution.cache_date)],
        ["Best unit price at the need", cachedValue(best, solution.cache_date)],
        ["Suppliers", solution.suppliers === undefined ? null : String(solution.suppliers)],
      ]));
    if (choices.length) {
      // Fixed columns (no column chooser: .solution hides it), so the cache date is never
      // hidden from the stock, price and lifecycle cached with it.
      block.appendChild(el("details", { class: "more" }, el("summary", { text: plural(choices.length, "part choice") }),
        Shell.table({
          label: "Part choices", ownFilter: false, rows: choices,
          columns: [
            { key: "supplier", label: "Supplier", cls: "c-name", value: (choice) => choice.supplier || (choice.no_supplier ? "manufacturer part only" : ""),
              render: (choice) => [choice.supplier || (choice.no_supplier ? "manufacturer part only" : ""),
                choice.pinned ? el("span", { class: "badge muted mark", text: "pinned" }) : null] },
            { key: "sku", label: "SKU", cls: "c-name" },
            { key: "cache_date", label: "Cached on", cls: "c-name", value: (choice) => cachedText(choice.cache_date, choice.cache_date_text) },
            { key: "stock", label: "Stock (cached)", numeric: true,
              render: (choice) => (choice.stock === undefined ? el("span", { class: "muted", text: "—" })
                : [String(choice.stock), choice.enough_stock === false ? el("span", { class: "badge warning mark", text: "short" }) : null]) },
            { key: "unit_price", label: "Unit price (cached)", numeric: true, value: (choice) => choice.unit_price,
              render: (choice) => (choice.unit_price === undefined ? el("span", { class: "muted", text: "—" })
                : [priceText(choice.unit_price, choice.currency), choice.below_minimum_order ? el("span", { class: "sub", text: `minimum order ${choice.price_break_quantity}` }) : null]) },
            { key: "lifecycle", label: "Lifecycle (cached)", cls: "c-name" },
          ],
        }).el));
    }
    return block;
  }

  function bomDocLineBlock(json) {
    const line = json.line;
    const title = line.line_unnumbered || line.line === null ? `Unnumbered BomDoc line${line.design_item_id ? ` ${line.design_item_id}` : ""}` : `BomDoc line ${line.line}`;
    const solutions = line.ranked_solutions || [];
    return el("div", { class: "bomdoc-line" },
      el("h4", { text: `${title}${line.ref ? ` (${line.ref} in the file)` : ""}` }),
      Shell.facts([
        ["Design Item ID", line.design_item_id], ["Source", line.source], ["Item type", line.item_type],
        ["Description", line.description], ["Comment", line.comment], ["Note", line.note], ["BOM status", line.status],
        ["Parts", (line.designators || []).join(", ")], ["Not Fitted", (line.not_fitted || []).join(", ")],
        ["Ambiguous", (line.ambiguous_designators || []).join(", ")], ["Joined by", line.join], ["No parts", line.why_no_parts],
        ["Quantity per board", line.quantity === null ? "not known" : String(line.quantity)],
        ["At the BomDoc's production quantity", line.quantity_at_production === undefined ? null
          : `${line.quantity_at_production} (${plural(json.production_quantity_used, "board")}, ${json.production_quantity_from === "bom_doc" ? "the BomDoc's" : json.production_quantity_from})`],
        ["Custom columns", line.custom_parameters ? Object.entries(line.custom_parameters).map(([key, value]) => `${key}=${value}`).join(", ") : null],
        ["Cache dates", line.cache_dates ? `${String(line.cache_dates.oldest).replace("T", " ")} to ${String(line.cache_dates.newest).replace("T", " ")}` : null],
      ]),
      solutions.length ? solutions.map(solutionBlock)
        : el("p", { class: "muted", text: line.solutions ? `${plural(line.solutions, "solution")} (not listed)` : "No solution: no part choice in the BomDoc and no MPN parameter on its parts." }));
  }

  function solutionsSection(row) {
    // The heading takes keyboard focus while the buttons are gone (a call on its way).
    ui.solutionsHead = el("h3", { text: "BomDoc solutions (get_active_bom)", tabindex: "-1" });
    const head = ui.solutionsHead;
    const bomDoc = hasBomDoc();
    if (bomDoc === false) return [head, el("p", { class: "muted", text: "The project has no ActiveBOM document (check_bom names none)." })];
    if (bomDoc === "unreadable") return [head, el("p", { class: "muted", text: `The BomDoc could not be read: ${bomDocError()}` })];
    if (!canCall()) return [head, el("p", { class: "muted", text: "This host does not let the view call tools: ask Claude for the line's solutions (get_active_bom with line)." })];
    const state = rowSolutions(row);
    if (view.closed && (!state || !state.done)) return [head, el("p", { class: "muted", text: "The view was closed: it asks the server nothing more." })];
    const variant = view.data.variant;
    if (!state) {
      // Whether there is a BomDoc to ask is known once check_bom has answered (or get_bom
      // was asked with active_bom); if check_bom failed, the button is offered anyway.
      if (bomDoc === null && checksState() === "loading") {
        return [head, el("p", { class: "muted", text: "Whether the project has an ActiveBOM document is not known yet: check_bom has not answered." })];
      }
      ui.solutionsButton = el("button", { type: "button", class: "btn", text: "Ranked solutions from the BomDoc",
        title: `Ask get_active_bom for the BomDoc lines of this line's parts (variant ${variant})`,
        on: { click: () => askSolutions(row) } });
      return [head, el("p", { class: "help", text: `Every ranked manufacturer solution and supplier part choice of the BomDoc lines that hold this line's parts, as get_active_bom joins them to ${variant}. ${CACHE_NOTE}` }),
        bomDoc === null ? el("p", { class: "help small", text: "check_bom could not say whether the project has an ActiveBOM document." }) : null,
        el("div", { class: "btn-row" }, ui.solutionsButton)];
    }
    const blocks = [head, el("p", { class: "help small", text: `Asked for ${state.variant}.` })];
    let cacheNote = null;
    const noLine = [];
    for (const args of state.asks) {
      const entry = details.get("get_active_bom", args);
      if (!entry || entry.loading) {
        blocks.push(el("p", { class: "muted", text: `Asking get_active_bom for the BomDoc line of ${args.line}…` }));
        continue;
      }
      if (entry.error) {
        blocks.push(el("div", { class: "notice error" }, el("span", { class: "grow", text: `get_active_bom (${args.line}): ${entry.error}` }),
          el("button", { type: "button", class: "btn-link", text: "Retry", on: { click: () => askSolutions(row) } })));
        continue;
      }
      const { json, text } = parsed(entry);
      if (!json) {
        blocks.push(el("pre", { class: "text", text: String(text).slice(0, 2000) }));
      } else if (json.error === "line_not_found") {
        noLine.push(args.line);
      } else if (json.error) {
        blocks.push(el("div", { class: "notice warning", text: json.message || json.error }));
      } else if (json.lines_omitted) {
        blocks.push(el("div", { class: "notice warning", text: `get_active_bom left the BomDoc line of ${args.line} out: even that one line is too large for its answer. Ask Claude for it in parts (get_active_bom with line and sections).` }));
      } else if (json.line) {
        const warnings = checkContract(CONTRACT.get_active_bom, json);
        if (warnings.length) blocks.push(Shell.notice("warning", `get_active_bom is not quite the shape this view reads: ${warnings.slice(0, 2).join("; ")}.`));
        const holds = [...(json.line.designators || []), ...(json.line.not_fitted || [])].map(upperName);
        if (!holds.includes(upperName(args.line))) {
          // line= takes a line number or Design Item ID before a designator.
          blocks.push(el("div", { class: "notice warning", text: `get_active_bom answered for ${args.line} with a BomDoc line that does not hold it (${args.line} is also a line number or Design Item ID there): ask Claude for that part's line by its ref.` }));
          if (!holds.some((name) => (row.designators || []).map(upperName).includes(name))) continue;
        }
        if (json.cache && !cacheNote) cacheNote = json.cache;
        blocks.push(bomDocLineBlock(json));
      }
    }
    const known = state.done ? (row.designators || []).filter((designator) => !state.covered.has(upperName(designator)) &&
      partsWithoutLine().has(upperName(designator)) && !state.left.includes(designator)) : [];
    const listed = (names) => names.slice(0, 12).join(", ") + (names.length > 12 ? ` and ${names.length - 12} more` : "");
    if (noLine.length) blocks.push(el("p", { class: "help", text: `On no BomDoc line (get_active_bom): ${listed(noLine)}.` }));
    if (known.length) blocks.push(el("p", { class: "help", text: `On no BomDoc line (check_bom lists them as parts without one, so they were not asked): ${listed(known)}.` }));
    if (state.done && state.left.length) {
      blocks.push(el("p", { class: "help", text: state.stopped
        ? `Not asked, as the calls stopped above: ${listed(state.left)}.`
        : `Not asked yet (${plural(state.left.length, "part")}; the view makes up to ${WALK_ASKS} get_active_bom calls at a time): ${listed(state.left)}.` }));
    }
    // get_active_bom's own note on the cache, with its dates (else the view's).
    const span = !cacheNote ? "" : cacheNote.oldest
      ? ` The BomDoc's cache: ${cacheNote.dated} of its ${plural(cacheNote.part_choices, "part choice")} dated, ${String(cacheNote.oldest).replace("T", " ")} to ${String(cacheNote.newest).replace("T", " ")}.`
      : " None of its part choices has a cache date.";
    blocks.splice(2, 0, el("p", { class: "cached", text: `${cacheNote ? cacheNote.note : CACHE_NOTE}${span}` }));
    if (state.done) {
      const more = state.left.length && !state.stopped && !view.closed
        ? el("button", { type: "button", class: "btn", text: "Ask for the next ones",
                         title: `Ask get_active_bom for the BomDoc lines of the parts not asked yet (up to ${WALK_ASKS})`,
                         on: { click: () => askSolutions(row, "more") } }) : null;
      ui.solutionsButton = view.closed ? null : el("button", { type: "button", class: "btn", text: "Ask again",
        title: "Ask get_active_bom again for this line", on: { click: () => askSolutions(row, "again") } });
      blocks.push(el("div", { class: "btn-row" }, more, ui.solutionsButton));
    }
    return blocks;
  }

  // ---------- the details panes ----------

  function chosenText(entry) {
    const name = [entry.manufacturer, entry.mpn].filter(Boolean).join(" ") || "(no part number)";
    const source = entry.source === "component_parameters" ? " (from the parts' MPN parameter)" : "";
    const lifecycle = entry.lifecycle ? `; lifecycle ${entry.lifecycle} (${cachedText(entry.cache_date)})` : "";
    return `${name}${source}${lifecycle}`;
  }

  function findingItem(finding) {
    return el("li", {}, Shell.levelBadge(finding.severity), el("strong", { text: checkLabel(finding.check) }), ": ", finding.issue);
  }

  function linePane(row) {
    const data = view.data;
    const designators = row.designators || [];
    ui.closeButton = el("button", { type: "button", class: "btn", text: "Close", on: { click: closeDetails } });
    const title = row.comment || row.mpn || row.value || designators[0] || "Line";
    const blocks = [el("div", { class: "row" }, el("h2", { text: title }), ui.closeButton),
      el("div", { class: "summary" }, marksOf(row).map(([kind, text]) => el("span", { class: `badge ${kind}`, text })))];
    const logical = row.logical_designators || {};
    const quantity = Number(row.quantity) || 0;
    blocks.push(Shell.facts([
      ["Quantity per board", String(row.quantity)],
      ["For boards", row._fitted && view.boards > 1 ? `${quantity * view.boards} (${quantity} × ${view.boards}: a local calculation)` : null],
      ["Designators", designators.map((designator) => (logical[designator] ? `${designator} (sheet ${logical[designator]})` : designator)).join(", ")],
      ["Comment", row.comment], ["Value", row.value], ["Description", row.description], ["Footprint", row.footprint],
      ["Manufacturer", row.manufacturer],
      ["MPN", row.mpn || (row.mpn_placeholder ? `${row.mpn_placeholder} (placeholder: ${placeholderText(row)})` : null)],
      ["MPN from", row.mpn_source === "part number" ? "a Part Number parameter" : null],
      ["Varied in the variant", (row.varied_parameters || []).join(", ")],
      ["Fitted", row._fitted ? null : `no: Not Fitted in ${data.variant}`],
    ], "facts section-gap"));
    if (row._missing === "yes") blocks.push(el("p", { class: "help small", text: `A part on this line needs a manufacturer part number and has none (mpn_coverage_percent's rule; the Notes tab says how the view tells). ${row._missingWhy}` }));
    if (row._missing === "may") blocks.push(el("p", { class: "help small", text: `A part on this line may need a manufacturer part number and have none: ${row._missingWhy} Once check_bom has answered for a project without a BomDoc, its missing_mpn findings decide.` }));
    if (row.varies) {
      blocks.push(el("h3", { text: "Varies within the line" }));
      blocks.push(Shell.facts(Object.entries(row.varies).map(([field, values]) => {
        const count = variesCount(row, field);
        const shown = values.map((value) => (value === null || value === undefined ? "(none)" : String(value))).join(" / ");
        return [FIELD_LABEL[field] || field, count > values.length ? `${shown} (the first ${values.length} of ${count})` : shown];
      })));
    }
    const alternates = Object.entries(row.alternate_parts || {});
    if (alternates.length) {
      blocks.push(el("h3", { text: "Alternate parts" }));
      blocks.push(Shell.facts(alternates.map(([designator, part]) => [designator, part || "(no library reference)"])));
      if (data.alternate_parts_note) blocks.push(el("p", { class: "help small", text: data.alternate_parts_note }));
    }
    blocks.push(el("h3", { text: "check_bom findings" }));
    const checks = view.checks;
    const state = checksState();
    if (state === "loading") blocks.push(el("p", { class: "muted", text: "Asking check_bom…" }));
    else if (state === "failed") blocks.push(el("p", { class: "muted", text: `Not known: check_bom failed (${checks.error}).` }));
    else if (state !== "ready") blocks.push(el("p", { class: "muted", text: `${CHECKS_UNKNOWN[state]}.` }));
    else if (!row._findings.length) blocks.push(el("p", { class: "muted", text: "None for this line's parts." }));
    else blocks.push(el("ul", { class: "findings" }, row._findings.map(findingItem)));
    const maybe = state === "ready" ? checks.findings.filter((finding) => (finding._maybe || []).includes(row)) : [];
    if (maybe.length) {
      blocks.push(el("p", { class: "help small", text: "These findings may be about this line too (get_bom's lines give no sheet, so the view cannot tell which part a sheet designator names):" }));
      blocks.push(el("ul", { class: "findings" }, maybe.map(findingItem)));
    }
    if (Array.isArray(row.bom_doc_lines)) {
      blocks.push(el("h3", { text: "BomDoc (get_bom active_bom)" }));
      blocks.push(Shell.facts([
        ["Lines", row.bom_doc_lines.length ? row.bom_doc_lines.map((number) => (number === null ? "unnumbered" : String(number))).join(", ") : "no BomDoc line"],
        ["Chosen", (row.bom_doc_chosen || []).map(chosenText).join("; ")],
      ]));
    }
    blocks.push(el("section", { data: { section: "solutions" } }, solutionsSection(row)));
    blocks.push(el("section", { data: { section: "component" } }, componentSection(row)));
    return blocks;
  }

  const FINDING_FIELDS = [
    ["mpn", "MPN"], ["mpns", "MPNs"], ["part_mpn", "Parts' MPN"], ["manufacturer", "Manufacturer"],
    ["field", "Field"], ["comment", "Comment"], ["reason", "Reason"], ["why", "Why"], ["count", "Count"],
    ["coverage_percent", "MPN coverage (%)"], ["design_item_id", "Design Item ID"], ["design_item_ids", "Design Item IDs"],
    ["source", "Source"], ["bom_doc_lines", "BomDoc lines"], ["bom_doc_unnumbered_lines", "Unnumbered BomDoc lines"],
  ];

  function findingFacts(finding) {
    const text = (value) => (Array.isArray(value) ? value.join(", ") : value === null || value === undefined ? null : String(value));
    const pairs = [["Check", checkLabel(finding.check)], ["Severity", finding.severity],
      ["BomDoc line", "line" in finding || finding.lines || finding.unnumbered_lines ? bomDocLines(finding) : null]];
    for (const [key, label] of FINDING_FIELDS) pairs.push([label, text(finding[key])]);
    // Cached supply figures: always with their cache date.
    pairs.push(["Lifecycle", "lifecycle" in finding ? cachedValue(finding.lifecycle, finding.cache_date) : null]);
    // What the other part choices report: cached too, their dates on the line's part choices.
    pairs.push(["Other lifecycles", cachedValue(text(finding.other_lifecycles), null, "the line's part choices give each one's date")]);
    pairs.push(["Stock", "stock" in finding ? cachedValue(finding.stock, finding.cache_date) : null]);
    pairs.push(["Need", text(finding.need)]);
    pairs.push(["Cached", finding.oldest ? `${String(finding.oldest).replace("T", " ")} to ${String(finding.newest).replace("T", " ")}` : null]);
    return Shell.facts(pairs, "facts section-gap");
  }

  function findingPane(finding) {
    ui.closeButton = el("button", { type: "button", class: "btn", text: "Close", on: { click: closeDetails } });
    const rows = finding._rows || [];
    const unmapped = finding._unmapped || [];
    const notFitted = new Set((view.data.not_fitted_designators || []).map(String));
    const blocks = [el("div", { class: "row" }, el("h2", { text: checkLabel(finding.check) }), ui.closeButton),
      el("div", { class: "summary" }, Shell.levelBadge(finding.severity)),
      el("p", { text: finding.issue }), findingFacts(finding)];
    if ((finding.designators || []).length) {
      blocks.push(el("h3", { text: `Parts (${finding.designators.length}${capped(finding) ? ` listed: check_bom lists the first ${finding.designators.length}` : ""})` }));
      blocks.push(el("p", { class: "desig", text: finding.designators.join(", ") }));
      const lineButton = (row) => el("button", { type: "button", class: "btn",
        text: `${(row.designators || []).slice(0, 3).join(", ")}${(row.designators || []).length > 3 ? "…" : ""}: ${row.comment || row.mpn || "line"}`,
        title: "Show this line in the Lines tab", on: { click: () => showLine(row) } });
      blocks.push(el("h3", { text: `BOM lines (${capped(finding) ? "at least " : ""}${rows.length})` }));
      if (finding.check === "duplicate_designator") {
        blocks.push(el("p", { class: "help small", text: "check_bom names a sheet designator (as on the sheet the issue names): the lines of the parts with that sheet designator, or of the part of that name." }));
      }
      blocks.push(el("div", { class: "btn-row" }, rows.map(lineButton)));
      const maybe = finding._maybe || [];
      if (maybe.length) {
        blocks.push(el("p", { class: "help", text: `One of these lines, not marked: both a part named ${finding.designators.join(", ")} and parts with that sheet designator are in the BOM, and get_bom's lines give no sheet.` }));
        blocks.push(el("div", { class: "btn-row" }, maybe.map(lineButton)));
      }
      if (unmapped.length) {
        const nf = unmapped.filter((designator) => notFitted.has(String(designator)));
        const other = unmapped.filter((designator) => !notFitted.has(String(designator)));
        if (nf.length) blocks.push(el("p", { class: "help", text: `Not Fitted in ${view.data.variant} (the Lines chip "Not Fitted" shows their lines): ${nf.join(", ")}.` }));
        if (other.length) blocks.push(el("p", { class: "help", text: `On no BOM line of ${view.data.variant}: ${other.join(", ")}.` }));
      }
    } else {
      blocks.push(el("p", { class: "muted", text: "This finding is about the whole BOM: it names no part." }));
    }
    return blocks;
  }

  /** Where keyboard focus is in the details: "solutions-head", a section ("solutions",
   *  "component"), "pane" elsewhere in it, or "" outside. */
  function paneFocus() {
    const active = document.activeElement;
    if (!ui.pane || !active || !ui.pane.contains(active)) return "";
    if (active === ui.solutionsHead) return "solutions-head";
    const section = active.closest("[data-section]");
    return section ? section.dataset.section : "pane";
  }

  /** Redraw the details. The pane keeps its scroll position while it shows the same line
   *  or finding (an answer arriving does not move what the user reads), and keyboard
   *  focus stays in the section it was in: a button that is gone (Ranked solutions, Ask
   *  again, Retry: "Asking…" now) hands it to that section's own button or heading,
   *  never to another section's action. */
  function renderPane() {
    if (!ui.pane) return;
    const was = paneFocus();
    const top = ui.pane.scrollTop;
    const before = ui.paneShows;
    Shell.keepFocus(ui.pane, drawPane, () => {
      if (was === "solutions-head") return ui.solutionsHead;
      if (was === "solutions") return ui.solutionsButton || ui.solutionsHead;
      if (was === "component") return ui.askButton || ui.componentHead;
      return ui.closeButton;
    });
    if (before && before === ui.paneShows) {
      ui.pane.scrollTop = top;
      const active = document.activeElement;
      if (active && active !== ui.pane && ui.pane.contains(active)) keepInView(active);
    }
  }

  /** Scroll the details pane just enough to show a control that has keyboard focus. */
  function keepInView(node) {
    const box = ui.pane.getBoundingClientRect();
    const at = node.getBoundingClientRect();
    if (!box.height || !at.height) return;
    if (at.top < box.top) ui.pane.scrollTop -= box.top - at.top + 8;
    else if (at.bottom > box.bottom) ui.pane.scrollTop += Math.min(at.bottom - box.bottom + 8, at.top - box.top);
  }

  function drawPane() {
    clear(ui.pane);
    ui.askButton = null;
    ui.solutionsButton = null;
    ui.solutionsHead = null;
    ui.componentHead = null;
    ui.closeButton = null;
    const row = view.tab === "lines" ? selectedRow() : null;
    const finding = view.tab === "findings" ? selectedFinding() : null;
    const shown = Boolean(row || finding);
    ui.paneShows = row ? `line ${row._key}` : finding ? `finding ${finding._id}` : "";
    ui.pane.classList.toggle("idle", !shown);
    if (ui.split) ui.split.classList.toggle("solo", shown && compactHost());
    if (row) {
      Shell.append(ui.pane, linePane(row));
      return;
    }
    if (finding) {
      Shell.append(ui.pane, findingPane(finding));
      return;
    }
    Shell.append(ui.pane, [
      el("h2", { text: view.tab === "findings" ? "Select a finding" : "Select a line" }),
      el("p", { class: "help", text: view.tab === "findings"
        ? "Click a finding (or move to it and press Enter) for its details and the BOM lines that hold its parts."
        : "Click a line (or move to it and press Enter) for all its fields and designators, what varies within it, its alternate parts and check_bom findings, its BomDoc solutions and the part from get_component." }),
      el("p", { class: "help", text: "Keys: Up and Down move between rows and group headers, Enter selects or opens and closes a group, Left and Right close and open a group, Esc clears." }),
    ]);
  }

  // ---------- the variant comparison and notes ----------

  function compareRows(variants) {
    const rows = [];
    for (const entry of variants) {
      for (const designator of entry.not_fitted || []) rows.push({ variant: entry.variant, designator, what: "Fitted", from: "Fitted", to: "Not Fitted" });
      for (const changed of entry.changed || []) {
        for (const [field] of FIELDS) {
          const change = changed[field];
          if (change && typeof change === "object") {
            rows.push({ variant: entry.variant, designator: changed.designator, what: FIELD_LABEL[field],
                        from: change.from === null || change.from === undefined ? "(none)" : String(change.from),
                        to: change.to === null || change.to === undefined ? "(none)" : String(change.to) });
          }
        }
        if (changed.alternate_part) rows.push({ variant: entry.variant, designator: changed.designator, what: "Alternate part", from: "the base part", to: String(changed.alternate_part) });
      }
    }
    rows.forEach((row, index) => { row._id = index; });
    return rows;
  }

  function variantsBlock() {
    const block = el("div", { class: "pane" }, el("h2", { text: "What each variant changes in the BOM" }));
    const state = view.compare;
    if (!state || (!state.variants && !state.loading && !state.error)) {
      block.appendChild(el("p", { class: "help", text: "get_bom with compare_variants lists, for each variant, its Not Fitted parts, the values it changes against the base design and its alternate parts." }));
      if (!canCall()) block.appendChild(el("p", { class: "muted", text: "This host does not let the view call tools: ask Claude (get_bom with compare_variants)." }));
      else if (view.closed) block.appendChild(el("p", { class: "muted", text: "The view was closed: it asks the server nothing more." }));
      else block.appendChild(el("div", { class: "btn-row" }, el("button", { type: "button", class: "btn", text: "Ask get_bom what each variant changes", on: { click: () => loadCompare() } })));
      return block;
    }
    if (state.loading || state.closed) {
      block.appendChild(el("p", { class: "muted", text: view.closed ? "The view was closed: it asks the server nothing more." : "Asking get_bom with compare_variants…" }));
      return block;
    }
    if (state.error) {
      block.appendChild(el("div", { class: "notice error" }, el("span", { class: "grow", text: `get_bom with compare_variants failed: ${state.error}` }),
        view.closed ? null : el("button", { type: "button", class: "btn-link", text: "Retry", on: { click: () => { view.compare = null; loadCompare(); } } })));
      return block;
    }
    const variants = state.variants;
    block.appendChild(el("p", { class: "help small", text: `${state.from === "result" ? "From the call's own result" : "Asked of get_bom with compare_variants"}: each variant against the base design (${BASE}), whatever variant this BOM shows.` }));
    if (!variants.length) {
      block.appendChild(el("p", { class: "muted", text: "The project defines no variant that changes the BOM." }));
      return block;
    }
    block.appendChild(Shell.facts(variants.map((entry) => [entry.variant,
      `${(entry.not_fitted || []).length} Not Fitted, ${plural((entry.changed || []).length, "part")} changed${view.data && sameVariant(entry.variant, view.data.variant) ? " (shown)" : ""}${view.active && sameVariant(entry.variant, view.active) ? " (active)" : ""}`])));
    const rows = compareRows(variants);
    const order = new Map(variants.map((entry, index) => [entry.variant, index]));
    block.appendChild(Shell.table({
      label: "What each variant changes", ownFilter: false, rows, rowKey: (row) => row._id,
      empty: "No variant changes the BOM.",
      group: { key: (row) => row.variant, order: (x, y) => order.get(x) - order.get(y),
               count: (key, members) => el("span", { class: "badge", text: plural(members.length, "change") }),
               open: (key, members, groups) => groups === 1 || rows.length <= 150 },
      columns: [
        { key: "designator", label: "Part", cls: "c-name", value: (row) => row.designator, render: (row) => row.designator },
        { key: "what", label: "What", cls: "c-name" },
        { key: "from", label: "Base design", cls: "c-val" },
        { key: "to", label: "Variant", cls: "c-val" },
      ],
    }).el);
    return block;
  }

  function notesBlock() {
    const data = view.data;
    const asked = data.asked;
    const bomDoc = data.bom_doc;
    const checks = view.checks;
    const excluded = Object.entries((data.parts || {}).excluded_by_kind || {});
    return el("div", { class: "pane" },
      el("h2", { text: "Notes" }),
      Shell.facts([
        ["Variant", `${data.variant}${isBase(data.variant) ? " (the base design)" : ""}`],
        ["Asked with", askedText()],
        ["Read", `${plural(data.pages, "page")} of get_bom${data.incomplete ? `, then stopped: ${data.stopReason}` : ""}`],
        ["Page size", data.lines_limited_to ? `get_bom cut its pages to ${data.lines_limited_to} lines to fit its size limit` : null],
        ["Netlist", data.netlist_updated_utc ? `updated ${data.netlist_updated_utc}` : "update time not known"],
        ["Parts from", data.compiled_part_list ? "the compiled part list" : "the sheets (no compiled part list)"],
        ["Excluded by kind", excluded.map(([kind, count]) => `${count} ${kind}`).join(", ")],
        ["Stale variant entries", data.stale_variant_entries ? `${stale(data.stale_variant_entries)}: check_bom lists them (stale_variant_entry)` : null],
        ["MPN coverage", data.mpn_coverage_percent === null ? "no part needs an MPN" : `${data.mpn_coverage_percent}% of the parts that need one`],
        ["check_bom", checks && checks.header ? `${plural(checks.pages, "page")} read; checks run: ${(checks.header.checks_run || []).map(checkLabel).join(", ")}${checks.header.findings_limited_to ? `; pages cut to ${checks.header.findings_limited_to} findings` : ""}` : null],
      ], "facts section-gap"),
      ...data.notes.map((note) => el("p", { class: "help small", text: note })),
      el("h3", { text: "Missing MPN" }), el("p", { class: "help small", text: MPN_RULE }),
      data.alternate_parts_note ? [el("h3", { text: "Alternate parts" }), el("p", { class: "help small", text: data.alternate_parts_note })] : null,
      bomDoc ? [el("h3", { text: "ActiveBOM document" }), Shell.facts([
        ["File", bomDoc.file], ["Chosen", bomDoc.chosen_by], ["In the project", bomDoc.in_project ? "yes" : "no: Altium does not use it for the project's BOM"],
        ["Lines", String(bomDoc.lines)],
        ["Cache", bomDoc.cache && bomDoc.cache.oldest ? `${String(bomDoc.cache.oldest).replace("T", " ")} to ${String(bomDoc.cache.newest).replace("T", " ")} (cached, not current)` : "no dated part choice"],
        ["Other BomDocs", (bomDoc.other_bom_docs || []).join(", ")], ["Not in the project", (bomDoc.not_in_project || []).join(", ")],
        ["Missing on disk", (bomDoc.missing_on_disk || []).join(", ")],
      ])] : null,
      el("h3", { text: "Boards" }), el("p", { class: "help small", text: LOCAL_NOTE }),
      el("p", { class: "help small section-gap", text: READ_ONLY_NOTE }));
  }

  function askedText() {
    const data = view.data;
    const asked = data.asked;
    return [asked.variant ? `variant ${asked.variant}` : "no variant (the active one)",
      data.groupKnown ? `group_by ${asked.group_by || "mpn"}` : "group_by not known (the host did not send the call's arguments)",
      asked.include_not_fitted ? "include_not_fitted" : null, asked.compare_variants ? "compare_variants" : null,
      asked.active_bom ? "active_bom" : null].filter(Boolean).join(", ");
  }

  // ---------- page ----------

  function headBadges() {
    const data = view.data;
    const parts = data.parts || {};
    const excluded = Object.values(parts.excluded_by_kind || {}).reduce((sum, count) => sum + count, 0);
    const badges = [
      el("span", { class: "badge", text: plural(data.lines_total || 0, "line") }),
      el("span", { class: "badge muted", text: `${plural(parts.in_bom || 0, "part")} in the BOM` }),
      parts.not_fitted ? el("span", { class: "badge muted", text: `${parts.not_fitted} Not Fitted` }) : null,
      excluded ? el("span", { class: "badge muted", text: `${excluded} excluded by kind`, title: Object.entries(parts.excluded_by_kind).map(([kind, count]) => `${count} ${kind}`).join(", ") }) : null,
      el("span", { class: "badge muted", text: data.mpn_coverage_percent === null ? "no MPN needed" : `MPN ${data.mpn_coverage_percent}%`,
                   title: "MPN coverage: the parts that need a manufacturer part number and have one" }),
      view.boards > 1 ? el("span", { class: "badge info", text: `× ${view.boards} boards: ${(parts.in_bom || 0) * view.boards} parts`, title: LOCAL_NOTE }) : null,
    ];
    const checks = view.checks;
    if (checks && checks.header) {
      const counts = checks.header.severity_counts || {};
      for (const severity of ["error", "warning", "info"]) {
        if (counts[severity]) badges.push(Shell.levelBadge(severity, severityText(severity, counts[severity])));
      }
    }
    return badges;
  }

  function updateHeadBadges() {
    if (!ui.summary || !view.data) return;
    clear(ui.summary);
    Shell.append(ui.summary, headBadges());
    if (ui.caption) ui.caption.textContent = captionText();
  }

  function captionText() {
    const data = view.data;
    const checks = view.checks && view.checks.header ? ` and check_bom's for ${view.checks.variant}` : "";
    return `Totals of ${data.variant}'s whole BOM as get_bom counts them${checks}, not of the rows the filters show. ${data.groupKnown ? `Lines grouped by ${(data.asked.group_by || "mpn") === "mpn" ? "MPN" : "Comment"} (get_bom group_by).` : ""}`.trim();
  }

  function tabItems() {
    const state = checksState();
    const findings = state === "ready" ? String(view.checks.findings.length) : CHECKS_MARK[state];
    const rows = fittedRows().length;
    return [
      { id: "lines", label: `Lines (${rows})` },
      { id: "findings", label: `Findings (${findings})` },
      { id: "variants", label: "Variants" },
      { id: "notes", label: "Notes" },
    ];
  }

  function updateTabs() {
    if (!ui.tabBar) return;
    const buttons = [...ui.tabBar.el.querySelectorAll("button")];
    tabItems().forEach((item, index) => { if (buttons[index]) buttons[index].textContent = item.label; });
  }

  function updateFilters() {
    if (ui.filteredBadge) ui.filteredBadge.hidden = !filtered();
    if (ui.showSwitch) {
      const buttons = [...ui.showSwitch.el.querySelectorAll("button")];
      const rows = allRows().filter((row) => view.kinds.has(row._fitted ? "fitted" : "not_fitted"));
      const state = checksState();
      const missing = rows.filter((row) => row._missing === "yes").length;
      const maybe = rows.filter((row) => row._missing === "may").length;
      const findings = rows.filter((row) => row._findings.length).length;
      if (buttons[1]) {
        buttons[1].textContent = maybe ? `Missing MPN (${missing} + ${maybe} may)` : `Missing MPN (${missing})`;
        buttons[1].disabled = view.data.mpn_coverage_percent === null && view.show !== "missing";
        buttons[1].title = view.data.mpn_coverage_percent === null ? "get_bom: no part of this BOM needs an MPN"
          : maybe ? `${SHOW[1].title}; ${plural(maybe, "line")} may be missing one: their data cannot tell (the line's details say why)` : SHOW[1].title;
      }
      if (buttons[2]) {
        buttons[2].textContent = `With findings (${state === "ready" ? findings : CHECKS_MARK[state]})`;
        buttons[2].disabled = state !== "ready" && view.show !== "findings";
        buttons[2].title = state === "ready" ? SHOW[2].title : `${SHOW[2].title}: ${CHECKS_UNKNOWN[state]}`;
      }
    }
  }

  /** The Not Fitted chip counts lines, as the In the BOM chip does, once get_bom has
   *  listed them; before, it says the number of parts. */
  function notFittedChip() {
    const parts = (view.data.parts || {}).not_fitted || 0;
    const rows = view.notFitted && view.notFitted.rows ? view.notFitted.rows.length : null;
    return rows === null
      ? { count: plural(parts, "part"), title: `The variant's ${plural(parts, "Not Fitted part")}, as lines once get_bom lists them (include_not_fitted)` }
      : { count: String(rows), title: `The variant's ${plural(parts, "Not Fitted part")} on ${plural(rows, "line")} (get_bom include_not_fitted)` };
  }

  function chipRow() {
    const parts = view.data.parts || {};
    const items = [{ id: "fitted", label: "In the BOM", count: fittedRows().length, title: "The BOM's lines" }];
    if (parts.not_fitted) items.push({ id: "not_fitted", label: "Not Fitted", ...notFittedChip() });
    return Shell.chips({
      label: "Lines", items, selected: [...view.kinds].filter((kind) => items.some((item) => item.id === kind)),
      onChange: (on) => {
        view.kinds = on;
        if (on.has("not_fitted") && !(view.notFitted && (view.notFitted.rows || view.notFitted.loading))) loadNotFitted();
        updateFilters();
        if (ui.table && view.tab === "lines") ui.table.setFilter(rowFilter);
        if (ui.nfStatus) ui.nfStatus.textContent = notFittedStatus();
      },
    });
  }

  function updateChips() {
    const chip = ui.chips ? ui.chips.el.querySelectorAll(".chip")[1] : null;
    if (!chip || !view.data) return;
    const { count, title } = notFittedChip();
    const badge = chip.querySelector(".chip-count");
    if (badge) badge.textContent = count;
    chip.setAttribute("title", title);
  }

  function emptyBlock() {
    const data = view.data;
    const parts = data.parts || {};
    const excluded = Object.values(parts.excluded_by_kind || {}).reduce((sum, count) => sum + count, 0);
    return Shell.state("empty", `${data.variant} has no BOM line`,
      `${plural(parts.not_fitted || 0, "part")} Not Fitted and ${excluded} excluded by kind (Graphical, Net Tie, Standard (No BOM)). Pick another variant, or show the Not Fitted lines.`);
  }

  function renderTab() {
    clear(ui.content);
    // The details pane belongs to the lines and findings: the other tabs take the width.
    const split = view.tab === "lines" || view.tab === "findings";
    if (ui.split) ui.split.classList.toggle("split", split);
    if (ui.pane) ui.pane.hidden = !split;
    if (ui.tableTools) ui.tableTools.hidden = view.tab !== "lines";
    if (ui.filterRow) ui.filterRow.hidden = !split;
    ui.table = null;
    if (view.tab === "lines") {
      if (!view.data.lines_total && !view.data.incomplete) ui.content.appendChild(emptyBlock());
      ui.table = linesTable();
      ui.table.setQuery(view.query);
      const row = selectedRow();
      if (row) ui.table.select((other) => other._key === row._key);
      ui.content.appendChild(ui.table.el);
      return;
    }
    if (view.tab === "findings") ui.content.appendChild(findingsBlock());
    else if (view.tab === "variants") ui.content.appendChild(variantsBlock());
    else ui.content.appendChild(notesBlock());
  }

  function renderAll() {
    const data = view.data;
    ui.content = el("div", { class: "content" });
    ui.pane = el("aside", { class: "pane", "aria-label": "Details" });
    ui.split = el("div", { class: "split" }, ui.content, ui.pane);
    const filter = Shell.filterBox({
      placeholder: "Filter designators, values, parts", label: "Filter the table", value: view.query,
      onInput: (text) => {
        view.query = text;
        if (ui.table) ui.table.setQuery(text);
      },
    });
    ui.filterRow = el("div", { class: "toolbar" }, filter);
    const roomy = roomyHere();
    if (view.filtersOpen === null) view.filtersOpen = roomy;
    if (view.controlsOpen === null) view.controlsOpen = roomy;
    const grouping = Shell.segmented({ label: "Group rows by", items: GROUPINGS, current: view.groupBy, onChange: regroup });
    ui.showSwitch = Shell.segmented({ label: "Show", items: SHOW, current: view.show, onChange: (id) => {
      view.show = id;
      updateFilters();
      if (ui.table && view.tab === "lines") ui.table.setFilter(rowFilter);
    } });
    const groupTools = el("span", { class: "toolbar" },
      el("button", { type: "button", class: "btn", text: "Expand all", on: { click: () => ui.table && view.tab === "lines" && ui.table.expandAll() } }),
      el("button", { type: "button", class: "btn", text: "Collapse all", on: { click: () => ui.table && view.tab === "lines" && ui.table.collapseAll() } }));
    // "filtered" while a filter hides lines (the chips and the switch update it): the
    // disclosure may be closed.
    ui.filteredBadge = el("span", { class: "badge info", text: "filtered", hidden: !filtered() });
    ui.nfStatus = el("span", { class: "status", "aria-live": "off", text: notFittedStatus() });
    ui.chips = chipRow();
    ui.tableTools = el("details", { class: "filters-box", open: view.filtersOpen },
      el("summary", { text: "Group and filter" }, ui.filteredBadge),
      el("div", { class: "toolbar" }, grouping.el, groupTools),
      el("div", { class: "filters" }, ui.chips.el, ui.showSwitch.el, ui.nfStatus));
    ui.tableTools.addEventListener("toggle", () => { view.filtersOpen = ui.tableTools.open; });
    ui.tabBar = Shell.tabs(tabItems(), (id) => {
      view.tab = id;
      view.selected = null;
      view.asked = [];
      renderTab();
      renderPane();
    }, view.tab, ui.split);
    // One full-screen button for the page's life: it follows the host's display mode.
    ui.displayButton = ui.displayButton || Shell.displayModeButton((error) => app.prepend(Shell.notice("error", error.message)));
    const warnings = [];
    if (data.incomplete) {
      warnings.push(Shell.notice("warning", `Read ${plural(data.pages, "page")} of get_bom, then stopped: ${data.stopReason}. ` +
        `The table holds ${fittedRows().length} of the ${plural(data.lines_total, "line")}; the totals above are the whole BOM's.`));
    }
    if (!canCall()) warnings.push(Shell.notice("info", "This host does not let the view call tools: more pages, check_bom's findings, the variant switch, the Not Fitted lines and the details' calls are off."));
    if (data.bom_doc_error) {
      const error = data.bom_doc_error;
      const text = `${error.message || error.error}${error.hint ? ` ${error.hint}` : ""}`;
      warnings.push(error.error === "no_bom_doc" ? Shell.notice("info", `No BomDoc columns: ${text}`)
        : Shell.notice("warning", `The BomDoc could not be read: ${text}`));
    }
    if (data.bom_doc && data.bom_doc.in_project === false) warnings.push(Shell.notice("info", `The BomDoc read (${data.bom_doc.file}) is not in the project: Altium does not use it for the project's BOM.`));
    if (data.stale_variant_entries) warnings.push(Shell.notice("info", `${data.variant} has ${stale(data.stale_variant_entries)} that no longer fit their parts: the Findings tab lists them (stale_variant_entry).`));
    if (view.warnings.length) warnings.push(Shell.notice("warning", `The result is not quite the shape this view reads: ${view.warnings.slice(0, 3).join("; ")}.`));
    if (view.listWarnings.length) warnings.push(Shell.notice("warning", `list_variants is not quite the shape this view reads: ${view.listWarnings.slice(0, 3).join("; ")}.`));
    // The switch: open where there is room, else behind a one-line disclosure (a short or
    // narrow host), which the user opens or closes.
    // The boards row is not redrawn with the rest (typing in it keeps its place).
    ui.controls = el("div", {});
    const section = el("section", { class: "picker", "aria-label": "Variant, grouping and boards" }, ui.controls,
      el("div", { class: "picker-row" }, el("label", {}, el("span", { class: "side", text: "Boards" }), boardsInput()),
        el("span", { class: "local", id: "boards-note", text: LOCAL_NOTE }), ui.boardsError));
    const controlsBox = el("details", { class: "filters-box", open: view.controlsOpen },
      el("summary", { text: "Variant, grouping and boards" }), section);
    controlsBox.addEventListener("toggle", () => { view.controlsOpen = controlsBox.open; });
    ui.summary = el("span", { class: "summary" });
    ui.caption = el("p", { class: "approx" });
    clear(app).append(
      el("div", { class: "head" },
        el("h1", { text: "BOM" }),
        el("span", { class: "vs" }, el("span", { class: "badge info", text: "variant" }), el("span", { class: "name", text: data.variant })),
        ui.summary,
        el("span", { class: "grow" }), ui.displayButton),
      ui.caption,
      ...warnings,
      controlsBox,
      ui.filterRow,
      ui.tableTools,
      ui.tabBar.el,
      ui.split);
    updateHeadBadges();
    drawControls();
    renderTab();
    updateFilters();
    renderPane();
  }

  // ---------- a CSV result without tools ----------

  /** RFC 4180 CSV as get_bom writes it: quoted cells, doubled quotes. */
  function parseCsv(text) {
    const rows = [];
    let row = [];
    let cell = "";
    let quoted = false;
    for (let index = 0; index < text.length; index += 1) {
      const char = text[index];
      if (quoted) {
        if (char === '"' && text[index + 1] === '"') {
          cell += '"';
          index += 1;
        } else if (char === '"') quoted = false;
        else cell += char;
      } else if (char === '"') quoted = true;
      else if (char === ",") {
        row.push(cell);
        cell = "";
      } else if (char === "\n" || char === "\r") {
        if (char === "\r" && text[index + 1] === "\n") index += 1;
        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
      } else cell += char;
    }
    if (cell || row.length) {
      row.push(cell);
      rows.push(row);
    }
    // get_bom puts an apostrophe before a cell a spreadsheet would run as a formula.
    return rows.map((cells) => cells.map((value) => (/^'[=+\-@\t\r]/.test(value) ? value.slice(1) : value)));
  }

  function drawCsv(first, asked, failure = "") {
    const [header = [], ...body] = parseCsv(first.csv || "");
    const rows = body.filter((cells) => cells.some(Boolean)).map((cells, index) => {
      const row = { _id: index };
      header.forEach((title, column) => { row[`c${column}`] = cells[column] || ""; });
      return row;
    });
    clear(app).append(
      el("div", { class: "head" }, el("h1", { text: "BOM" }),
        el("span", { class: "vs" }, el("span", { class: "badge info", text: "variant" }), el("span", { class: "name", text: first.variant })),
        el("span", { class: "summary" }, el("span", { class: "badge", text: plural(first.lines_total || 0, "line") }),
          el("span", { class: "badge muted", text: `${plural((first.parts || {}).in_bom || 0, "part")} in the BOM` }))),
      Shell.notice("info", failure || "The call asked for CSV (format csv) and this host does not let the view ask get_bom again for JSON: the table shows this page's CSV rows as text, without the view's grouping, filters and details."),
      first.has_more || first.offset > 0 ? Shell.notice("warning", `This CSV page holds lines ${first.offset + 1} to ${first.offset + rows.length} of ${first.lines_total}: ask Claude for the others (offset ${first.has_more ? first.next_offset : 0}).`) : null,
      Shell.table({
        label: "BOM lines (CSV)", rows, rowKey: (row) => row._id,
        columns: header.map((title, column) => ({ key: `c${column}`, label: title, cls: "c-name",
          numeric: title === "Quantity", value: title === "Quantity" ? (row) => Number(row[`c${column}`]) || 0 : undefined })),
      }).el);
    view.busy = false;
  }

  // ---------- host ----------

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && view.selected && !event.defaultPrevented) closeDetails();
  });
  Shell.on("toolInput", (args) => {
    view.args = args || {};
    view.argsKnown = true;
    if (!view.data && !view.busy) showState("loading", "Reading the BOM", "get_bom is building the bill of materials.");
  });
  Shell.on("toolInputPartial", () => {
    if (!view.data && !view.busy) showState("loading", "Reading the BOM", "Waiting for the tool's arguments.");
  });
  Shell.on("toolResult", (result) => {
    view.busy = true;
    return loadResult(result);
  });
  Shell.on("toolCancelled", (reason) => {
    if (!view.data) showState("info", "The get_bom call was cancelled", reason || "No result to show.");
  });
  Shell.on("teardown", () => {
    view.closed = true;
    // Nothing more is asked, and no answer is waited for: what was waiting says the view
    // was closed (a BOM being paged is drawn with the lines read, stopped by the closing).
    closeCalls();
    if (view.data && ui.content) {
      renderControls();
      refreshChecks();
      if (ui.nfStatus) ui.nfStatus.textContent = notFittedStatus();
      if (view.tab === "variants") renderVariantsTab();
    } else if (app.firstElementChild && app.firstElementChild.classList.contains("loading")) {
      showState("info", "The view was closed", "It asks the server nothing more, and no BOM was read before it closed.");
    }
  });
  // The host's size changed: whether the details take the table's place may too.
  Shell.on("context", () => {
    if (view.selected && ui.pane) renderPane();
  });

  showState("loading", "Connecting to the host", "");
  Shell.connect({ name: "altium-copilot-kc BOM", version: "1.0.0" })
    .then(() => {
      if (!view.data && !view.busy) showState("loading", "Waiting for get_bom", "The BOM appears when the tool's result arrives.");
    })
    .catch((error) => showState("error", "This view needs a host that shows MCP Apps", error.message));
})();
</script>
</body>
</html>
