    const overlaps = (x, y) => placed.some((box) => x < box.x + box.w + 2 && box.x < x + width + 2 && y < box.y + 18 && box.y < y + 18);
    let x = null;
    let y = null;
    for (const [px_, py_] of spots) {
      const cx = clamp(px_, 2, size.width - width - 2);
      const cy = clamp(py_, 2, size.height - 18);
      if (!overlaps(cx, cy)) {
        x = cx;
        y = cy;
        break;
      }
    }
    if (x === null) {
      ctx.restore();
      return false;
    }
    placed.push({ x, y, w: width });
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, width, 16, 8) : ctx.rect(x, y, width, 16);
    ctx.fill();
    ctx.fillStyle = dark ? "#111111" : "#ffffff";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillText(text, x + 5, y + 8.5);
    ctx.restore();
    return true;
  }

  function drawMarks(ctx, size, px, placed) {
    if (view.cleared) return;
    for (const target of view.targets) {
      if (target.kind !== "mark" || !target.at) continue;
      const { x, y } = target.at;
      const r = 14 * px;
      ctx.strokeStyle = COLORS.mark;
      ctx.lineWidth = 2 * px;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.moveTo(x - r * 1.6, y);
      ctx.lineTo(x - r * 0.4, y);
      ctx.moveTo(x + r * 0.4, y);
      ctx.lineTo(x + r * 1.6, y);
      ctx.moveTo(x, y - r * 1.6);
      ctx.lineTo(x, y - r * 0.4);
      ctx.moveTo(x, y + r * 0.4);
      ctx.lineTo(x, y + r * 1.6);
      ctx.stroke();
      const [sx, sy] = toScreen(x, y, size);
      const off = target.row.on_board === false;
      pill(ctx, size, `${off ? "⚠ " : ""}${target.name}`, sx + 18, sy - 26, off ? "#ff8a3d" : COLORS.mark, placed);
    }
  }

  function drawMeasures(ctx, size, px, placed) {
    if (view.cleared) return;
    for (const target of view.targets) {
      if (target.kind !== "measure" || !target.from || !target.to) continue;
      ctx.strokeStyle = COLORS.measure;
      ctx.lineWidth = 1.5 * px;
      ctx.setLineDash([6 * px, 4 * px]);
      ctx.beginPath();
      ctx.moveTo(target.from.x, target.from.y);
      ctx.lineTo(target.to.x, target.to.y);
      ctx.stroke();
      ctx.setLineDash([]);
      const dx = target.to.x - target.from.x;
      const dy = target.to.y - target.from.y;
      const length = Math.hypot(dx, dy) || 1;
      const nx = -dy / length * 6 * px;
      const ny = dx / length * 6 * px;
      ctx.beginPath();
      for (const end of [target.from, target.to]) {
        ctx.moveTo(end.x - nx, end.y - ny);
        ctx.lineTo(end.x + nx, end.y + ny);
      }
      ctx.stroke();
      const [sx, sy] = toScreen((target.from.x + target.to.x) / 2, (target.from.y + target.to.y) / 2, size);
      pill(ctx, size, `${lengthText(target.distance)}, pad edge to pad edge`, sx + 8, sy + 6, COLORS.measure, placed);
    }
  }

  function drawSelection(ctx, size, px) {
    const item = view.selected;
    if (!item) return;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2 * px;
    if (item.box) {
      const grow = 6 * px;
      ctx.strokeRect(item.box.minx - grow, item.box.miny - grow, item.box.maxx - item.box.minx + 2 * grow, item.box.maxy - item.box.miny + 2 * grow);
    } else if (item.at) {
      ring(ctx, item.at.x, item.at.y, 18 * px, "#ffffff", px);
    }
    if (item.path) {
      ctx.lineWidth = 2.5 * px;
      ctx.stroke(item.path);
    }
  }

  // ---------- gestures: pan, zoom, pinch ----------

  const gesture = { timer: null };
  let drawn = null;  // the view the bitmaps were drawn at: {cx, cy, scale, side}

  /** During a drag, pinch or wheel the last bitmaps are moved and scaled to the new view
   *  (a CSS transform); the full redraw follows after 120 ms at rest. */
  function previewGesture() {
    view.userMoved = true;
    const size = canvasSize();
    if (!size || !drawn || drawn.side !== view.side) {
      scheduleDraw(true);
      return;
    }
    const flip = view.side === "bottom" ? -1 : 1;
    const k = view.scale / drawn.scale;
    const tx = size.width / 2 * (1 - k) + (drawn.cx - view.cx) * view.scale * flip;
    const ty = size.height / 2 * (1 - k) - (drawn.cy - view.cy) * view.scale;
    const transform = `translate(${tx}px, ${ty}px) scale(${k})`;
    ui.base.style.transform = transform;
    ui.over.style.transform = transform;
    clearTimeout(gesture.timer);
    gesture.timer = setTimeout(() => scheduleDraw(true), 120);
  }

  function resetGesture() {
    drawn = { cx: view.cx, cy: view.cy, scale: view.scale, side: view.side };
    if (ui.base) {
      ui.base.style.transform = "";
      ui.over.style.transform = "";
    }
  }

  const pointers = new Map();
  let press = null;

  function onPointerDown(event) {
    if (event.button !== undefined && event.button !== 0) return;
    ui.board.focus({ preventScroll: true });
    ui.over.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, { x: event.offsetX, y: event.offsetY });
    if (pointers.size === 1) press = { x: event.offsetX, y: event.offsetY, moved: false, cx: view.cx, cy: view.cy };
    else press = null;
  }

  function onPointerMove(event) {
    const size = canvasSize();
    if (size && geo !== undefined && view.scale) {
      const [x, y] = toBoard(event.offsetX, event.offsetY, size);
      updateReadout(x, y);
    }
    if (!pointers.has(event.pointerId)) return;
    const before = pointers.get(event.pointerId);
    pointers.set(event.pointerId, { x: event.offsetX, y: event.offsetY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const others = [...pointers.entries()].find(([id]) => id !== event.pointerId);
      const other = others ? others[1] : a;
      const old = Math.hypot(before.x - other.x, before.y - other.y) || 1;
      const now = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      zoomAtQuiet(now / old, (a.x + b.x) / 2, (a.y + b.y) / 2);
      previewGesture();
      updateZoomLabel();
      return;
    }
    if (!press) return;
    const dx = event.offsetX - press.x;
    const dy = event.offsetY - press.y;
    if (!press.moved && Math.hypot(dx, dy) < 3) return;
    press.moved = true;
    ui.board.classList.add("dragging");
    const flip = view.side === "bottom" ? -1 : 1;
    view.cx = press.cx - dx / view.scale * flip;
    view.cy = press.cy + dy / view.scale;
    previewGesture();
  }

  function onPointerUp(event) {
    const was = press;
    pointers.delete(event.pointerId);
    ui.board.classList.remove("dragging");
    if (pointers.size === 0) press = null;
    if (was && !was.moved && event.type === "pointerup") clickAt(event.offsetX, event.offsetY);
    if (was && was.moved) scheduleDraw(true);
  }

  /** Zoom in about the cursor. The double-click's second click does not step the click
   *  cycle on: the first click's selection is put back. */
  function onDoubleClick(event) {
    if (typeof view.cycleBefore === "number") {
      view.cycleIndex = view.cycleBefore;
      view.cycleBefore = null;
      const item = view.cycle[view.cycleIndex];
      if (item) select(selectionOf(item));
    }
    zoomAt(2, event.offsetX, event.offsetY);
  }

  function onWheel(event) {
    const zoomKey = event.ctrlKey || event.metaKey;
    const focused = document.activeElement === ui.board;
    const fullscreen = Shell.context().displayMode === "fullscreen";
    if (!zoomKey && !focused && !fullscreen) {
      // A plain wheel scrolls the conversation: say once how to zoom.
      if (!view.wheelHint) {
        view.wheelHint = true;
        ui.hint.textContent = "Ctrl + wheel to zoom";
        ui.hint.hidden = false;
        setTimeout(() => { ui.hint.hidden = true; }, 2500);
      }
      return;
    }
    event.preventDefault();
    const factor = Math.exp(-clamp(event.deltaY, -120, 120) / 300);
    if (!canvasSize()) return;
    // The last bitmaps are scaled about the cursor, then redrawn at rest.
    zoomAtQuiet(factor, event.offsetX, event.offsetY);
    previewGesture();
    updateZoomLabel();
  }

  function zoomAtQuiet(factor, sx, sy) {
    const size = canvasSize();
    if (!size || !view.scale) return;
    const [bx, by] = toBoard(sx, sy, size);
    const scale = clamp(view.scale * factor, view.fitScale * 0.5, 20);
    const applied = scale / view.scale;
    view.scale = scale;
    view.cx = bx - (bx - view.cx) / applied;
    view.cy = by - (by - view.cy) / applied;
  }

  function onKey(event) {
    if (event.target !== ui.board) return;
    const step = event.shiftKey ? 200 : 60;
    const keys = {
      ArrowLeft: () => pan(step, 0), ArrowRight: () => pan(-step, 0), ArrowUp: () => pan(0, step), ArrowDown: () => pan(0, -step),
      "+": () => zoomAt(1.25), "=": () => zoomAt(1.25), "-": () => zoomAt(0.8), "_": () => zoomAt(0.8),
      "0": fitBoard, h: fitHighlight, H: fitHighlight, f: () => setSide(view.side === "top" ? "bottom" : "top"),
      F: () => setSide(view.side === "top" ? "bottom" : "top"), l: openLayers, L: openLayers,
      n: () => stepTarget(1), N: () => stepTarget(1), p: () => stepTarget(-1), P: () => stepTarget(-1),
      Enter: () => { if (view.selected) openDetails(); else stepTarget(1); },
    };
    if (event.key === "Escape") {
      if (view.selected) {
        event.preventDefault();
        select(null);
      }
      return;
    }
    const action = keys[event.key];
    if (!action || event.ctrlKey || event.metaKey || event.altKey) return;
    event.preventDefault();
    action();
  }

  function openLayers() {
    if (ui.layersBox) {
      view.layersUser = true;
      view.layersSet = true;
      ui.layersBox.open = true;
      const first = ui.layersBox.querySelector("input");
      if (first) first.focus();
    }
  }

  function setSide(side) {
    view.side = side;
    if (ui.sideSwitch) ui.sideSwitch.set(side);
    scheduleDraw(true);
    updateBoardLabel();
    Shell.announce(side === "bottom" ? "Viewed from the bottom, mirrored" : "Viewed from the top");
  }

  // ---------- hit test ----------

  const CELL = 100;  // mil

  /** A uniform grid of the decoded objects on visible layers (built when needed). */
  function buildGrid() {
    const started = performance.now();
    const grid = new Map();
    const add = (minx, miny, maxx, maxy, item) => {
      for (let gx = Math.floor(minx / CELL); gx <= Math.floor(maxx / CELL); gx += 1) {
        for (let gy = Math.floor(miny / CELL); gy <= Math.floor(maxy / CELL); gy += 1) {
          const key = gx * 1000003 + gy;
          let list = grid.get(key);
          if (!list) grid.set(key, list = []);
          list.push(item);
        }
      }
    };
    for (const [layer, list] of geo.pads) {
      if (layer === MULTI ? !view.other.has("multi") : !layerVisible(layer)) continue;
      for (const pad of list) {
        const stack = geo.stacks[pad.stack];
        const r = stack ? Math.max(stack.w, stack.h) / 2 : 5;
        add(pad.x - r, pad.y - r, pad.x + r, pad.y + r, { kind: "pad", layer, pad, r });
      }
    }
    for (const via of geo.vias) {
      if (!viaVisible(via)) continue;
      const type = geo.viatypes[via.type];
      const r = type ? type.d / 2 : 5;
      add(via.x - r, via.y - r, via.x + r, via.y + r, { kind: "via", via, r });
    }
    for (const [layer, list] of geo.tracks) {
      if (!layerVisible(layer)) continue;
      for (const track of list) {
        const pts = track.pts;
        for (let i = 2; i < pts.length; i += 2) {
          add(Math.min(pts[i - 2], pts[i]) - track.w / 2, Math.min(pts[i - 1], pts[i + 1]) - track.w / 2,
              Math.max(pts[i - 2], pts[i]) + track.w / 2, Math.max(pts[i - 1], pts[i + 1]) + track.w / 2,
              { kind: "track", layer, track, i });
        }
      }
    }
    for (const [layer, list] of geo.arcs) {
      if (!layerVisible(layer)) continue;
      for (const arc of list) add(arc.cx - arc.r - arc.w, arc.cy - arc.r - arc.w, arc.cx + arc.r + arc.w, arc.cy + arc.r + arc.w, { kind: "arc", layer, arc });
    }
    const areaBox = (pts) => {
      let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
      for (let i = 0; i < pts.length; i += 2) {
        minx = Math.min(minx, pts[i]); maxx = Math.max(maxx, pts[i]);
        miny = Math.min(miny, pts[i + 1]); maxy = Math.max(maxy, pts[i + 1]);
      }
      return [minx, miny, maxx, maxy];
    };
    for (const [layer, list] of geo.areas) {
      if (!layerVisible(layer)) continue;
      for (const area of list) add(...areaBox(area.rings[0]), { kind: "area", layer, area });
    }
    for (const [layer, list] of geo.pours) {
      if (!layerVisible(layer) || !view.other.has("pours")) continue;
      for (const pour of list) add(...areaBox(pour.pts), { kind: "pour", layer, pour });
    }
    for (const part of geo.parts) {
      if (!part || part.side === 2) continue;
      add(part.minx, part.miny, part.maxx, part.maxy, { kind: "part", part });
    }
    geo.grid = grid;
    view.lastGridMs = performance.now() - started;
  }

  function insideRings(x, y, rings) {
    let inside = false;
    for (const pts of rings) {
      for (let i = 0, j = pts.length - 2; i < pts.length; j = i, i += 2) {
        const xi = pts[i], yi = pts[i + 1], xj = pts[j], yj = pts[j + 1];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
      }
    }
    return inside;
  }

  function segmentDistance(px_, py_, x1, y1, x2, y2) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const t = dx || dy ? clamp(((px_ - x1) * dx + (py_ - y1) * dy) / (dx * dx + dy * dy), 0, 1) : 0;
    return Math.hypot(px_ - (x1 + t * dx), py_ - (y1 + t * dy));
  }

  const PRIORITY = { pad: 0, via: 1, track: 2, arc: 2, area: 3, pour: 3, part: 4 };

  /** The objects under a point, nearest kind first (pad, via, track or arc, area or pour,
   *  part box), within 3 px. */
  function hitTest(x, y) {
    if (!geo) return [];
    if (!geo.grid) buildGrid();
    const tolerance = 3 / view.scale;
    const seen = new Set();
    const hits = [];
    for (let gx = Math.floor((x - tolerance) / CELL); gx <= Math.floor((x + tolerance) / CELL); gx += 1) {
      for (let gy = Math.floor((y - tolerance) / CELL); gy <= Math.floor((y + tolerance) / CELL); gy += 1) {
        for (const item of geo.grid.get(gx * 1000003 + gy) || []) {
          if (seen.has(item)) continue;
          seen.add(item);
          let hit = false;
          if (item.kind === "pad") {
            hit = padContains(geo.stacks[item.pad.stack], x - item.pad.x, y - item.pad.y, tolerance);
          } else if (item.kind === "via") {
            hit = Math.hypot(x - item.via.x, y - item.via.y) <= item.r + tolerance;
          } else if (item.kind === "track") {
            const pts = item.track.pts;
            hit = segmentDistance(x, y, pts[item.i - 2], pts[item.i - 1], pts[item.i], pts[item.i + 1]) <= item.track.w / 2 + tolerance;
          } else if (item.kind === "arc") {
            const arc = item.arc;
            const distance = Math.abs(Math.hypot(x - arc.cx, y - arc.cy) - arc.r);
            let angle = Math.atan2(y - arc.cy, x - arc.cx) * 180 / Math.PI - arc.a0;
            angle = ((angle % 360) + 360) % 360;
            hit = distance <= arc.w / 2 + tolerance && angle <= arc.sweep + 1e-6;
          } else if (item.kind === "area") {
            hit = insideRings(x, y, item.area.rings);
          } else if (item.kind === "pour") {
            hit = insideRings(x, y, [item.pour.pts]);
          } else if (item.kind === "part") {
            const part = item.part;
            hit = x >= part.minx - tolerance && x <= part.maxx + tolerance && y >= part.miny - tolerance && y <= part.maxy + tolerance;
          }
          if (hit) hits.push(item);
        }
      }
    }
    const merged = [];
    const keys = new Set();
    for (const item of hits) {
      const key = hitKey(item);
      if (keys.has(key)) continue;
      keys.add(key);
      merged.push(item);
    }
    // The nearest kind first; within a kind, the object whose centre is nearest (a fine-
    // pitch pad before the neighbour whose copper the click only grazes).
    const centre = (item) => {
      const at = item.pad || item.via || (item.part ? { x: (item.part.minx + item.part.maxx) / 2, y: (item.part.miny + item.part.maxy) / 2 } : null);
      return at ? Math.hypot(x - at.x, y - at.y) : 0;
    };
    return merged.sort((a, b) => PRIORITY[a.kind] - PRIORITY[b.kind] || centre(a) - centre(b));
  }

  /** The object a hit is on (a track's segments are one object). */
  function hitKey(item) {
    return item.track || item.pad || item.via || item.arc || item.area || item.pour || item.part || item;
  }

  /** Whether a point (dx, dy from the pad's centre, in mil) lies on a pad stack's copper,
   *  within tolerance: its shape (round or obround, rectangle, rounded rectangle,
   *  octagon) turned by its rotation. */
  function padContains(stack, dx, dy, tolerance) {
    if (!stack) return Math.hypot(dx, dy) <= 5 + tolerance;
    const angle = -(stack.rot || 0) * Math.PI / 180;
    const x = Math.abs(dx * Math.cos(angle) - dy * Math.sin(angle));
    const y = Math.abs(dx * Math.sin(angle) + dy * Math.cos(angle));
    const w = stack.w / 2;
    const h = stack.h / 2;
    if (stack.shape === 2) return x <= w + tolerance && y <= h + tolerance;
    if (stack.shape === 3) {
      const c = Math.min(stack.w, stack.h) / 4;
      return x <= w + tolerance && y <= h + tolerance && x + y <= w + h - c + tolerance * Math.SQRT2;
    }
    // Round, obround and rounded rectangles: a rectangle shrunk by the corner radius,
    // grown again by it (round and obround pads have half the short side as radius).
    const r = stack.shape === 9 ? Math.max(0, Math.min(stack.corner || 0, w, h)) : Math.min(w, h);
    const ox = Math.max(0, x - (w - r));
    const oy = Math.max(0, y - (h - r));
    return Math.hypot(ox, oy) <= r + tolerance;
  }

  /** Forget the click cycle (the view, the side or the shown layers changed). */
  function resetCycle() {
    view.cycle = [];
    view.cycleAt = null;
    view.cycleIndex = 0;
  }

  function clickAt(sx, sy) {
    const size = canvasSize();
    if (!size || !view.scale) return;
    const [x, y] = toBoard(sx, sy, size);
    const started = performance.now();
    const hits = hitTest(x, y);
    view.lastHitMs = performance.now() - started;
    // Repeated clicks on the same spot cycle through the objects there: the same screen
    // spot, under the same view (zoom, pan, side), finding the same objects.
    const where = `${view.cx}|${view.cy}|${view.scale}|${view.side}`;
    const same = view.cycleAt && view.cycleAt.where === where &&
      Math.hypot(view.cycleAt.sx - sx, view.cycleAt.sy - sy) <= 3 &&
      view.cycle.length === hits.length && view.cycle.every((item, index) => hitKey(item) === hitKey(hits[index]));
    // A double-click's second click puts back the first's selection (onDoubleClick).
    view.cycleBefore = same ? view.cycleIndex : null;
    view.cycle = hits;
    view.cycleIndex = same ? (view.cycleIndex + 1) % Math.max(hits.length, 1) : 0;
    view.cycleAt = { sx, sy, where };
    const item = view.cycle[view.cycleIndex];
    if (item) select(selectionOf(item));
    else if (geo && insideBoard(x, y)) select({ kind: "board", at: { x, y }, name: "the board" });
    else select(null);
  }

  function insideBoard(x, y) {
    if (geo && geo.outline) return insideRings(x, y, [geo.outline]);
    const extents = boardBox();
    return extents && x >= extents.minx && x <= extents.maxx && y >= extents.miny && y <= extents.maxy;
  }

  /** A selection from a hit: what it is, its name, box and path for the outline. */
  function selectionOf(item) {
    if (item.kind === "pad") {
      const pad = item.pad;
      const stack = geo.stacks[pad.stack];
      const path = new Path2D();
      path.addPath(stackPath(pad.stack, false), new DOMMatrix([1, 0, 0, 1, pad.x, pad.y]));
      const part = geo.parts[pad.part];
      return { kind: "pad", name: `${part ? part.name : "?"}-${pad.pin}`, pad, layer: item.layer, stack, path, at: { x: pad.x, y: pad.y } };
    }
    if (item.kind === "via") {
      return { kind: "via", name: "Via", via: item.via, at: { x: item.via.x, y: item.via.y } };
    }
    if (item.kind === "track") {
      const path = new Path2D();
      polyPath(path, item.track.pts);
      return { kind: "track", name: "Track", track: item.track, layer: item.layer, path, at: { x: item.track.pts[item.i], y: item.track.pts[item.i + 1] } };
    }
    if (item.kind === "arc") {
      const path = new Path2D();
      arcPath(path, item.arc);
      return { kind: "arc", name: "Arc", arc: item.arc, layer: item.layer, path, at: { x: item.arc.cx, y: item.arc.cy } };
    }
    if (item.kind === "area" || item.kind === "pour") {
      const path = new Path2D();
      for (const pts of item.kind === "area" ? item.area.rings : [item.pour.pts]) ringPath(path, pts);
      return { kind: item.kind, name: item.kind === "area" ? "Copper area" : "Pour", area: item.area, pour: item.pour, layer: item.layer, path };
    }
    const part = item.part;
    return { kind: "part", name: part.name, part, box: { minx: part.minx, miny: part.miny, maxx: part.maxx, maxy: part.maxy } };
  }

  // ---------- selection, targets, details ----------

  function select(item) {
    view.selected = item;
    view.asked = [];
    if (!item) view.solo = false;
    scheduleDraw(false);
    renderPane();
    if (item) Shell.announce(`Selected ${item.kind} ${item.name || ""}`.trim());
  }

  function openDetails() {
    if (!view.selected) return;
    if (compactHost()) {
      view.solo = true;
      renderLayout();
      renderPane();  // its Close reads Back
    }
    const heading = ui.pane && ui.pane.querySelector("h2");
    if (heading) {
      heading.setAttribute("tabindex", "-1");
      heading.focus();
    }
  }

  function closeDetails() {
    const wasIn = ui.pane && ui.pane.contains(document.activeElement);
    view.solo = false;
    select(null);
    renderLayout();
    if (wasIn && ui.board) ui.board.focus();
  }

  /** Zoom to a text target (net, part, pad, mark, measure), select it, announce. */
  function goTo(target) {
    let targetBox = target.box || null;
    if (target.kind === "measure" && target.from && target.to) {
      targetBox = { minx: Math.min(target.from.x, target.to.x), miny: Math.min(target.from.y, target.to.y),
                    maxx: Math.max(target.from.x, target.to.x), maxy: Math.max(target.from.y, target.to.y) };
    } else if (!targetBox && target.at) {
      targetBox = { minx: target.at.x - 40, miny: target.at.y - 40, maxx: target.at.x + 40, maxy: target.at.y + 40 };
    }
    if (targetBox) {
      const grow = Math.max(targetBox.maxx - targetBox.minx, targetBox.maxy - targetBox.miny) * 0.3 + 30;
      fitBox({ minx: targetBox.minx - grow, miny: targetBox.miny - grow, maxx: targetBox.maxx + grow, maxy: targetBox.maxy + grow });
    }
    const pad = target.kind === "pad" ? findPad(target.name, target.at) : null;
    select({ ...target, box: targetBox && target.kind !== "mark" && target.kind !== "pad" ? targetBox : null,
             at: target.at || null, path: pad ? selectionOf({ kind: "pad", pad: pad.pad, layer: pad.layer }).path : null });
    Shell.announce(`${target.kind} ${target.name}${target.row && target.row.where ? `, ${target.row.where}` : ""}`);
  }

  function stepTarget(direction) {
    const list = view.targets.filter((target) => target.kind !== "notfound");
    if (!list.length) return;
    view.stepAt = (view.stepAt + direction + list.length) % list.length;
    goTo(list[view.stepAt]);
  }

  function highlightBox() {
    let out = null;
    const take = (b) => {
      if (!b) return;
      out = out ? { minx: Math.min(out.minx, b.minx), miny: Math.min(out.miny, b.miny), maxx: Math.max(out.maxx, b.maxx), maxy: Math.max(out.maxy, b.maxy) } : { ...b };
    };
    if (!view.cleared) {
      for (const target of view.targets) {
        take(target.box);
        if (target.at) take({ minx: target.at.x, miny: target.at.y, maxx: target.at.x, maxy: target.at.y });
        if (target.from) take({ minx: target.from.x, miny: target.from.y, maxx: target.from.x, maxy: target.from.y });
        if (target.to) take({ minx: target.to.x, miny: target.to.y, maxx: target.to.x, maxy: target.to.y });
      }
    }
    if (geo) {
      for (const index of view.local.parts) {
        const part = geo.parts[index];
        if (part) take({ minx: part.minx, miny: part.miny, maxx: part.maxx, maxy: part.maxy });
      }
      for (const id of view.local.nets) take(netExtents(id));
    }
    if (!out) return null;
    const grow = Math.max((out.maxx - out.minx) * 0.075, 50);
    const growY = Math.max((out.maxy - out.miny) * 0.075, 50);
    return { minx: out.minx - grow, miny: out.miny - growY, maxx: out.maxx + grow, maxy: out.maxy + growY };
  }

  /** A net's extents in the geometry read so far (its copper on every layer, and vias). */
  function netExtents(id) {
    if (!geo) return null;
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    const take = (x0, y0, x1, y1) => {
      minx = Math.min(minx, x0); miny = Math.min(miny, y0); maxx = Math.max(maxx, x1); maxy = Math.max(maxy, y1);
    };
    const takeRing = (pts) => {
      for (let i = 0; i < pts.length; i += 2) take(pts[i], pts[i + 1], pts[i], pts[i + 1]);
    };
    for (const layerMap of geo.byNet.values()) {
      const own = layerMap.get(id);
      if (!own) continue;
      for (const track of [...own.tracks, ...own.pouredTracks]) takeRing(track.pts);
      for (const arc of [...own.arcs, ...own.pouredArcs]) take(arc.cx - arc.r, arc.cy - arc.r, arc.cx + arc.r, arc.cy + arc.r);
      for (const area of [...own.areas, ...own.pouredAreas]) takeRing(area.rings[0]);
      for (const pour of own.pours) takeRing(pour.pts);
      for (const pad of own.pads) {
        const stack = geo.stacks[pad.stack];
        const r = stack ? Math.max(stack.w, stack.h) / 2 : 5;
        take(pad.x - r, pad.y - r, pad.x + r, pad.y + r);
      }
    }
    for (const via of geo.vias) if (via.net === id) take(via.x, via.y, via.x, via.y);
    return minx <= maxx ? { minx, miny, maxx, maxy } : null;
  }

  /** A short message of the view's own (find box, Reload, full screen), shown with the
   *  notices until dismissed or replaced by the next of its kind. */
  function message(key, kind, text) {
    if (!view.messages) view.messages = new Map();
    if (text) view.messages.set(key, { kind, text });
    else view.messages.delete(key);
    renderNotices();
  }

  /** The find box: a net or part highlighted in the view (no call), zoomed to. */
  function find(text) {
    const query = String(text || "").trim();
    if (!query) return;
    if (!geo) {
      message("find", "info", canCall() && !view.closed
        ? `The find box needs the board's geometry, which is still being read: try ${query} again in a moment.`
        : `The find box needs the board's geometry, which this view could not read: ask Claude where ${query} is.`);
      return;
    }
    const lower = query.toLowerCase();
    let netId = geo.netIndex.get(query);
    if (netId === undefined) netId = geo.nets.findIndex((name) => name && name.toLowerCase() === lower);
    let starting = [];
    if (netId < 0) {
      starting = geo.nets.map((name, id) => [name, id]).filter(([name]) => name && name.toLowerCase().startsWith(lower));
      if (starting.length === 1) netId = starting[0][1];
    }
    // The view's own highlight adds to what is shown; the text's stays as Clear left it.
    const parts = partsNamed(query).filter((index) => geo.parts[index]);
    if (parts.length) {
      for (const index of parts) view.local.parts.add(index);
      const part = geo.parts[parts[0]];
      const others = parts.length > 1 ? ` (${plural(parts.length, "instance")})` : "";
      message("find", "info", `Part ${part.name}${others} highlighted in the view.`);
      goTo({ kind: "part", name: part.name, box: { minx: part.minx, miny: part.miny, maxx: part.maxx, maxy: part.maxy }, row: { where: "highlighted in the view" } });
    } else if (netId >= 0) {
      view.local.nets.add(netId);
      const extents = netExtents(netId);
      message("find", "info", `Net ${geo.nets[netId]} highlighted in the view${extents ? "" : " (no copper of it in the pages read)"}.`);
      if (extents) {
        const grow = Math.max(extents.maxx - extents.minx, extents.maxy - extents.miny) * 0.15 + 40;
        fitBox({ minx: extents.minx - grow, miny: extents.miny - grow, maxx: extents.maxx + grow, maxy: extents.maxy + grow });
      }
      Shell.announce(`Net ${geo.nets[netId]} highlighted in the view`);
    } else if (starting.length > 1) {
      message("find", "info", `${plural(starting.length, "net")} start with ${query}: type more of the name (${starting.slice(0, 5).map(([name]) => name).join(", ")}${starting.length > 5 ? ", …" : ""}).`);
    } else {
      message("find", "info", `No net or part named ${query} on this board (the find box looks in the geometry read so far).`);
    }
    scheduleDraw(false);
    renderObjects();
  }

  function clearHighlight() {
    view.cleared = true;
    view.local = { nets: new Set(), parts: new Set() };
    scheduleDraw(false);
    Shell.announce("Highlight cleared");
    if (view.messages && view.messages.has("find")) message("find", null);
    renderObjects();
  }

  // ---------- details pane ----------

  function renderPane() {
    if (ui.pane && view.data) Shell.keepFocus(ui.pane, drawPane, () => ui.board);
  }

  /** The geometry's part a selection is of (a part, or a pad's part), else null. */
  function selectedPart(item) {
    if (!geo) return null;
    if (item.part && typeof item.part.index === "number") return item.part;
    const pad = item.pad || (item.kind === "pad" ? (findPad(item.name, item.at) || {}).pad : null);
    if (pad && pad.part >= 0) return geo.parts[pad.part] || null;
    if (item.kind === "part") {
      const list = item.row ? partsOf(item) : partsNamed(item.name);
      return list.length ? geo.parts[list[0]] : null;
    }
    return null;
  }

  function serverButtons(item) {
    const units = view.units;
    const calls = [];
    const owner = selectedPart(item);
    const designator = owner ? owner.name : item.kind === "part" ? item.name
      : item.kind === "pad" ? item.name.slice(0, item.name.lastIndexOf("-")) : null;
    let net = null;
    if (item.kind === "net") net = item.name;
    else if (geo && item.pad) net = geo.nets[item.pad.net];
    else if (geo && item.via) net = geo.nets[item.via.net];
    else if (geo && item.track) net = geo.nets[item.track.net];
    else if (geo && item.arc) net = geo.nets[item.arc.net];
    else if (geo && (item.area || item.pour)) net = geo.nets[(item.area || item.pour).net];
    else if (item.row && typeof item.row.net === "string") net = item.row.net;
    if (designator) {
      calls.push(["get_component_placement", { refdes: designator, units }, `Placement of ${designator}`]);
      // get_component takes the schematic designator (a channel's U3A, not the board's U3).
      const sch = owner && geo.sch[String(owner.index)];
      const refdes = (item.row && item.row.sch_refdes) || sch || designator;
      calls.push(["get_component", { refdes }, `Part ${refdes}`]);
    }
    if (net) calls.push(["get_net_pcb", { net, units }, `Net ${net} on the board`]);
    const at = item.at || (item.box ? { x: (item.box.minx + item.box.maxx) / 2, y: (item.box.miny + item.box.maxy) / 2 } : null);
    if (at) {
      const digits = units === "mm" ? 3 : 1;
      calls.push(["query_pcb_region", { x: round(fromMil(at.x, units), digits), y: round(fromMil(at.y, units), digits), units },
                  `Around ${pointText(at.x, at.y)}`]);
    }
    return calls;
  }

  function itemFacts(item) {
    const pairs = [];
    const where = (x, y) => `${pointText(x, y)} (absolute); ${fromOriginText(x, y)} from the origin`;
    if (item.kind === "pad" && item.pad && geo) {
      const stack = item.stack || geo.stacks[item.pad.stack] || {};
      pairs.push(["Pad", item.name], ["Net", geo.nets[item.pad.net] || "no net"], ["Layer", layerName(item.layer)],
                 ["Shape", `${SHAPE_NAME[String(stack.shape)] || "pad"} ${lengthText(stack.w)} × ${lengthText(stack.h)}${stack.rot ? `, ${round(stack.rot, 2)}°` : ""}`],
                 ["Hole", stack.hole > 0 ? `${HOLE_NAME[String(stack.holeShape)] || "round"} ${lengthText(stack.hole)}${stack.slot > 0 ? `, slot ${lengthText(stack.slot)}` : ""}` : "none"],
                 ["At", where(item.pad.x, item.pad.y)]);
    } else if (item.kind === "via" && geo) {
      const type = geo.viatypes[item.via.type] || {};
      pairs.push(["Net", geo.nets[item.via.net] || "no net"], ["Span", `${layerName(type.from)} to ${layerName(type.to)}`],
                 ["Diameter", lengthText(type.d || 0)], ["Hole", lengthText(type.hole || 0)], ["At", where(item.via.x, item.via.y)]);
    } else if (item.kind === "track" && geo) {
      const pts = item.track.pts;
      let total = 0;
      for (let i = 2; i < pts.length; i += 2) total += Math.hypot(pts[i] - pts[i - 2], pts[i + 1] - pts[i - 1]);
      pairs.push(["Net", geo.nets[item.track.net] || "no net"], ["Layer", layerName(item.layer)], ["Width", lengthText(item.track.w)],
                 ["Chain length", `${lengthText(total)} (${plural(pts.length / 2 - 1, "segment")} joined end to end)`]);
    } else if (item.kind === "arc" && geo) {
      pairs.push(["Net", geo.nets[item.arc.net] || "no net"], ["Layer", layerName(item.layer)], ["Width", lengthText(item.arc.w)],
                 ["Radius", lengthText(item.arc.r)], ["Sweep", `${round(item.arc.sweep, 2)}°`]);
    } else if ((item.kind === "area" || item.kind === "pour") && geo) {
      const object = item.area || item.pour;
      pairs.push(["Net", geo.nets[object.net] || "no net"], ["Layer", layerName(item.layer)],
                 ["Kind", item.kind === "area" ? "free copper region or fill" : ["solid pour", "hatched pour", "pour (outline only)"][object.style] || "pour"]);
    } else if (item.kind === "part" && item.part && geo) {
      const part = item.part;
      const pads = [...geo.pads.values()].reduce((sum, list) => sum + list.filter((pad) => pad.part === part.index).length, 0);
      pairs.push(["Designator", part.name], ["Schematic", geo.sch[String(part.index)]], ["Side", ["top", "bottom", "not placed"][part.side]],
                 ["Rotation", `${round(part.rot, 2)}°`], ["Pads", String(pads)], ["Not Fitted", geo.dnp.has(part.index) ? `yes, in variant ${geo.variant}` : "no"],
                 ["At", part.side === 2 ? "not placed" : where(...partAt(part))]);
    } else if (item.kind === "board") {
      pairs.push(["At", where(item.at.x, item.at.y)]);
    } else if (item.row) {
      const row = item.row;
      if (item.kind === "net") {
        pairs.push(["Net", row.net], ["Layers", (row.layers || []).join(", ") || "none routed"],
                   ["Copper", `${plural(row.pads, "pad")}, ${plural(row.vias, "via")}, ${plural(row.tracks, "track")}, ${plural(row.arcs, "arc")}, ${plural(row.areas, "area")}, ${plural(row.pours, "pour")}`],
                   ["Parts", `${(row.parts || []).join(", ")}${row.parts_total > (row.parts || []).length ? ` (${row.parts.length} of ${row.parts_total})` : ""}`],
                   ["Where", row.where]);
      } else if (item.kind === "part") {
        const at = point(unitKey(row, "at"));
        const origin = point(unitKey(row, "from_origin"));
        pairs.push(["Designator", row.designator], ["Schematic", row.sch_refdes], ["Side", row.side], ["Rotation", row.rotation === null ? null : `${row.rotation}°`],
                   ["Pads", String(row.pads)], ["Not Fitted", row.dnp ? "yes" : "no"], ["At", at ? pointText(at.x, at.y) + " (absolute)" : "not placed"],
                   ["From origin", origin ? pointText(origin.x, origin.y) : null], ["Where", row.where]);
      } else if (item.kind === "pad") {
        const at = point(unitKey(row, "at"));
        pairs.push(["Pad", row.pad], ["Net", row.net || "no net"], ["Layer", row.layer], ["At", at ? where(at.x, at.y) : null], ["Where", row.where]);
      } else if (item.kind === "mark") {
        const at = point(unitKey(row, "at"));
        const origin = point(unitKey(row, "from_origin"));
        pairs.push(["Mark", row.label], ["At", at ? pointText(at.x, at.y) + " (absolute)" : null],
                   ["From origin", origin ? pointText(origin.x, origin.y) : null], ["Layer", row.layer], ["On the board", row.on_board ? "yes" : "no"],
                   ["Frame", row.frame_hint], ["Nets near", (row.near && row.near.nets || []).join(", ") || "none"],
                   ["Parts near", (row.near && row.near.parts || []).join(", ") || "none"], ["Where", row.where]);
      } else if (item.kind === "measure") {
        pairs.push(["From", row.from_pad], ["To", row.to_pad], ["Distance", `${lengthText(item.distance)}`], ["Net", row.net], ["Basis", row.basis]);
      } else if (item.kind === "notfound") {
        pairs.push(["Asked", row.asked], ["Kind", row.kind], ["Why", row.why], ["Suggestions", (row.suggestions || []).join(", ")], ["From", row.from]);
      } else if (item.kind === "finding") {
        pairs.push(["Finding", `${row.finding} of ${row.tool || "an unnamed tool"}`], ["Frame", row.frame],
                   ["Read", (row.read || []).join(", ") || "nothing"], ["Not placed", (row.ignored || []).join(", ")],
                   ["Marks", String(row.marks)]);
      }
    }
    return pairs;
  }

  function answer(tool, args, title) {
    const entry = details.get(tool, args);
    const head = el("h3", { text: `${title} (${tool}: ${argsText(args)})` });
    if (!entry || entry.loading) return [head, el("p", { class: "muted", text: `Asking ${tool}…` })];
    if (entry.error) {
      return [head, el("div", { class: "notice error" }, el("span", { class: "grow", text: entry.error }),
        el("button", { type: "button", class: "btn-link", text: "Retry", on: { click: () => ask(tool, args, title) } }))];
    }
    let json;
    try {
      json = Shell.resultJson(entry.data);
    } catch (error) {
      return [head, el("div", { class: "notice warning", text: error.message })];
    }
    if (json.error) return [head, el("div", { class: "notice warning", text: json.message || json.error })];
    return [head, summary(tool, json), el("details", { class: "more" }, el("summary", { text: "The whole answer" }),
      el("pre", { class: "text", text: JSON.stringify(json, null, 1).slice(0, 6000) }))];
  }

  function summary(tool, json) {
    const units = unitsOf(json.units ? json : view.data);
    if (tool === "get_component_placement") {
      return el("ul", { class: "small-list" }, (json.instances || []).map((instance) => el("li", {
        text: `${instance.refdes}${instance.sch_refdes && instance.sch_refdes !== instance.refdes ? ` (${instance.sch_refdes})` : ""}: ${instance.side}, ${instance.rotation}°, ${plural((instance.pins || []).length, "pin")}${instance.dnp ? ", Not Fitted" : ""}; nearest ${(instance.nearest_components || []).slice(0, 4).map((item) => item.refdes).join(", ")}` })));
    }
    if (tool === "get_component") {
      return Shell.facts([["Description", json.description], ["Value", json.value], ["MPN", json.mpn], ["Sheet", json.sheet],
                          ["Fitted", json.dnp ? "no (DNP in the active variant)" : "yes"], ["Pins", json.pins ? String(Object.keys(json.pins).length) : null]]);
    }
    if (tool === "get_net_pcb") {
      return Shell.facts([["Layers", (json.layers || []).map((layer) => layer.layer).join(", ")], ["Pads", json.pad_count === undefined ? null : String(json.pad_count)],
                          ["Vias", json.via_count === undefined ? null : String(json.via_count)], ["Pours", json.pour_count === undefined ? null : String(json.pour_count)],
                          ["Classes", (json.net_classes || []).join(", ")], ["Matches", json.match_count ? String(json.match_count) : null]]);
    }
    if (tool === "query_pcb_region") {
      return Shell.facts([["Nets", (json.nets || []).map((item) => item.net).join(", ") || "none"],
                          ["Parts", (json.components || []).map((item) => item.refdes).join(", ") || "none"],
                          ["Pours", (json.pours || []).map((item) => `${item.net || "no net"} on ${item.layer}`).join(", ") || "none"],
                          ["Radius", `50 mil (${units === "mm" ? "1.27 mm" : "the default"})`]]);
    }
    return el("p", { class: "muted", text: "Answered." });
  }

  function drawPane() {
    clear(ui.pane);
    const item = view.selected;
    ui.pane.classList.toggle("idle", !item);
    if (!item) {
      Shell.append(ui.pane, [
        el("h2", { text: "Select an object" }),
        el("p", { class: "help", text: `Coordinates: ${view.data.frame}.` }),
        el("p", { class: "help", text: "Click the board (or a row of the Objects or Parts tab) for a pad, via, track, arc, area, pour or part: its net, layer, size and position. Repeated clicks on one spot step through what lies there." }),
        el("p", { class: "help", text: KEY_HELP }),
        el("p", { class: "help", text: view.closed ? "The view was closed: it asks the server nothing more." : canCall() ? "Its buttons ask get_component_placement, get_component, get_net_pcb and query_pcb_region." : "This host does not let the view call tools: ask Claude in the conversation for details." }),
      ]);
      return;
    }
    const calls = serverButtons(item);
    Shell.append(ui.pane, [
      el("div", { class: "row" }, el("h2", { text: `${item.kind === "notfound" ? "Not found" : item.kind}: ${item.name || ""}` }),
        el("button", { type: "button", class: "btn", text: view.solo ? "Back" : "Close", on: { click: closeDetails } })),
      Shell.facts(itemFacts(item), "facts section-gap"),
      !["notfound", "finding", "measure", "mark", "board"].includes(item.kind) ? el("div", { class: "btn-row section-gap" },
        netOf(item) !== null ? el("button", { type: "button", class: "btn", text: "Highlight this net", on: { click: () => highlightNet(netOf(item)) } }) : null,
        partOf(item) !== null ? el("button", { type: "button", class: "btn", text: "Highlight this part", on: { click: () => highlightPart(partOf(item)) } }) : null) : null,
      calls.length ? [el("h3", { text: "From the server" }), canCall() && !view.closed
        ? [el("div", { class: "btn-row" }, calls.map(([tool, args, label]) => el("button", { type: "button", class: "btn", text: label,
            title: `Ask ${tool} (${argsText(args)})`, on: { click: () => ask(tool, args, label) } }))),
           ...view.asked.map(([tool, args, label]) => answer(tool, args, label))]
        : [el("p", { class: "muted", text: view.closed
            ? "The view was closed: it asks the server nothing more. Ask Claude in the conversation for the details."
            : "This host does not let the view call the server's tools: ask Claude in the conversation for the details." }),
           ...view.asked.filter(([tool, args]) => { const entry = details.get(tool, args); return entry && entry.data; })
             .map(([tool, args, label]) => answer(tool, args, label))]] : null,
    ]);
  }

  function netOf(item) {
    if (!geo) return null;
    const object = item.pad || item.via || item.track || item.arc || item.area || item.pour;
    if (object && object.net >= 0) return object.net;
    if (item.kind === "net") {
      const id = geo.netIndex.get(item.name);
      return id === undefined ? null : id;
    }
    return null;
  }

  function partOf(item) {
    const part = selectedPart(item);
    return part ? part.index : null;
  }

  function highlightNet(id) {
    view.local.nets.add(id);
    scheduleDraw(false);
    Shell.announce(`Net ${geo.nets[id]} highlighted in the view`);
    renderObjects();
  }

  function highlightPart(index) {
    view.local.parts.add(index);
    scheduleDraw(false);
    Shell.announce(`Part ${geo.parts[index].name} highlighted in the view`);
    renderObjects();
  }

  // ---------- tables ----------

  function objectRows() {
    const rows = [];
    for (const target of view.targets) {
      const row = target.row;
      let layers = "";
      let where = row.where || "";
      let distance = "";
      let status = "found";
      let colour = "";
      if (target.kind === "net") {
        layers = (row.layers || []).join(", ");
        colour = haloName(target.color);
      }
      if (target.kind === "part") {
        layers = row.side;
        status = row.dnp ? "Not Fitted" : "found";
      }
      if (target.kind === "pad") layers = row.layer;
      if (target.kind === "mark") {
        layers = row.layer || "";
        status = row.on_board === false ? (row.frame_hint ? `outside board, ${row.frame_hint}` : "outside board") : "on board";
      }
      if (target.kind === "measure") {
        layers = row.net || "";
        distance = lengthText(target.distance);
      }
      const at = target.at || (target.box ? { x: (target.box.minx + target.box.maxx) / 2, y: (target.box.miny + target.box.maxy) / 2 } : null);
      if (at) where = `${where}; ${fromOriginText(at.x, at.y)} from origin`;
      rows.push({ id: rows.length, target, kind: target.kind, name: target.name, layers, where, distance, status, colour, from: row.from });
    }
    for (const row of view.data.highlight.findings) {
      rows.push({ id: rows.length, target: { kind: "finding", name: `Finding ${row.finding}`, row }, kind: "finding",
                  name: `Finding ${row.finding}${row.tool ? ` (${row.tool})` : ""}`, layers: row.frame,
                  where: `read ${(row.read || []).join(", ") || "nothing"}${(row.ignored || []).length ? `; not placed: ${row.ignored.join(", ")}` : ""}`,
                  distance: "", status: plural(row.marks, "mark"), from: "asked" });
    }
    for (const row of view.data.highlight.not_found) {
      rows.push({ id: rows.length, target: { kind: "notfound", name: row.asked, row }, kind: "not found", name: row.asked,
                  layers: row.kind, where: row.why, distance: "", status: (row.suggestions || []).length ? `not found; try ${row.suggestions.join(", ")}` : "not found", from: row.from || "asked" });
    }
    if (geo) {
      for (const id of view.local.nets) {
        const extents = netExtents(id);
        rows.push({ id: rows.length, target: { kind: "net", name: geo.nets[id], box: extents, local: true, row: { where: "highlighted in the view" } },
                    kind: "net", name: geo.nets[id], layers: "", where: "highlighted in the view", distance: "", status: "found",
                    colour: haloName(netColor(id)), from: "the view" });
      }
      for (const index of view.local.parts) {
        const part = geo.parts[index];
        if (!part) continue;
        rows.push({ id: rows.length, target: { kind: "part", name: part.name, part, box: { minx: part.minx, miny: part.miny, maxx: part.maxx, maxy: part.maxy }, row: { where: "highlighted in the view" } },
                    kind: "part", name: part.name, layers: ["top", "bottom", "not placed"][part.side], where: `highlighted in the view; ${fromOriginText(...partAt(part))} from origin`,
                    distance: "", status: geo.dnp.has(part.index) ? "Not Fitted" : "found", colour: "", from: "the view" });
      }
    }
    return rows;
  }

  const KIND_TOTAL = { net: "nets", part: "parts", pad: "pads", mark: "marks", measure: "measures", finding: "findings",
                       "not found": "not_found" };

  function renderObjects() {
    updateObjectsLabel();
    if (view.tab !== "objects" || !ui.content) return;
    renderTab();
  }

  /** The Objects tab's count: the rows it lists. */
  function updateObjectsLabel() {
    const tab = ui.tabBar && ui.tabBar.el.querySelectorAll('[role="tab"]')[1];
    if (tab && view.data) tab.textContent = `Objects (${objectRows().length})`;
  }

  function objectsTable() {
    const h = view.data.highlight;
    return Shell.table({
      label: "Highlighted objects", rows: objectRows(), rowKey: (row) => row.id,
      onActivate: (row) => {
        if (row.target.kind === "notfound" || row.target.kind === "finding") select({ ...row.target });
        else goTo(row.target);
        openDetails();
      },
      empty: "get_board_view highlighted nothing.",
      group: {
        key: (row) => row.kind,
        label: (key) => key,
        count: (key, rows) => {
          const total = h[`${KIND_TOTAL[key]}_total`];
          // The server's totals are exact: a list it cut short shows "N of M".
          const text = typeof total === "number" && total > rows.length ? `${rows.length} of ${total}` : String(rows.length);
          return el("span", { class: "badge", text });
        },
        order: (a, b) => Object.keys(KIND_TOTAL).indexOf(a) - Object.keys(KIND_TOTAL).indexOf(b),
      },
      columns: [
        { key: "kind", label: "Kind", hidden: true },
        { key: "name", label: "Name", cls: "c-name" },
        { key: "layers", label: "Layers or side", cls: "c-name" },
        { key: "where", label: `Where (from origin, ${view.units})`, cls: "c-msg" },
        { key: "distance", label: "Distance" },
        { key: "status", label: "Status", cls: "c-name" },
        { key: "colour", label: "Halo", hidden: !view.targets.some((target) => target.kind === "net") && !view.local.nets.size },
        { key: "from", label: "From", hidden: true },
      ],
    });
  }

  /** A part's position: the text's own (exact) when the text names this part, else the
   *  geometry's (on the 0.1 mil grid), so a part shows one position everywhere. */
  function partAt(part) {
    for (const target of view.targets || []) {
      if (target.kind === "part" && target.at && partsOf(target).includes(part.index) && partsOf(target).length === 1) {
        return [target.at.x, target.at.y];
      }
    }
    return [part.x, part.y];
  }

  function partsTable() {
    if (!geo) {
      const why = view.closed ? "The view was closed before the board's geometry arrived."
        : view.stopReason ? `The board's geometry could not be read: ${view.stopReason.replace(/\.$/, "")}.`
          : canCall() ? "Reading the board…" : "This host does not let the view read the board's geometry.";
      return Shell.state("info", "The parts come with the board's geometry", why);
    }
    const rows = geo.parts.filter(Boolean).map((part) => ({
      id: part.index, part, name: part.name, sch: geo.sch[String(part.index)] || "", side: ["top", "bottom", "not placed"][part.side],
      at: part.side === 2 ? "not placed" : fromOriginText(...partAt(part)), rot: round(part.rot, 2), dnp: geo.dnp.has(part.index) ? "Not Fitted" : "",
    }));
    return Shell.table({
      label: "Parts", rows, rowKey: (row) => row.id,
      onActivate: (row) => {
        goTo({ kind: "part", name: row.name, box: { minx: row.part.minx, miny: row.part.miny, maxx: row.part.maxx, maxy: row.part.maxy },
               row: { where: "" }, at: null });
        view.selected = selectionOf({ kind: "part", part: row.part });
        renderPane();
        openDetails();
      },
      group: { key: (row) => row.side, order: (a, b) => ["top", "bottom", "not placed"].indexOf(a) - ["top", "bottom", "not placed"].indexOf(b) },
      columns: [
        { key: "name", label: "Designator", cls: "c-name", value: (row) => row.name },
        { key: "sch", label: "Schematic", hidden: !Object.keys(geo.sch).length },
        { key: "at", label: `At (from origin, ${view.units})` },
        { key: "rot", label: "Rotation", numeric: true },
        { key: "dnp", label: "Fitted" },
      ],
      sort: { key: "name", dir: 1 },
    });
  }

  // ---------- page ----------

  function heightLimit() {
    const dims = Shell.context().containerDimensions || {};
    return Number(dims.height || dims.maxHeight) || 0;
  }

  /** A host 980 px wide or less (details stacked under the board) too short for both:
   *  there the details take the board's place. */
  function compactHost() {
    const limit = heightLimit();
    return window.innerWidth <= 980 && limit > 0 && limit < 760;
  }

  /** Whether the Layers panel opens by itself: on a roomy host with no height limit, or
   *  a tall one (taller still for many layers), so the board keeps most of the height;
   *  in full screen by the host's height (the window's when it gives none). */
  function layersRoomy() {
    if (!Shell.roomy()) return false;
    const fullscreen = Shell.context().displayMode === "fullscreen";
    const limit = heightLimit() || (fullscreen ? window.innerHeight : 0);
    const layers = view.data ? view.data.copper_layers.length : 0;
    return limit === 0 || limit >= (layers <= 6 ? 900 : 1300);
  }

  function renderLayout() {
    if (!ui.layout) return;
    ui.layout.classList.toggle("solo", Boolean(view.solo && view.selected));
    // The details in the board's place: the board's tools are of no use then.
    app.classList.toggle("solo-details", Boolean(view.solo && view.selected));
    scheduleDraw(true);
  }

  function updateBoardLabel() {
    if (!ui.board || !view.data) return;
    const h = view.data.highlight;
    const shown = geo ? geo.layers.filter((layer) => isCopperId(layer.id) && layerVisible(layer.id)).map((layer) => layer.name) : view.data.view.layers_on;
    ui.board.setAttribute("aria-label", `Board ${view.data.pcb_doc}, viewed from the ${view.side}${view.side === "bottom" ? " (mirrored)" : ""}; ` +
      `copper shown: ${shown.join(", ") || "none"}; highlighted: ${plural(h.nets_total, "net")}, ${plural(h.parts_total, "part")}, ` +
      `${plural(h.pads_total, "pad")}, ${plural(h.marks_total, "mark")}, ${plural(h.measures_total, "measure")}.`);
  }

  /** A dismissible notice that stays dismissed when the notices are drawn again. */
  function noticeOnce(kind, text) {
    const dismissed = view.dismissed || (view.dismissed = new Set());
    if (dismissed.has(text)) return null;
    const box_ = Shell.notice(kind, text);
    const button = box_.querySelector("button");
    if (button) button.addEventListener("click", () => dismissed.add(text));
    return box_;
  }

  function renderNotices() {
    if (!ui.notices || !view.data) return;
    Shell.keepFocus(ui.notices, () => {
      clear(ui.notices);
      const data = view.data;
      const h = data.highlight;
      const add = (node) => { if (node) ui.notices.appendChild(node); };
      const infos = [];
      if (view.closed) add(Shell.notice("warning", "The view was closed: it sends no more requests, and its server buttons are gone."));
      if (view.warning) add(noticeOnce("warning", view.warning));
      for (const [, item] of view.messages || []) add(noticeOnce(item.kind, item.text));
      if (!canCall()) {
        add(noticeOnce("info", `This host does not let the view read the board's geometry (${GEOMETRY_TOOL}): shown is where the highlighted objects lie.`));
      }
      if (view.changed) {
        const box_ = el("div", { class: "notice warning", role: "status" },
          el("span", { class: "grow", text: "The board changed since this answer (saved again, or another board loaded): the pages read so far are drawn." }),
          canCall() && !view.closed ? el("button", { type: "button", class: "btn-link", text: "Reload", title: `Call get_board_view again (${argsText(view.argsKnown ? view.args : askedArgs()) || "no arguments"})`, on: { click: reload } }) : null);
        add(box_);
      } else if (view.stopReason) {
        const missing = view.readQueue.length;
        // Before page 1 arrives the page count is not known: say what is shown instead.
        const what = geo ? `Drawn is what arrived; ${plural(missing, "page")} not read.`
          : "None of the board's geometry arrived: shown is where the highlighted objects lie, from the text.";
        const button = canCall() && !view.closed && (geo ? missing && view.sessionBudget && view.sessionBudget.left > 0 : true)
          ? el("button", { type: "button", class: "btn-link", text: geo && /at most/.test(view.stopReason) ? `Read the remaining ${plural(missing, "page")}` : "Retry", on: { click: retry } }) : null;
        add(el("div", { class: "notice warning", role: "status" },
          el("span", { class: "grow", text: `Reading the board stopped: ${view.stopReason.replace(/\.$/, "")}. ${what}` }), button));
      }
      // The notes, and on a short host the warnings about the answer too, fold so the
      // board keeps the height; what asks for an action (Reload, Retry) stays in sight.
      const foldable = [];
      const missingRows = h.not_found;
      if (missingRows.length) {
        foldable.push(["warning", `Not found (${missingRows.length < h.not_found_total ? `${missingRows.length} of ${h.not_found_total}` : h.not_found_total}): ${missingRows.slice(0, 4).map((row) => `${row.asked} (${row.why}${(row.suggestions || []).length ? `; try ${row.suggestions.slice(0, 3).join(", ")}` : ""})`).join("; ")}` +
          (h.not_found_total > 4 ? `; ${h.not_found_total - 4} more in Objects` : "") + "."]);
      }
      const hints = h.marks.filter((row) => row.frame_hint);
      if (hints.length) foldable.push(["warning", `${hints.map((row) => `${row.label}: ${row.frame_hint}`).join("; ")}.`]);
      for (const note of data.notes || []) infos.push(note);
      // The geometry's own notes beyond the fixed "not drawn" list (the legend has it),
      // and how the board is paged while pages are still to read.
      const fixed = new Set(data.view.not_drawn || []);
      if (geo) {
        if (geo.paging && geo.plan.some((entry) => !view.loadedPages.has(entry.page))) infos.push(geo.paging);
        for (const note of geo.notes.filter((item) => !fixed.has(item) && !/embedded board/.test(item))) infos.push(note);
      }
      const roomy = Shell.roomy();
      const warnings = foldable.map(([kind, text]) => noticeOnce(kind, text)).filter(Boolean);
      if (roomy) warnings.forEach(add);
      const notes = infos.map((text) => noticeOnce("info", text)).filter(Boolean);
      const folded = roomy ? notes : [...warnings, ...notes];
      if (!folded.length) return;
      if (roomy) {
        add(el("details", { class: "more notes-box" }, el("summary", { text: `Notes (${folded.length})` }), folded));
        // Open on a roomy host: the notes are in sight unless the user folds them.
        ui.notices.lastChild.open = view.notesOpen !== false;
      } else {
        const label = [warnings.length ? plural(warnings.length, "warning") : "", notes.length ? plural(notes.length, "note") : ""].filter(Boolean).join(", ");
        add(el("details", { class: "more notes-box" }, el("summary", { text: label[0].toUpperCase() + label.slice(1) }), folded));
        ui.notices.lastChild.open = view.notesOpen === true;
      }
      ui.notices.lastChild.addEventListener("toggle", (event) => { view.notesOpen = event.target.open; });
    });
  }

  function layerRow(layer) {
    const box_ = el("input", { type: "checkbox", "aria-label": `Show ${layer.name}` });
    box_.checked = layerVisible(layer.id);
    box_.dataset.layer = String(layer.id);
    box_.addEventListener("change", () => setLayer(layer.id, box_.checked));
    const pouredPages = geo.plan.filter((entry) => !entry.auto && !view.loadedPages.has(entry.page) && entry.chunks.some(([kind, id]) => kind.startsWith("poured_") && id === layer.id));
    const poured = pouredPages.length;
    const pouredSize = Math.round(pouredPages.reduce((sum, entry) => sum + entry.chars, 0) / 1000);
    return el("div", { class: "layer-row" },
      el("label", {}, box_, el("span", { class: `sw ${swatchClass(layer.id)}` }), el("span", { class: "name", text: layer.name })),
      el("button", { type: "button", class: "btn-link", text: "Only", title: `Show ${layer.name} only`, on: { click: () => only(layer.id) } }),
      poured && canCall() && !view.closed ? el("button", { type: "button", class: "btn-link load", text: `Load poured copper (${plural(poured, "page")}, ${pouredSize} kB)`,
                                          on: { click: () => loadPoured(layer.id) } }) : null);
  }

  function otherRow(item) {
    const box_ = el("input", { type: "checkbox", "aria-label": `Show ${item.label}` });
    box_.checked = view.other.has(item.id);
    box_.dataset.other = item.id;
    box_.addEventListener("change", () => {
      if (box_.checked) view.other.add(item.id);
      else view.other.delete(item.id);
      changedLayers();
    });
    return el("div", { class: "layer-row" }, el("label", {}, box_, el("span", { class: "name", text: item.label })));
  }

  function renderLayers() {
    if (!ui.layersBody || !view.data) return;
    Shell.keepFocus(ui.layersBody, () => {
      clear(ui.layersBody);
      if (!geo) {
        ui.layersBody.appendChild(el("p", { class: "muted small", text: canCall() ? "The layers come with the board's geometry." : "The layers need the board's geometry, which this host does not let the view read." }));
        return;
      }
      const group = (title, layers) => (layers.length ? el("div", { class: layers.length > 6 ? "many" : null },
        el("h3", { text: title }), el("div", { class: "rows" }, layers.map(layerRow))) : null);
      const top = geo.layers.filter((layer) => layer.id === TOP_OVERLAY || layer.id === TOP);
      const inner = geo.layers.filter((layer) => layer.kind === "inner" || layer.kind === "plane");
      const bottom = geo.layers.filter((layer) => layer.id === BOTTOM || layer.id === BOTTOM_OVERLAY);
      const onRequest = geo.plan.filter((entry) => !entry.auto && !view.loadedPages.has(entry.page)).length;
      Shell.append(ui.layersBody, [
        el("div", { class: "toolbar" },
          el("span", { class: "chips-label", text: "Show" }),
          el("button", { type: "button", class: "btn", text: "Top", on: { click: () => preset("top") } }),
          el("button", { type: "button", class: "btn", text: "Bottom", on: { click: () => preset("bottom") } }),
          el("button", { type: "button", class: "btn", text: "Highlighted layers", on: { click: () => preset("highlighted") } }),
          el("button", { type: "button", class: "btn", text: "All copper", on: { click: () => preset("all") } }),
          onRequest && canCall() && !view.closed ? el("button", { type: "button", class: "btn", text: `Load all poured copper (${plural(onRequest, "page")})`, on: { click: () => loadPoured(null) } }) : null),
        el("p", { class: "muted small", text: `Poured copper: ${view.data.view.poured_copper}.` }),
        el("div", { class: "layer-groups" },
          group("Top side", top), group("Inner", inner), group("Bottom side", bottom),
          el("div", {}, el("h3", { text: "Other" }), OTHER.map(otherRow),
            el("div", { class: "layer-row" }, el("label", {}, (() => {
              const dim = el("input", { type: "checkbox", "aria-label": "Dim the others" });
              dim.checked = view.dim;
              dim.addEventListener("change", () => { view.dim = dim.checked; scheduleDraw(false); });
              return dim;
            })(), el("span", { class: "name", text: "Dim others" }))))),
      ]);
    });
  }

  function syncLayerBoxes() {
    if (!ui.layersBody) return;
    for (const input of ui.layersBody.querySelectorAll("input[data-layer]")) input.checked = layerVisible(Number(input.dataset.layer));
    for (const input of ui.layersBody.querySelectorAll("input[data-other]")) input.checked = view.other.has(input.dataset.other);
  }

  function legend() {
    // Inner layers take the colours in turn, top down (one swatch per inner layer).
    const inner = Math.max(0, (view.data.copper_layers || []).length - 2);
    const items = [
      [["l-top"], "Top"], [["l-bottom"], "Bottom"],
      inner ? [Array.from({ length: Math.min(inner, COLORS.inner.length) }, (_, index) => `l-i${index}`),
               inner === 1 ? "inner" : `inner, top down${inner > COLORS.inner.length ? " (colours repeat)" : ""}`] : null,
      [["l-multi"], "Multi-Layer, vias"], [["l-overlay-top"], "Top Overlay"], [["l-overlay-bottom"], "Bottom Overlay"],
      [["l-hatch"], "Not Fitted"], [["l-mark"], "mark"], [["l-measure"], "measure"],
      // Each highlighted net's halo colour.
      ...view.targets.filter((target) => target.kind === "net").slice(0, COLORS.halo.length)
        .map((target) => [[`h-${COLORS.halo.indexOf(target.color)}`], `${target.name} (halo)`]),
    ].filter(Boolean);
    const notDrawn = (view.data.view.not_drawn || []).slice(0, 3).join("; ");
    return el("div", { class: "legend" },
      el("span", { class: "legend-keys", "aria-hidden": "true" },
        items.map(([classes, text]) => el("span", {}, classes.map((cls) => el("span", { class: `sw ${cls}` })), text))),
      notDrawn ? el("span", { text: `Not drawn: ${notDrawn}${view.data.view.not_drawn.length > 3 ? "; …" : ""}`,
                              title: view.data.view.not_drawn.join("; ") }) : null,
      geo && geo.embedded ? el("span", { text: `${plural(geo.embedded, "embedded board array")} of a panel not drawn` }) : null);
  }

  function updateReadout(x, y) {
    if (!ui.coords) return;
    ui.coords.textContent = `${fromOriginText(x, y, view.readoutUnits)} from origin`;
  }

  function updateScaleBar() {
    if (!ui.scaleBar || !view.scale) return;
    const units = view.readoutUnits || view.units;
    const steps = units === "mm" ? [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200] : [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
    const target = 80 / view.scale;  // mil in 80 px
    const value = steps.find((step) => toMil(step, units) >= target * 0.6) || steps[steps.length - 1];
    ui.scaleBar.style.width = `${Math.round(toMil(value, units) * view.scale)}px`;
    ui.scaleText.textContent = `${value} ${units}`;
  }

  function renderTab() {
    if (!ui.content || !view.data) return;
    ui.boardWrap.hidden = view.tab !== "board";
    if (ui.tableHost) ui.tableHost.remove();
    ui.tableHost = null;
    if (view.tab === "objects") ui.tableHost = objectsTable().el;
    else if (view.tab === "parts") {
      const built = partsTable();
      ui.tableHost = built.el || built;
    }
    if (ui.tableHost) ui.content.appendChild(ui.tableHost);
    if (view.tab === "board") scheduleDraw(true);
  }

  function renderAll() {
    const data = view.data;
    const h = data.highlight;
    const mark = Shell.focusMark(app);
    ui.content = el("div", { class: "content" });
    ui.pane = el("aside", { class: "pane idle", "aria-label": "Details" });
    ui.layout = el("div", { class: "layout" }, ui.content, ui.pane);
    ui.notices = el("div", {});
    ui.base = ui.base || el("canvas", { "aria-hidden": "true" });
    ui.over = ui.over || el("canvas", { "aria-hidden": "true" });
    ui.hint = ui.hint || el("div", { class: "hint", hidden: true });
    ui.progress = ui.progress || el("div", { class: "progress", hidden: true, "aria-hidden": "true" });
    ui.keyHelp = ui.keyHelp || el("p", { class: "sr-only", id: "board-keys", text: KEY_HELP });
    if (!ui.board) {
      ui.board = el("div", { class: "board", tabindex: "0", role: "application", "aria-roledescription": "board view",
                             "aria-describedby": "board-keys" }, ui.base, ui.over, ui.hint, ui.progress);
      ui.over.addEventListener("pointerdown", onPointerDown);
      ui.over.addEventListener("pointermove", onPointerMove);
      ui.over.addEventListener("pointerup", onPointerUp);
      ui.over.addEventListener("pointercancel", onPointerUp);
      ui.over.addEventListener("dblclick", onDoubleClick);
      ui.board.addEventListener("wheel", onWheel, { passive: false });
      ui.board.addEventListener("keydown", onKey);
      if (typeof ResizeObserver === "function") new ResizeObserver(() => scheduleDraw(true)).observe(ui.board);
      window.addEventListener("resize", () => scheduleDraw(true));
    }
    const short = !Shell.roomy();
    view.renderedShort = short;
    ui.coords = el("span", { class: "coords", text: short ? "x, y: point at the board" : "Move over the board for coordinates" });
    ui.scaleBar = el("span", { class: "bar" });
    ui.scaleText = el("span", { text: "" });
    const readoutSwitch = Shell.segmented({ label: "Units", current: view.readoutUnits || view.units,
      items: [{ id: "mil", label: "mil" }, { id: "mm", label: "mm" }],
      onChange: (id) => { view.readoutUnits = id; updateScaleBar(); } });
    // On a short host the legend folds behind "More" (below), so the board keeps the height.
    ui.boardWrap = el("div", {}, ui.board,
      el("div", { class: "readout" }, ui.coords, readoutSwitch.el, el("span", { class: "scalebar" }, ui.scaleBar, ui.scaleText)),
      short ? null : legend(), ui.keyHelp);
    ui.content.appendChild(ui.boardWrap);
    ui.zoom = el("span", { class: "zoom", "aria-live": "off", text: "" });
    ui.sideSwitch = Shell.segmented({ label: "View from", current: view.side,
      items: [{ id: "top", label: "Top" }, { id: "bottom", label: "Bottom", title: "Viewed from below, mirrored (as View > Flip Board)" }],
      onChange: (id) => setSide(id) });
    const findBox = el("input", { type: "search", class: "filter find", placeholder: "Find net or part", "aria-label": "Find a net or part (highlighted in the view)" });
    findBox.addEventListener("keydown", (event) => {
      if (event.key === "Enter") find(findBox.value);
      if (event.key === "Escape" && findBox.value) { findBox.value = ""; event.stopPropagation(); }
    });
    ui.displayButton = ui.displayButton || Shell.displayModeButton((error) => message("display", "error", `The host did not change the display mode: ${error.message}`));
    // On a short host Fit highlight, the side switch, the find box, Clear highlight, Full
    // screen and the legend fold behind "More", so the toolbar keeps to one line.
    const fitHighlightButton = el("button", { type: "button", class: "btn", text: "Fit highlight", on: { click: fitHighlight } });
    const more = [short ? fitHighlightButton : null, short ? ui.sideSwitch.el : null, findBox,
                  el("button", { type: "button", class: "btn", text: "Clear highlight", on: { click: clearHighlight } }), ui.displayButton,
                  short ? el("details", { class: "more legend-box" }, el("summary", { text: "Legend" }), legend()) : null];
    const toolbar = el("div", { class: "toolbar board-tools" },
      el("button", { type: "button", class: "btn", text: "−", title: "Zoom out", "aria-label": "Zoom out", on: { click: () => zoomAt(0.8) } }),
      ui.zoom,
      el("button", { type: "button", class: "btn", text: "+", title: "Zoom in", "aria-label": "Zoom in", on: { click: () => zoomAt(1.25) } }),
      el("button", { type: "button", class: "btn", text: "Fit board", on: { click: fitBoard } }),
      short ? null : fitHighlightButton,
      view.targets.length ? [
        el("button", { type: "button", class: "btn", text: "◀", title: "The previous highlighted object (P)",
                       "aria-label": "Previous highlighted object", on: { click: () => stepTarget(-1) } }),
        el("button", { type: "button", class: "btn", text: "▶", title: "The next highlighted object (N)",
                       "aria-label": "Next highlighted object", on: { click: () => stepTarget(1) } })] : null,
      short ? null : ui.sideSwitch.el,
      short ? el("details", { class: "more-tools" }, el("summary", { class: "btn", text: "More" }), el("div", { class: "toolbar" }, more)) : more);
    ui.layersBody = el("div", { class: "layers" });
    // Open as the user left it, else where there is room for it (layersRoomy).
    view.layersSet = view.layersUser === null ? layersRoomy() : view.layersUser;
    ui.layersBox = el("details", { class: "layers-box", open: view.layersSet }, el("summary", { text: "Layers" }), ui.layersBody);
    ui.layersBox.addEventListener("toggle", () => {
      // A toggle the view did not make is the user's: kept from then on.
      if (ui.layersBox.open !== view.layersSet) view.layersUser = ui.layersBox.open;
      view.layersSet = ui.layersBox.open;
    });
    const tabBar = Shell.tabs([
      { id: "board", label: "Board" },
      { id: "objects", label: `Objects (${objectRows().length})` },
      { id: "parts", label: geo ? `Parts (${geo.counts.parts || 0})` : "Parts" },
    ], (id) => {
      view.tab = id;
      renderTab();
    }, view.tab, ui.content);
    ui.tabBar = tabBar;
    const counts = [
      h.nets_total ? el("span", { class: "badge", text: plural(h.nets_total, "net") }) : null,
      h.parts_total ? el("span", { class: "badge", text: plural(h.parts_total, "part") }) : null,
      h.pads_total ? el("span", { class: "badge", text: plural(h.pads_total, "pad") }) : null,
      h.marks_total ? el("span", { class: "badge info", text: plural(h.marks_total, "mark") }) : null,
      h.measures_total ? el("span", { class: "badge info", text: plural(h.measures_total, "measure") }) : null,
      h.findings_total ? el("span", { class: "badge", text: `${plural(h.findings_total, "finding")} read` }) : null,
      h.not_found_total ? el("span", { class: "badge warning", text: `${h.not_found_total} not found` }) : null,
    ];
    const about = `${data.pcb_doc}, ${data.units}, variant ${data.variant}`;
    const asked = `Asked: ${askedLabel() || "the whole board"}`;
    app.classList.toggle("short", short);
    // A short host: the file, units, variant and the arguments on one line (cut short,
    // the whole of it in its title and for screen readers).
    clear(app).append(
      el("div", { class: "head" }, el("h1", { text: "Board view" }),
        short ? null : el("span", { class: "muted small", text: about }),
        el("span", { class: "summary" }, counts)),
      el("p", { class: "asked", text: short ? `${about}. ${asked}` : asked, title: short ? `${about}. ${asked}` : null }),
      ui.notices, toolbar, ui.layersBox, tabBar.el, ui.layout);
    renderNotices();
    renderLayers();
    renderTab();
    renderPane();
    updateBoardLabel();
    updateZoomLabel();
    scheduleDraw(true);
    if (mark) Shell.refocus(app, mark, () => ui.board);
  }

  // ---------- host ----------

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && view.selected && !event.defaultPrevented && event.target !== ui.board) closeDetails();
  });
  Shell.on("toolInput", (args) => {
    view.args = args || {};
    view.argsKnown = true;
    if (!view.data) showState("loading", "Locating on the board", "get_board_view is reading the board.");
  });
  Shell.on("toolInputPartial", () => {
    if (!view.data) showState("loading", "Locating on the board", "Waiting for the tool's arguments.");
  });
  Shell.on("toolResult", (result) => onResult(result));
  Shell.on("toolCancelled", (reason) => {
    if (!view.data) showState("info", "The get_board_view call was cancelled", reason || "No result to show.");
  });
  Shell.on("context", () => {
    scheduleDraw(true);
    if (view.solo && !compactHost()) {
      view.solo = false;
      renderLayout();
    }
    if (!view.data || view.errorPayload || !ui.layersBox) return;
    // Full screen, or a host that changes size: fold or open what depends on the room.
    if (view.renderedShort !== !Shell.roomy()) {
      renderAll();
      return;
    }
    if (view.layersUser === null && ui.layersBox.open !== layersRoomy()) {
      view.layersSet = layersRoomy();
      ui.layersBox.open = view.layersSet;
    }
  });
  Shell.on("teardown", () => {
    view.closed = true;
    closeCalls();
    setProgress("");
    if (view.data) {
      renderNotices();
      renderLayers();
      renderPane();
      if (view.tab === "parts") renderTab();
    }
    else showState("info", "The view was closed", "It sends no more requests.");
  });

  // Hooks for checking the drawing (timings), read by tests and the simulator only.
  window.boardView = {
    stats: () => ({ decode: view.decodeMs, base: view.lastBaseMs, draw: view.lastDrawMs, batch: view.lastBatchMs, highlight: view.lastHighlightMs,
                    grid: view.lastGridMs, hit: view.lastHitMs, pages: view.loadedPages.size, reading: view.reading,
                    stopped: view.stopReason, scale: view.scale, labels: (view.labels || []).map((box) => [Math.round(box.x), Math.round(box.y), Math.round(box.w)]) }),
    // A full redraw, timed until the pixels are there (a read of one pixel waits for it).
    redraw: (overlayOnly = false) => {
      const started = performance.now();
      if (!overlayOnly) baseDirty = true;
      draw();
      for (const canvas of [ui.base, ui.over]) canvas.getContext("2d").getImageData(0, 0, 1, 1);
      return performance.now() - started;
    },
    profile: () => {
      view.profiling = [];
      view.profileStart = performance.now();
      baseDirty = true;
      draw();
      ui.over.getContext("2d").getImageData(0, 0, 1, 1);
      const out = [...view.profiling, ["overlay", Math.round(performance.now() - view.profileStart)]];
      view.profiling = null;
      return out;
    },
    hit: (sx, sy) => { clickAt(sx, sy); return view.selected ? view.selected.kind : null; },
    // What is highlighted and selected (net ids, part indices, pads as part and pin).
    sets: () => {
      const sets = highlightSets();
      return { nets: [...sets.nets], parts: [...sets.parts], pads: sets.pads.map((found) => [found.pad.part, found.pad.pin]),
               selected: view.selected ? `${view.selected.kind} ${view.selected.name || ""}`.trim() : null };
    },
    at: (sx, sy) => {
      const size = canvasSize();
      const [x, y] = toBoard(sx, sy, size);
      return { x, y, size, inside: insideBoard(x, y), hits: hitTest(x, y).map((item) => item.kind) };
    },
  };

  showState("loading", "Connecting to the host", "");
  Shell.connect({ name: "altium-copilot-kc board view", version: "1.0.0" })
    .then(() => {
      if (!view.data) showState("loading", "Waiting for get_board_view", "The board appears when the tool's result arrives.");
    })
    .catch((error) => showState("error", "This view needs a host that shows MCP Apps", error.message));
})();
</script>
</body>
</html>
